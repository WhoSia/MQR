name: MQR 4.33 Closure Certificate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mqr-4.33-closure.yml'
      - 'experiments/mqr-4.33/**'
      - 'receipts/mqr-4.33/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Format gate
        run: cargo fmt --manifest-path experiments/mqr-4.33/rust/Cargo.toml -- --check
      - name: Clippy gate
        run: cargo clippy --manifest-path experiments/mqr-4.33/rust/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path experiments/mqr-4.33/rust/Cargo.toml
      - name: Release build
        run: cargo build --manifest-path experiments/mqr-4.33/rust/Cargo.toml --release
      - name: Frozen forcing-world certificate
        shell: bash
        run: |
          set -euo pipefail
          BIN=./experiments/mqr-4.33/rust/target/release/mqr433
          OUT=/tmp/forcing.out
          "$BIN" experiments/mqr-4.33/forcing-worlds.tsv | tee "$OUT"
          grep -F 'TRIANGLE=F0' "$OUT" | grep -F 'composition=COMPOSITION_PASS'
          grep -F 'TRIANGLE=F1' "$OUT" | grep -F 'composition=NONTRANSITIVITY_WITNESS'
          grep -F 'TRIANGLE=F2' "$OUT" | grep -F 'composition=PATH_DIVERGENT_PASS'
          grep -F 'TRIANGLE=F3' "$OUT" | grep -F 'composition=COMPOSITION_SPLIT_REQUIRED'
          grep -F 'FORCING_EXPECTATION_MISMATCHES=0' "$OUT"
          grep -F 'STRUCTURAL_CLASS_MISMATCHES=0' "$OUT"
          echo 'MQR433_FORCING_WORLDS=PASS'
      - name: Inherited TKN classifier defeat
        shell: bash
        run: |
          set -euo pipefail
          BIN=./experiments/mqr-4.33/rust/target/release/mqr433
          OUT=/tmp/tkn-cal.out
          "$BIN" experiments/mqr-4.33/calibration/tkn-001.tsv | tee "$OUT"
          grep -F 'TRIANGLE=TKN-001-CAL' "$OUT" | grep -F 'composition=COMPOSITION_PASS' | grep -F 'prediction_match=false'
          grep -F 'FORCING_EXPECTATION_MISMATCHES=1' "$OUT"
          grep -F 'SUPPORT_DOMAIN_DISCOVERY=HOLD' "$OUT"
          echo 'MQR433_S1_DETERMINISTIC_PREDICTOR=DEFEATED'
      - name: Frozen profile quotient collision
        shell: bash
        run: |
          set -euo pipefail
          BIN=./experiments/mqr-4.33/rust/target/release/mqr433-collision
          OUT=/tmp/collision.out
          "$BIN" experiments/mqr-4.33/collision/support-profile-collision.tsv | tee "$OUT"
          grep -F 'PROFILE_COLLISION_COUNT=1' "$OUT"
          grep -F 'SUPPORT_PROFILE_IDENTIFIABILITY=FAIL' "$OUT"
          grep -F 'OUTCOME_FACTORIZATION_THROUGH_FROZEN_PROFILE=FAIL' "$OUT"
          grep -F 'FROZEN_SUPPORT_QUOTIENT_SUFFICIENCY=FAIL' "$OUT"
          echo 'MQR433_SUPPORT_QUOTIENT=INSUFFICIENT'
      - name: CODATA diagnostic recomputation
        shell: bash
        run: |
          set -euo pipefail
          BIN=./experiments/mqr-4.33/rust/target/release/mqr433-codata
          OUT=/tmp/codata.tsv
          LOG=/tmp/codata.log
          "$BIN" experiments/mqr-4.33/codata/codata-values.tsv > "$OUT" 2> "$LOG"
          diff -u experiments/mqr-4.33/codata/codata-z-results.tsv "$OUT"
          grep -F 'CODATA_TRIANGLES=12' "$LOG"
          grep -F 'COMPOSITION_CANDIDATES=2' "$LOG"
          grep -F 'CANDIDATE_DIRECT_PASS=2' "$LOG"
          grep -F 'CANDIDATE_DIRECT_FAIL=0' "$LOG"
          echo 'MQR433_CODATA_RECOMPUTATION=PASS'
          echo 'MQR433_CODATA_NONTRANSITIVITY_WITNESSES=0'
      - name: Fresh TOML admission and minimal diagnostic witness
        shell: bash
        run: |
          set -euo pipefail
          grep -F $'A_TO_B\tTRANSPORT_FAIL' receipts/mqr-4.33/toml-bridge.tsv
          grep -F $'B_TO_C\tTRANSPORT_PASS' receipts/mqr-4.33/toml-bridge.tsv
          grep -F $'COMPOSITION_CANDIDATE\tNO' receipts/mqr-4.33/toml-bridge.tsv
          grep -F $'DIAGNOSTIC\tCOMPONENT_IDENTITY_ASSUMPTION_DEFEATED' receipts/mqr-4.33/toml-bridge.tsv
          grep -F 'MINIMAL-WITNESS=H04' experiments/mqr-4.33/external/toml/POSTFAIL_RECEIPT.md
          grep -F 'PROMOTION-CREDIT=ZERO' experiments/mqr-4.33/external/toml/POSTFAIL_RECEIPT.md
          echo 'MQR433_FRESH_TOML=COMPONENT_IDENTITY_ASSUMPTION_DEFEATED'
          echo 'MQR433_DIAGNOSTIC_MINIMAL_WITNESS=H04'
      - name: Pre-outcome promotion ceiling remains binding
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'FRESH-RESEARCH-LAB-N=0-MAX' experiments/mqr-4.33/CANDIDATE_MANIFEST.md
          grep -F 'SUPPORT_DOMAIN_DISCOVERY=STRUCTURALLY-HOLD' experiments/mqr-4.33/CANDIDATE_MANIFEST.md
          grep -F 'POST-REVEAL-REPLACEMENT=FORBIDDEN' experiments/mqr-4.33/CANDIDATE_MANIFEST.md
          echo 'MQR433_SUPPORT_DOMAIN_DISCOVERY=HOLD'
          echo 'MQR433_POST_REVEAL_RESCUE=FORBIDDEN'
      - name: Closure summary
        shell: bash
        run: |
          echo 'MQR433_COUNTEREXAMPLE_FIRST=PASS'
          echo 'MQR433_EXTERNAL_FRESH_NONTRANSITIVITY=NOT_EARNED'
          echo 'MQR433_DIAGNOSTIC_NONTRANSITIVITY=MINIMAL_H04'
          echo 'MQR433_CLASSIFIER_SELF_FALSIFICATION=PASS'
          echo 'MQR433_FROZEN_SUPPORT_QUOTIENT_IDENTIFIABILITY=FAIL'
          echo 'MQR433_STRONGEST_EARNED_RESULT=SUPPORT_REPRESENTATION_INSUFFICIENT'
          echo 'MQR433_SUPPORT_DOMAIN_DISCOVERY=HOLD'
