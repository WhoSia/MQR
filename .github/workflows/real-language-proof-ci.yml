# mqr-4.43-final-same-head-seal
# mqr-4.42-final-doctrine-seal-proof
# mqr-4.42-final-same-head-seal
name: Real-Language v0.4–v0.16 Lean Proof Boundary
# canonical-proof-trigger: pinned-lean4export-plus-nanoda

on:
  push:
    branches: [main]
    paths:
      - 'language/real/lean/**'
      - 'language/real/V04-PRESEAL.md'
      - 'language/real/V05-AUTHORITY-TRANSFER.md'
      - 'language/real/V06-COMPOSITION.md'
      - 'language/real/V10-ALLOCATION.md'
      - 'language/real/V11-OBLIGATION-CONSTITUTION.md'
      - 'language/real/V12-BURDEN-REVISION.md'
      - 'language/real/V13-TRANSLATION-AUTHORITY.md'
      - 'language/real/V14-CHALLENGE-CONSTITUTION.md'
      - 'language/real/V15-ROUTE-ONTOLOGY.md'
      - 'language/real/V16-DEFEAT-CONTENT.md'
      - '.github/workflows/real-language-proof-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  lean-proof-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with pinned Lean kernel
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false

      - name: Inspect theorem axiom ancestry
        shell: bash
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/Residue.lean | tee /tmp/lean-residue.log
          lake env lean MQR/Authority.lean | tee /tmp/lean-authority.log
          lake env lean MQR/Transfer.lean | tee /tmp/lean-transfer.log
          lake env lean MQR/Composition.lean | tee /tmp/lean-composition.log
          lake env lean MQR/Frontier.lean | tee /tmp/lean-frontier.log
          lake env lean MQR/Allocation.lean | tee /tmp/lean-allocation.log
          lake env lean MQR/Constitution.lean | tee /tmp/lean-constitution.log
          lake env lean MQR/Revision.lean | tee /tmp/lean-revision.log
          lake env lean MQR/MapAuthority.lean | tee /tmp/lean-map-authority.log
          lake env lean MQR/Challenge.lean | tee /tmp/lean-challenge.log
          lake env lean MQR/RouteOntology.lean | tee /tmp/lean-route-ontology.log
          lake env lean MQR/DefeatContent.lean | tee /tmp/lean-defeat-content.log
          cat /tmp/lean-residue.log /tmp/lean-authority.log /tmp/lean-transfer.log /tmp/lean-composition.log /tmp/lean-frontier.log /tmp/lean-allocation.log /tmp/lean-constitution.log /tmp/lean-revision.log /tmp/lean-map-authority.log /tmp/lean-challenge.log /tmp/lean-route-ontology.log /tmp/lean-defeat-content.log > /tmp/lean-proof-boundary.log
          if grep -F 'sorryAx' /tmp/lean-proof-boundary.log; then
            echo 'Finished proof unexpectedly depends on sorryAx' >&2
            exit 1
          fi
          theorems=(
            MQR.zeroInternalResidueOfComplete
            MQR.extensionContainsUncoveredProbe
            MQR.checkedProofCannotRaiseHoldToPass
            MQR.smallClosedLargeOpen
            MQR.receiptCompressionLosesLoadBearingDistinction
            MQR.formalExpansionDoesNotEstablishWorldAdequacy
            MQR.checkerPluralityDoesNotEntailAuthorityTransfer
            MQR.formalCustodyDoesNotIdentifyTruthOrder
            MQR.sameFormalStatementCanAliasDifferentWorldPredicates
            MQR.formalScopeCanStrictlyExceedWorldSupport
            MQR.coarseCompilationCanEraseAuthorityChangingAncestor
            MQR.nominalReopenabilityDoesNotEntailDefeatReachability
            MQR.bridgeSelfCertificationAddsNoIndependentConstraint
            MQR.scientificAuthorityNeedNotRequireFormalCustody
            MQR.transferMeetCannotRaiseWorldAuthority
            MQR.authorityMeetAssociative
            MQR.authorityMeetPassIdentity
            MQR.noLaunderTransitive
            MQR.adjacentPassDoesNotEntailDirectPass
            MQR.authorityBaselineResetCanHideInflation
            MQR.localAssumptionsCanBeSeparatelySatisfiableButJointlyInconsistent
            MQR.localDefeatReachabilityDoesNotEntailGlobalDefeatReachability
            MQR.localScopePassDoesNotEntailCompositeScopeAdmissibility
            MQR.currentRivalSeparationDoesNotImplyQueryLanguageClosure
            MQR.repeatedNoDiscoveryDoesNotImplyFrontierCompleteness
            MQR.stableFcrCanAccompanyFrontierDiscovery
            MQR.rankIncreaseAloneDoesNotEstablishDiscoveryValue
            MQR.multipleGeneratorsDoNotImplyIndependentRivalSearch
            MQR.finiteGrammarClosureDoesNotImplyScientificFrontierClosure
            MQR.plausibleGeneratorPortfoliosCanYieldNonnestedFrontiers
            MQR.queryExtensionCanRevealPreviouslyHiddenRival
            MQR.conditionalFrontierGuidanceDoesNotRequireWorldCompleteness
            MQR.reopeningReserveDoesNotEstablishFrontierCompleteness
            MQR.observationallyEquivalentWorldsCanRequireOppositeEscapeActions
            MQR.noSingleTwinWorldActionCapturesBothEscapes
            MQR.noSingleActionCanCaptureBothTwinWorldEscapes
            MQR.noDeterministicPolicyOverVisibleSignatureCapturesBoth
            MQR.nominalReserveDoesNotImplyActivationCapability
            MQR.activationThresholdCanCertifyNarrowReserveCompetence
            MQR.equalScalarDebtCountDoesNotIdentifyDebtGeometry
            MQR.finiteDeclaredAntiStarvationCanBeCertified
            MQR.roundRobinVisitsEveryDeclaredLaneWithinOneCycle
            MQR.finiteRoundRobinPreventsUnitActivationStarvation
            MQR.proceduralCoverageDoesNotImplyWorldFrontierCompleteness
            MQR.localExploitationGainDoesNotLicenseExplorationRetirement
            MQR.setValuedAdmissibilityDoesNotIdentifyUniqueWorldOptimum
            MQR.frontierEscapeCanMandateAllocationReopening
            MQR.randomizedCoverageIsNotAnEpistemicOracle
            MQR.sameDeclaredBurdenCanHaveDifferentObligationCounts
            MQR.multipleAgendaSourcesDoNotImplyIndependentAncestry
            MQR.successorLabelDoesNotImplyBurdenCoverage
            MQR.fullSuccessorRefinementCanPreserveDeclaredBurden
            MQR.relabelingWithCoverageButWithoutDebtTransferCannotDischargeDebt
            MQR.explicitWithdrawalCanRetireConstitutionalDebt
            MQR.coveredSuccessorWithDebtTransferCanPreserveDebtContinuity
            MQR.observationallyEquivalentConstitutionsCanDifferOnOmittedBurden
            MQR.visibleConstitutionDoesNotDetermineOmittedBurden
            MQR.frontierEscapeCanMandateObligationReconstitution
            MQR.provenanceKindDoesNotCreateTruthOracle
            MQR.finiteConstitutionAuditDoesNotImplyWorldObligationCompleteness
            MQR.sameLabelDoesNotGuaranteeSameDeclaredBurden
            MQR.differentLabelsCanPreserveDeclaredChallengeProfile
            MQR.partialRefinementCannotDischargeFullDeclaredDebt
            MQR.fullRefinementCanPreserveDeclaredDebt
            MQR.mergeCarrierCardinalityDoesNotCollapseSourceDebtAncestry
            MQR.equalBurdenCountsDoNotIdentifyCrossVersionRelation
            MQR.directAndComposedRevisionPathsCanDisagree
            MQR.mappedSubspaceComparabilityDoesNotImplyWholeOntologyIdentity
            MQR.finiteRevisionTransportDoesNotImplyFutureRevisionClosure
            MQR.conflictLocalizationDoesNotIdentifyTrueWinner
            MQR.adjudicatorCountDoesNotImplyAncestryIndependence
            MQR.selfCertificationAddsNoIndependentWitness
            MQR.sameDeclaredSurfaceCanLeaveMultipleRelationsAdmissible
            MQR.adjudicatorConsensusDoesNotImplyUniqueWorldCorrespondence
            MQR.standardAgreementDoesNotCreateTruthOracle
            MQR.cyclicMetaSupportDoesNotCreateIndependentRoot
            MQR.worldFacingSeparatorCanNarrowWithoutClosingCorrespondence
            MQR.finiteMetaDebtCanRemainExplicitWithoutFinalOracle
            MQR.currentMappingAuthorityDoesNotImplyFutureTranslationClosure
            MQR.equalProbeCountsDoNotDetermineDefeatRouteCoverage
            MQR.equalProbeCountsDoNotDetermineAncestryIndependence
            MQR.oneRegisteredFamilyCanSupportOppositeCherryPickedNarrowings
            MQR.completeDeclaredRouteCoverageDoesNotImplyFutureChallengeCompleteness
            MQR.worldFacingCandidateDerivedScoringDoesNotEstablishIndependentDiscrimination
            MQR.challengeExpansionCanReopenPriorNarrowing
            MQR.repeatedFiniteChallengeStabilityDoesNotImplyFutureClosure
            MQR.worldFacingStatusAloneDoesNotCreateSelectionAuthority
            MQR.equalRouteCountsDoNotImplyEqualDefeatContent
            MQR.equalCoverageFractionsDoNotImplyCoverageEquivalence
            MQR.splittingOneRouteDoesNotCreateNewDefeatContent
            MQR.mergingRoutesDoesNotDischargeUncoveredPredecessorContent
            MQR.sameRouteLabelDoesNotGuaranteeRouteIdentity
            MQR.differentRouteLabelsCanPreserveDeclaredDefeatContent
            MQR.contentPreservingRefinementCanPreserveLocalCoverage
            MQR.hiddenRouteDiscoveryCanReopenLocallyWithoutGlobalNegation
            MQR.repeatedFiniteRouteStabilityDoesNotImplyFutureDefeatClosure
            MQR.equalContentCountsDoNotImplyEqualCounterfactualDefeatGeometry
            MQR.oneMechanismCanSupportMultipleManifestationsWithoutNewDefeatDimensions
            MQR.oneManifestationCanAliasMultipleMechanisms
            MQR.sameDefeatLabelDoesNotGuaranteeDefeatIdentity
            MQR.differentDefeatLabelsCanPreserveLocalCounterfactualRole
            MQR.counterfactuallyIdenticalSplitDoesNotCreateNewDefeatDistinction
            MQR.prospectiveSeparatorCanJustifyDefeatRefinement
            MQR.commonCauseDoesNotEntailDefeatContentIdentity
            MQR.localCounterfactualEquivalenceDoesNotImplyFutureEquivalence
            MQR.crossRepresentationRolePreservationCanSupportLocalTransport
            MQR.hiddenDefeatContentCanReopenLocallyWithoutGlobalNegation
            MQR.repeatedFiniteDefeatStabilityDoesNotImplyFinalDefeatAtoms
          )
          for theorem in "${theorems[@]}"; do
            grep -F "'$theorem' does not depend on any axioms" /tmp/lean-proof-boundary.log
          done
          echo REAL_LANGUAGE_LEAN_KERNEL=PASS
          echo REAL_LANGUAGE_AXIOM_ANCESTRY=EMPTY
          echo MQR439_COMPOSITION_ALGEBRA_AND_COUNTERMODELS=PASS

      - name: Build pinned independent checker stack
        shell: bash
        run: |
          set -euo pipefail
          cd language/real/lean
          git clone https://github.com/leanprover/lean4export.git _lean4export
          git -C _lean4export checkout 076e8e57707e813375e8f9da8bf989799ace9680
          cp lean-toolchain _lean4export/lean-toolchain
          (
            cd _lean4export
            lake build lean4export
          )
          git clone https://github.com/robsimmons/nanoda_lib.git _nanoda_lib
          git -C _nanoda_lib checkout 68d5ca9db226849b41a6fff59d796ff19d0a8840
          cargo build --release --manifest-path _nanoda_lib/Cargo.toml
          echo REAL_LANGUAGE_INDEPENDENT_STACK=BUILT

      - name: Independent nanoda replay
        shell: bash
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env _lean4export/.lake/build/bin/lean4export MQR --             MQR.zeroInternalResidueOfComplete             MQR.extensionContainsUncoveredProbe             MQR.checkedProofCannotRaiseHoldToPass             MQR.smallClosedLargeOpen             MQR.receiptCompressionLosesLoadBearingDistinction             MQR.formalExpansionDoesNotEstablishWorldAdequacy             MQR.checkerPluralityDoesNotEntailAuthorityTransfer             MQR.formalCustodyDoesNotIdentifyTruthOrder             MQR.sameFormalStatementCanAliasDifferentWorldPredicates             MQR.formalScopeCanStrictlyExceedWorldSupport             MQR.coarseCompilationCanEraseAuthorityChangingAncestor             MQR.nominalReopenabilityDoesNotEntailDefeatReachability             MQR.bridgeSelfCertificationAddsNoIndependentConstraint             MQR.scientificAuthorityNeedNotRequireFormalCustody             MQR.transferMeetCannotRaiseWorldAuthority             MQR.authorityMeetAssociative             MQR.authorityMeetPassIdentity             MQR.noLaunderTransitive             MQR.adjacentPassDoesNotEntailDirectPass             MQR.authorityBaselineResetCanHideInflation             MQR.localAssumptionsCanBeSeparatelySatisfiableButJointlyInconsistent             MQR.localDefeatReachabilityDoesNotEntailGlobalDefeatReachability             MQR.localScopePassDoesNotEntailCompositeScopeAdmissibility             MQR.currentRivalSeparationDoesNotImplyQueryLanguageClosure             MQR.repeatedNoDiscoveryDoesNotImplyFrontierCompleteness             MQR.stableFcrCanAccompanyFrontierDiscovery             MQR.rankIncreaseAloneDoesNotEstablishDiscoveryValue             MQR.multipleGeneratorsDoNotImplyIndependentRivalSearch             MQR.finiteGrammarClosureDoesNotImplyScientificFrontierClosure             MQR.plausibleGeneratorPortfoliosCanYieldNonnestedFrontiers             MQR.queryExtensionCanRevealPreviouslyHiddenRival             MQR.conditionalFrontierGuidanceDoesNotRequireWorldCompleteness             MQR.reopeningReserveDoesNotEstablishFrontierCompleteness             MQR.observationallyEquivalentWorldsCanRequireOppositeEscapeActions             MQR.noSingleTwinWorldActionCapturesBothEscapes             MQR.noSingleActionCanCaptureBothTwinWorldEscapes             MQR.noDeterministicPolicyOverVisibleSignatureCapturesBoth             MQR.nominalReserveDoesNotImplyActivationCapability             MQR.activationThresholdCanCertifyNarrowReserveCompetence             MQR.equalScalarDebtCountDoesNotIdentifyDebtGeometry             MQR.finiteDeclaredAntiStarvationCanBeCertified             MQR.roundRobinVisitsEveryDeclaredLaneWithinOneCycle             MQR.finiteRoundRobinPreventsUnitActivationStarvation             MQR.proceduralCoverageDoesNotImplyWorldFrontierCompleteness             MQR.localExploitationGainDoesNotLicenseExplorationRetirement             MQR.setValuedAdmissibilityDoesNotIdentifyUniqueWorldOptimum             MQR.frontierEscapeCanMandateAllocationReopening             MQR.randomizedCoverageIsNotAnEpistemicOracle             MQR.sameDeclaredBurdenCanHaveDifferentObligationCounts             MQR.multipleAgendaSourcesDoNotImplyIndependentAncestry             MQR.successorLabelDoesNotImplyBurdenCoverage             MQR.fullSuccessorRefinementCanPreserveDeclaredBurden             MQR.relabelingWithCoverageButWithoutDebtTransferCannotDischargeDebt             MQR.explicitWithdrawalCanRetireConstitutionalDebt             MQR.coveredSuccessorWithDebtTransferCanPreserveDebtContinuity             MQR.observationallyEquivalentConstitutionsCanDifferOnOmittedBurden             MQR.visibleConstitutionDoesNotDetermineOmittedBurden             MQR.frontierEscapeCanMandateObligationReconstitution             MQR.provenanceKindDoesNotCreateTruthOracle             MQR.finiteConstitutionAuditDoesNotImplyWorldObligationCompleteness             MQR.sameLabelDoesNotGuaranteeSameDeclaredBurden             MQR.differentLabelsCanPreserveDeclaredChallengeProfile             MQR.partialRefinementCannotDischargeFullDeclaredDebt             MQR.fullRefinementCanPreserveDeclaredDebt             MQR.mergeCarrierCardinalityDoesNotCollapseSourceDebtAncestry             MQR.equalBurdenCountsDoNotIdentifyCrossVersionRelation             MQR.directAndComposedRevisionPathsCanDisagree             MQR.mappedSubspaceComparabilityDoesNotImplyWholeOntologyIdentity             MQR.finiteRevisionTransportDoesNotImplyFutureRevisionClosure             MQR.conflictLocalizationDoesNotIdentifyTrueWinner             MQR.adjudicatorCountDoesNotImplyAncestryIndependence             MQR.selfCertificationAddsNoIndependentWitness             MQR.sameDeclaredSurfaceCanLeaveMultipleRelationsAdmissible             MQR.adjudicatorConsensusDoesNotImplyUniqueWorldCorrespondence             MQR.standardAgreementDoesNotCreateTruthOracle             MQR.cyclicMetaSupportDoesNotCreateIndependentRoot             MQR.worldFacingSeparatorCanNarrowWithoutClosingCorrespondence             MQR.finiteMetaDebtCanRemainExplicitWithoutFinalOracle             MQR.currentMappingAuthorityDoesNotImplyFutureTranslationClosure             MQR.equalProbeCountsDoNotDetermineDefeatRouteCoverage             MQR.equalProbeCountsDoNotDetermineAncestryIndependence             MQR.oneRegisteredFamilyCanSupportOppositeCherryPickedNarrowings             MQR.completeDeclaredRouteCoverageDoesNotImplyFutureChallengeCompleteness             MQR.worldFacingCandidateDerivedScoringDoesNotEstablishIndependentDiscrimination             MQR.challengeExpansionCanReopenPriorNarrowing             MQR.repeatedFiniteChallengeStabilityDoesNotImplyFutureClosure             MQR.worldFacingStatusAloneDoesNotCreateSelectionAuthority             MQR.equalRouteCountsDoNotImplyEqualDefeatContent             MQR.equalCoverageFractionsDoNotImplyCoverageEquivalence             MQR.splittingOneRouteDoesNotCreateNewDefeatContent             MQR.mergingRoutesDoesNotDischargeUncoveredPredecessorContent             MQR.sameRouteLabelDoesNotGuaranteeRouteIdentity             MQR.differentRouteLabelsCanPreserveDeclaredDefeatContent             MQR.contentPreservingRefinementCanPreserveLocalCoverage             MQR.hiddenRouteDiscoveryCanReopenLocallyWithoutGlobalNegation             MQR.repeatedFiniteRouteStabilityDoesNotImplyFutureDefeatClosure             MQR.equalContentCountsDoNotImplyEqualCounterfactualDefeatGeometry             MQR.oneMechanismCanSupportMultipleManifestationsWithoutNewDefeatDimensions             MQR.oneManifestationCanAliasMultipleMechanisms             MQR.sameDefeatLabelDoesNotGuaranteeDefeatIdentity             MQR.differentDefeatLabelsCanPreserveLocalCounterfactualRole             MQR.counterfactuallyIdenticalSplitDoesNotCreateNewDefeatDistinction             MQR.prospectiveSeparatorCanJustifyDefeatRefinement             MQR.commonCauseDoesNotEntailDefeatContentIdentity             MQR.localCounterfactualEquivalenceDoesNotImplyFutureEquivalence             MQR.crossRepresentationRolePreservationCanSupportLocalTransport             MQR.hiddenDefeatContentCanReopenLocallyWithoutGlobalNegation             MQR.repeatedFiniteDefeatStabilityDoesNotImplyFinalDefeatAtoms             > /tmp/mqr-real.export
          cat > /tmp/mqr-real-nanoda.json <<'JSON'
          {
            "export_file_path": "/tmp/mqr-real.export",
            "use_stdin": false,
            "permitted_axioms": [],
            "unpermitted_axiom_hard_error": true,
            "nat_extension": true,
            "string_extension": true,
            "print_success_message": true
          }
          JSON
          _nanoda_lib/target/release/nanoda_bin /tmp/mqr-real-nanoda.json | tee /tmp/nanoda-real.log
          echo REAL_LANGUAGE_NANODA_INDEPENDENT_CHECKER=PASS
          echo MQR439_NANODA_COMPOSITION_REPLAY=PASS
          echo MQR442_NANODA_FRONTIER_REPLAY=PASS
          echo MQR443_NANODA_ALLOCATION_REPLAY=PASS
          echo MQR444_NANODA_CONSTITUTION_REPLAY=PASS
          echo MQR445_NANODA_REVISION_REPLAY=PASS
          echo MQR446_NANODA_MAP_AUTHORITY_REPLAY=PASS
          echo MQR447_NANODA_CHALLENGE_REPLAY=PASS
          echo MQR448_NANODA_ROUTE_ONTOLOGY_REPLAY=PASS
          echo MQR449_NANODA_DEFEAT_CONTENT_REPLAY=PASS
          echo ALGEBRAIC_COMPOSABILITY_IS_NOT_EPISTEMIC_COMPOSABILITY=TRUE


      - name: Publish externally readable workflow receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          context="Real-Language/Lean+nanoda"
          description="run ${GITHUB_RUN_ID}: ${{ job.status }}"
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="$context" \
            -f description="$description" \
            -f target_url="$target"
