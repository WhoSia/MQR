name: MQR 4.92 — Precommitted Independent Original-Data Risk Pilot
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.92/serov_anemone_temporal_risk_pilot.py'
      - '.github/workflows/mqr-4.92-serov-real-risk-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-data-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded original model and estimator dependencies
        run: |
          python -m pip install --disable-pip-version-check             numpy==1.26.4 scipy==1.12.0 cvxopt==1.3.2 scikit-learn==1.5.1
      - name: Execute Frozen Temporal Target Risk Design Using Publisher Original Data
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/mqr-4.92           python experiments/mqr-4.92/serov_anemone_temporal_risk_pilot.py 2>&1 | tee mqr492-original-risk-pilot.log
          grep -Fx MQR492_SEROV_REAL_ORIGINAL_DATA_PILOT=PASS mqr492-original-risk-pilot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MQR492-Real-Original-Data-Temporal-Risk-Pilot
          path: |
            mqr492-original-risk-pilot.log
            mqr492-anemone-predeclared-real-source-risk.json
          retention-days: 30
