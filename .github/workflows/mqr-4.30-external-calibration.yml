name: MQR 4.30 External Calibration
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.30/**'
      - '.github/workflows/mqr-4.30-external-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate external criterion calibration
        run: python experiments/mqr-4.30/evaluate_external.py
