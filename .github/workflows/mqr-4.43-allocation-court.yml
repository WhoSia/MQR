# mqr-4.43-final-same-head-seal
name: MQR-4.43 Rival-Search Allocation Court

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.43/**'
      - 'language/real/src/allocation_v10.rs'
      - 'language/real/prolog/allocation_v10.pl'
      - 'language/real/examples/mqr-4.43-*.real'
      - 'language/real/tests/v10-invalid-*.real'
      - 'language/real/Cargo.toml'
      - '.github/workflows/mqr-4.43-allocation-court.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build v0.10
        run: cargo build --manifest-path language/real/Cargo.toml --release --bin real-v10-allocate
      - name: Install Prolog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swi-prolog-nox
      - name: Allocation court
        shell: bash
        run: |
          set -euo pipefail
          V=./language/real/target/release/real-v10-allocate
          P=language/real/prolog/allocation_v10.pl
          CORE='^allocation\.(budget|horizon|total_allocated|reserve_units|budget_valid|lane_count|mandatory_lane_count|ancestry_count|common_mode_detected|nominal_reserve|activation_capable_reserve|reserve_state|starvation_detected|exploration_debt_count|exploration_debt_items|exploration_debt_classes|debt_scalar_default|opportunity_cost_mode|exploitation_spend|reopening_spend|exploration_starved|greedy_yield_starvation_witness|escape_detected|escape_reallocation_required|reopen_on_escape|normative_prior|normative_utility|hidden_prior_inferred|hidden_utility_inferred|expected_discovery_value_inferred|unique_optimum_authorized|universal_next_action|local_optimizer_scope|guidance_mode|admissible_envelope|randomization_epistemic_oracle|policy_path_provenance|world_optimum_identified|world_frontier_complete|stopping_rule)='

          for f in language/real/examples/mqr-4.43-*.real; do
            "$V" "$f" > /tmp/rust
            swipl -q -s "$P" -g "run('$f'),halt" -t "halt(1)" > /tmp/prolog
            grep -E "$CORE" /tmp/rust > /tmp/rust.core
            grep -E "$CORE" /tmp/prolog > /tmp/prolog.core
            diff -u /tmp/rust.core /tmp/prolog.core
          done

          "$V" language/real/examples/mqr-4.43-twin-world-a.real > /tmp/twa
          "$V" language/real/examples/mqr-4.43-twin-world-b.real > /tmp/twb
          grep -E "$CORE" /tmp/twa > /tmp/twa.core
          grep -E "$CORE" /tmp/twb > /tmp/twb.core
          diff -u /tmp/twa.core /tmp/twb.core
          grep -F 'witness.escape_lane=A' /tmp/twa
          grep -F 'witness.escape_lane=B' /tmp/twb
          grep -F 'allocation.universal_next_action=UNIDENTIFIED' /tmp/twa
          grep -F 'allocation.unique_optimum_authorized=NO' /tmp/twa
          grep -F 'allocation.world_optimum_identified=NO' /tmp/twa

          "$V" language/real/examples/mqr-4.43-reserve-goodhart.real > /tmp/rg
          "$V" language/real/examples/mqr-4.43-reserve-live.real > /tmp/rl
          grep -F 'allocation.reserve_units=2' /tmp/rg
          grep -F 'allocation.reserve_units=2' /tmp/rl
          grep -F 'allocation.activation_capable_reserve=NO' /tmp/rg
          grep -F 'allocation.reserve_state=NOMINAL_ONLY' /tmp/rg
          grep -F 'allocation.activation_capable_reserve=YES' /tmp/rl
          grep -F 'allocation.reserve_state=LIVE' /tmp/rl

          "$V" language/real/examples/mqr-4.43-anti-starvation.real > /tmp/as
          grep -F 'allocation.starvation_detected=NO' /tmp/as
          grep -F 'allocation.exploration_debt_count=0' /tmp/as
          grep -F 'allocation.admissible_envelope=YES' /tmp/as
          grep -F 'allocation.world_frontier_complete=NO' /tmp/as

          "$V" language/real/examples/mqr-4.43-greedy-starvation.real > /tmp/gs
          grep -F 'allocation.starvation_detected=YES' /tmp/gs
          grep -F 'allocation.exploration_starved=YES' /tmp/gs
          grep -F 'allocation.greedy_yield_starvation_witness=YES' /tmp/gs

          "$V" language/real/examples/mqr-4.43-common-mode-inflation.real > /tmp/cm
          grep -F 'allocation.lane_count=3' /tmp/cm
          grep -F 'allocation.ancestry_count=2' /tmp/cm
          grep -F 'allocation.common_mode_detected=YES' /tmp/cm
          grep -F 'allocation.exploration_debt_count=1' /tmp/cm

          "$V" language/real/examples/mqr-4.43-debt-query.real > /tmp/dq
          "$V" language/real/examples/mqr-4.43-debt-representation.real > /tmp/dr
          grep -F 'allocation.exploration_debt_count=1' /tmp/dq
          grep -F 'allocation.exploration_debt_count=1' /tmp/dr
          grep -F 'allocation.exploration_debt_classes=QUERY' /tmp/dq
          grep -F 'allocation.exploration_debt_classes=REPRESENTATION' /tmp/dr
          grep -F 'allocation.debt_scalar_default=OFF' /tmp/dq
          grep -F 'allocation.opportunity_cost_mode=VECTOR' /tmp/dq

          "$V" language/real/examples/mqr-4.43-escape-reallocation.real > /tmp/esc
          grep -F 'allocation.escape_detected=YES' /tmp/esc
          grep -F 'allocation.escape_reallocation_required=YES' /tmp/esc
          grep -F 'allocation.reopen_on_escape=YES' /tmp/esc

          "$V" language/real/examples/mqr-4.43-declared-model-local.real > /tmp/model
          grep -F 'allocation.normative_prior=DECLARED' /tmp/model
          grep -F 'allocation.normative_utility=DECLARED' /tmp/model
          grep -F 'allocation.local_optimizer_scope=DECLARED_MODEL_ONLY' /tmp/model
          grep -F 'allocation.unique_optimum_authorized=NO' /tmp/model
          grep -F 'allocation.world_optimum_identified=NO' /tmp/model
          grep -F 'allocation.world_frontier_complete=NO' /tmp/model

          for x in language/real/tests/v10-invalid-*.real; do
            if "$V" "$x"; then
              echo "Rust unexpectedly accepted $x" >&2
              exit 1
            fi
            if swipl -q -s "$P" -g "run('$x'),halt" -t "halt(1)"; then
              echo "Prolog unexpectedly accepted $x" >&2
              exit 1
            fi
          done

          echo REAL_LANGUAGE_V10_RUST_PROLOG_CONCORDANCE=PASS
          echo MQR443_TWIN_WORLD_ALLOCATION_NONIDENTIFIABILITY=PASS
          echo MQR443_ACTIVATION_CAPABLE_REOPENING_RESERVE=PASS
          echo MQR443_TYPED_EXPLORATION_DEBT=PASS
          echo MQR443_GREEDY_YIELD_STARVATION_WITNESS=PASS
          echo MQR443_COMMON_MODE_PORTFOLIO_INFLATION=PASS
          echo MQR443_ESCAPE_TRIGGERED_REALLOCATION=PASS
          echo MQR443_UNIQUE_WORLD_OPTIMUM=NO
          echo MQR443_WORLD_FRONTIER_COMPLETE=NO
          echo MQR443_GUIDANCE_MODE=SET_VALUED_CONTRACT_RELATIVE
