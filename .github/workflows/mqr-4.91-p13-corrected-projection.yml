name: MQR-4.91 P1.3 — Corrected Oceania Maxent Raster Replay
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.91/p13_corrected_published_target_projection.py'
      - '.github/workflows/mqr-4.91-p13-corrected-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Replay archived publisher Oceania prediction raster
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/mqr-4.90 python experiments/mqr-4.91/p13_corrected_published_target_projection.py 2>&1 | tee p491-corrected-replay.log
          grep -Fx 'MQR491_P13_SAME_TARGET_FOLD_MODEL_PROJECTIONS=PASS' p491-corrected-replay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MQR491-P13-Corrected-Maxent-Projection
          path: |
            p491-corrected-replay.log
            p491-corrected-projection/maxent-projection-pilot.json
          retention-days: 30
