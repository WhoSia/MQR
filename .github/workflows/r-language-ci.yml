name: R-Language CI
on:
  push:
    branches: [main]
    paths:
      - 'language/r/**'
      - '.github/workflows/r-language-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile historical packets
        run: |
          python language/r/rpacket.py language/r/examples/*.rpacket > /tmp/rpackets.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/rpackets.json'))
          print('COMPILED_PACKETS='+str(len(x)))
          for p in x:
              print(p['id'],p['truth_proximity']['TPX'],p['truth_proximity']['band'])
          PY
      - name: Run R-Language regression tests
        run: python language/r/test_rpacket.py
