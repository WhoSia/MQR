name: MQR-4.59 Promotion Court

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.59/**'
      - 'language/real/src/promote_v26.rs'
      - 'language/real/prolog/promote_v26.pl'
      - 'language/real/examples/mqr-4.59-*.real'
      - 'language/real/V26-PROMOTION.md'
      - '.github/workflows/mqr-4.59-promotion-court.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  promotion-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Prolog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swi-prolog-nox
      - name: Build evaluator
        run: cargo build --manifest-path language/real/Cargo.toml --release --bin real-v26-promote
      - name: Execute v0.26 cases
        shell: bash
        run: |
          set -euo pipefail
          V=./language/real/target/release/real-v26-promote
          P=language/real/prolog/promote_v26.pl
          for f in language/real/examples/mqr-4.59-*.real; do
            "$V" "$f" > /tmp/r
            swipl -q -s "$P" -g "run('$f'),halt" -t "halt(1)" > /tmp/p
            diff -u /tmp/r /tmp/p
          done
          "$V" language/real/examples/mqr-4.59-material.real | grep -F 'promote.decision=PROMOTE'
          "$V" language/real/examples/mqr-4.59-simplify.real | grep -F 'promote.decision=PROMOTE'
          "$V" language/real/examples/mqr-4.59-formal.real | grep -F 'promote.decision=COMPRESS'
          "$V" language/real/examples/mqr-4.59-archive.real | grep -F 'promote.decision=ARCHIVE'
          echo MQR459_V26_CASES=PASS
      - name: Execute inherited-rule comparison
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/mqr-4.59
          python -c "from admission_core import Case,prior_rule,revised_relation; c=Case('a',compression=True); assert prior_rule(c)=='COMPRESS_NO_PROMOTION'; assert revised_relation(c)=='PROMOTE'"
          python -c "from admission_core import Case,prior_rule,revised_relation; c=Case('b',executable='FORMAL_ONLY'); assert prior_rule(c)=='PROMOTION_CANDIDATE'; assert revised_relation(c)=='COMPRESS'"
          python -c "from admission_core import Case,prior_rule,revised_relation; c=Case('c',contact='DUPLICATE'); assert prior_rule(c)=='PROMOTION_CANDIDATE'; assert revised_relation(c)=='COMPRESS'"
          python -c "from admission_core import Case,prior_rule,revised_relation; c=Case('d',repair='ENGINEERING'); assert revised_relation(c)=='COMPRESS'"
          python -c "from admission_core import Case,prior_rule,revised_relation; c=Case('e',repair='SCIENTIFIC'); assert revised_relation(c)=='PROMOTE'"
          python -c "from admission_core import Case,prior_rule,revised_relation; c=Case('f',localization=True); assert revised_relation(c)=='PROMOTE'"
          echo MQR459_PRIOR_RULE_NECESSARY=REJECT
          echo MQR459_EXECUTION_UNIVERSAL_GATE=REJECT
          echo MQR459_UNIVERSAL_META_OBJECTIVE=NOT_EARNED
          echo MQR459_RPAR=CANDIDATE
          echo MQR459_MCL=CANDIDATE
          echo MQR459_CDR=CANDIDATE
      - name: Publish receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -f state="$state" -f context="MQR-4.59/Court"             -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}"             -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
