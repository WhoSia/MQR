name: MQR-4.121 P1F Synthetic Identification and Workflow Authority
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.121/p1f_oob_identifiability.py'
      - 'experiments/mqr-4.121/p1g_bounded_raw_signal_enclosure.py'
      - 'experiments/mqr-4.121/p1h_instrument_raw_intake.py'
      - 'experiments/mqr-4.121/p1h_cross_intervention_rivals.py'
      - 'research/mqr_4121_p1h_bootstrap_pin_candidates.json'
      - 'tools/mqr_workflow_transitive_inventory.py'
      - 'tools/mqr_workflow_authority_inventory.py'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-identification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # resolved refs/tags/v4 2026-10-19
        with:
          persist-credentials: false
      - name: Execute OOB nonidentification tests
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.121/p1f_oob_identifiability.py | tee /tmp/mqr-p1f.txt
          grep -F 'MQR-P1F: SYNTHETIC PASS' /tmp/mqr-p1f.txt
      - name: Check finite optical OOB enclosure
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.121/p1g_bounded_raw_signal_enclosure.py | tee /tmp/mqr-p1g.txt
          grep -F 'MQR_P1G_INTERVAL_FIXTURE=PASS_SYNTHETIC' /tmp/mqr-p1g.txt
      - name: Test P1H physical-intake gating and rival controls
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.121/p1h_instrument_raw_intake.py | tee /tmp/mqr-p1h-raw.txt
          grep -F 'MQR_P1H_INTAKE_SCHEMA=PASS_SYNTHETIC' /tmp/mqr-p1h-raw.txt
          python3 experiments/mqr-4.121/p1h_cross_intervention_rivals.py | tee /tmp/mqr-p1h-rivals.txt
          grep -F 'MQR_P1H_RIVAL_CROSS_INTERVENTION=PASS_SYNTHETIC' /tmp/mqr-p1h-rivals.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/mqr_4121_p1h_bootstrap_pin_candidates.json').read_text())
          assert d['scope']=='ADVISORY_NOT_DEPLOYED'
          assert len(d['action']['pinned_commit'])==40
          assert len(d['elan_script_candidate']['observed_master_commit'])==40
          assert len(d['linux_x86_64_elan_binary_candidate']['sha256'])==64
          assert d['linux_x86_64_elan_binary_candidate']['binary_execution_tested'] is False
          print('MQR_P1H_DEPENDENCY_PIN_LEDGER=PASS_ADVISORY')
          PY
      - name: Enumerate external Actions and invoked repo-root scripts
        run: |
          set -euo pipefail
          python3 tools/mqr_workflow_transitive_inventory.py . > /tmp/mqr-transitive-audit.txt
          grep -F 'MQR_TRANSITIVE_AUDIT_FIXTURE=PASS' /tmp/mqr-transitive-audit.txt
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from mqr_workflow_transitive_inventory import scan
          report=scan(Path('.'))
          assert report['workflow_count'] >= 164
          assert not report['missing_explicit_repo_root_scripts'].get('mqr-4.121-p1f-audit-and-oob.yml')
          print('MQR_TRANSITIVE_AUDIT=PASS_SCOPED')
          print('ACTION_REFERENCES',len(report['external_action_refs']))
          for ref,count in report['external_action_refs'].items():
              print('ACTION_REF',ref,count)
          print('FLOATING_ACTION_WORKFLOWS',len(report['floating_action_uses']))
          print('ROOT_SCRIPT_PATHS',len(report['repo_root_scripts']))
          print('UNRESOLVED_SCRIPT_WORKFLOWS',len(report['missing_explicit_repo_root_scripts']))
          PY
      - name: Audit fixture cases and whole workflow tree
        run: |
          set -euo pipefail
          python3 tools/mqr_workflow_authority_inventory.py . | tee /tmp/mqr-authority.txt
          grep -F 'MQR_WORKFLOW_AUDIT_FIXTURE=PASS' /tmp/mqr-authority.txt
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from mqr_workflow_authority_inventory import scan
          result = scan(Path('.'))
          assert result['count'] >= 163, 'Unexpected workflow removal; re-audit scope'
          assert len(result['statuses_write']) <= 54, 'Status-write grants increased'
          assert not result['contents_write'], 'Content write detected'
          assert not result['other_write'], 'Other write grant detected'
          assert not result['direct_git_mutation'], 'Git mutation pattern detected'
          assert len(result['missing_top_level_permissions']) <= 3, 'New unscoped permission case'
          assert len(result['workflow_run_listeners']) <= 1, 'New workflow_run listener'
          print('MQR_WORKFLOW_STATIC_AUTHORITY=PASS_BOUNDED')
          PY
