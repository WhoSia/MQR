name: MQR 4.32 Tokenizers Bridge Replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['0.21.4', '0.22.2', '0.23.2']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Materialize exact dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          sed 's/__TOKENIZERS_VERSION__/${{ matrix.version }}/g' \
            experiments/mqr-4.32/external/tokenizers/Cargo.template.toml \
            > experiments/mqr-4.32/external/tokenizers/Cargo.toml
      - name: Format gate
        run: cargo fmt --manifest-path experiments/mqr-4.32/external/tokenizers/Cargo.toml -- --check
      - name: Generate exact lockfile
        run: cargo generate-lockfile --manifest-path experiments/mqr-4.32/external/tokenizers/Cargo.toml
      - name: Locked build
        run: cargo build --locked --manifest-path experiments/mqr-4.32/external/tokenizers/Cargo.toml
      - name: Replay bridge fixtures only
        shell: bash
        run: |
          set -euo pipefail
          BIN=experiments/mqr-4.32/external/tokenizers/target/debug/mqr432-tokenizers-probe
          "$BIN" bridge > "bridge-${{ matrix.version }}.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: tokenizers-bridge-replay-${{ matrix.version }}
          path: bridge-${{ matrix.version }}.tsv
          retention-days: 30

  adjudicate:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tokenizers-bridge-replay-*
          path: results
          merge-multiple: true
      - name: Replay adjacent-edge adjudication against frozen receipt
        shell: bash
        run: |
          set -euo pipefail
          AB=TRANSPORT_FAIL
          BC=TRANSPORT_FAIL
          if cmp -s results/bridge-0.21.4.tsv results/bridge-0.22.2.tsv; then AB=TRANSPORT_PASS; fi
          if cmp -s results/bridge-0.22.2.tsv results/bridge-0.23.2.tsv; then BC=TRANSPORT_PASS; fi
          grep -F $'A_TO_B\t'"$AB" receipts/mqr-4.32/tokenizers-bridge.tsv
          grep -F $'B_TO_C\t'"$BC" receipts/mqr-4.32/tokenizers-bridge.tsv
          echo "BRIDGE_REPLAY_A_TO_B=$AB"
          echo "BRIDGE_REPLAY_B_TO_C=$BC"
          echo 'CANONICAL_RECEIPT_MUTATION=DISABLED'
