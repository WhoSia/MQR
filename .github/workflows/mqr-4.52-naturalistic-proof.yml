name: MQR-4.52 Naturalistic Trace Lean Boundary

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.52/FINAL-SEAL.md'
      - 'language/real/lean/MQR/NaturalisticTrace.lean'
      - 'language/real/lean/MQR.lean'
      - 'language/real/V19-NATURALISTIC-TRACE.md'
      - '.github/workflows/mqr-4.52-naturalistic-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  proof-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with pinned Lean kernel
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false

      - name: Check axiom ancestry
        shell: bash
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/NaturalisticTrace.lean | tee /tmp/naturalistic.log
          if grep -F 'sorryAx' /tmp/naturalistic.log; then exit 1; fi
          theorems=(
            MQR.claimFreezeCanCoexistWithActiveInquiry
            MQR.binaryStopProjectionCanEraseProbeState
            MQR.inertCheckpointRefinementCanChangeLagOneWithoutWorldChange
            MQR.nondegenerateStopWindowDoesNotIdentifyUniqueStopTime
            MQR.historicalActionDoesNotConstituteGold
            MQR.actionAuthorityCanPrecedeUniversalMechanisticClosure
            MQR.positiveConvergenceCanSupportClosureWithoutFalsifier
            MQR.partialHistoricalCompatibilityDoesNotEstablishExternalCalibration
          )
          for theorem in "${theorems[@]}"; do
            grep -F "'$theorem' does not depend on any axioms" /tmp/naturalistic.log
          done
          echo MQR452_NATURALISTIC_TRACE_AXIOM_ANCESTRY=EMPTY

      - name: Build pinned independent checker stack
        shell: bash
        run: |
          set -euo pipefail
          cd language/real/lean
          git clone https://github.com/leanprover/lean4export.git _lean4export
          git -C _lean4export checkout 076e8e57707e813375e8f9da8bf989799ace9680
          cp lean-toolchain _lean4export/lean-toolchain
          (cd _lean4export && lake build lean4export)
          git clone https://github.com/robsimmons/nanoda_lib.git _nanoda_lib
          git -C _nanoda_lib checkout 68d5ca9db226849b41a6fff59d796ff19d0a8840
          cargo build --release --manifest-path _nanoda_lib/Cargo.toml

      - name: Independent nanoda replay
        shell: bash
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env _lean4export/.lake/build/bin/lean4export MQR -- \
            MQR.claimFreezeCanCoexistWithActiveInquiry \
            MQR.binaryStopProjectionCanEraseProbeState \
            MQR.inertCheckpointRefinementCanChangeLagOneWithoutWorldChange \
            MQR.nondegenerateStopWindowDoesNotIdentifyUniqueStopTime \
            MQR.historicalActionDoesNotConstituteGold \
            MQR.actionAuthorityCanPrecedeUniversalMechanisticClosure \
            MQR.positiveConvergenceCanSupportClosureWithoutFalsifier \
            MQR.partialHistoricalCompatibilityDoesNotEstablishExternalCalibration \
            > /tmp/mqr-452.export
          cat > /tmp/mqr-452-nanoda.json <<'JSON'
          {
            "export_file_path": "/tmp/mqr-452.export",
            "use_stdin": false,
            "permitted_axioms": [],
            "unpermitted_axiom_hard_error": true,
            "nat_extension": true,
            "string_extension": true,
            "print_success_message": true
          }
          JSON
          _nanoda_lib/target/release/nanoda_bin /tmp/mqr-452-nanoda.json
          echo REAL_LANGUAGE_NANODA_INDEPENDENT_CHECKER=PASS
          echo MQR452_NANODA_NATURALISTIC_TRACE_REPLAY=PASS

      - name: Publish externally readable workflow receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          context="MQR-4.52/Lean+nanoda"
          description="run ${GITHUB_RUN_ID}: ${{ job.status }}"
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="$context" -f description="$description" -f target_url="$target"
