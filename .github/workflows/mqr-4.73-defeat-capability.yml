name: MQR-4.73 Defeat Capability Dominance Court
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.73/**'
      - 'language/real/lean/MQR/DefeatCapability.lean'
      - 'language/real/lean/MQR/Recoverability.lean'
      - '.github/workflows/mqr-4.73-defeat-capability.yml'
  workflow_dispatch:
jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 experiments/mqr-4.73/capability_court.py
          python3 experiments/mqr-4.73/recoverability_court.py
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          g++ -std=c++20 -O2 experiments/mqr-4.73/independent_capability_court.cpp -o /tmp/a
          /tmp/a
          g++ -std=c++20 -O2 experiments/mqr-4.73/independent_recoverability_court.cpp -o /tmp/b
          /tmp/b
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - run: |
          cd language/real/lean
          lake env lean MQR/DefeatCapability.lean
          lake env lean MQR/Recoverability.lean
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -F 'MQR-4.49 absorption' experiments/mqr-4.73/PRESEAL.md
          grep -F 'RECOVERABILITY-ORACLE-UNDER-ATTACK' experiments/mqr-4.73/RECOVERABILITY-PRESEAL.md
          grep -F 'INCOMPARABLE_HIDDEN_LOSS' experiments/mqr-4.73/COURT-FREEZE.tsv
          grep -F 'POSTHOC_PREDICTOR' experiments/mqr-4.73/RECOVERABILITY-FREEZE.tsv
