name: "MQR 4.101 — Fallible Reference and Selective Risk P1"
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.101/**'
      - 'docs/MQR-4.101*'
      - '.github/workflows/mqr-4.101-p1-risk-sharpness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-risk-source-and-sharpness:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact source-derived P8 receipt bytes (not new raw ECG)
        shell: bash
        run: |
          set -euo pipefail
          echo 'd441a516cb0cfba50d6eb1d71662a1a3ff9c9e57546800e8127c59303a3ed842  experiments/mqr-4.101/p8_publisher_verified_487beat_receipt.csv' | sha256sum -c -
      - name: Prove exact small-case sharpness and reanalyze actual dual-reader receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mqr4101-p1
          python3 experiments/mqr-4.101/p1_fallible_reference.py --selftest | tee mqr4101-p1/selftest.log
          python3 experiments/mqr-4.101/p1_fallible_reference.py \
            --source-csv experiments/mqr-4.101/p8_publisher_verified_487beat_receipt.csv \
            --out mqr4101-p1 > mqr4101-p1/source-run.log
          grep -F 'MQR4101_P1_AUTHENTIC_P8_RECEIPT_BINARY_REFERENCE_RISK_GATE_PASS;TRUE_RISK_AND_TRANSPORT_HOLD' mqr4101-p1/source-run.log
          python3 - <<'PY'
          import pathlib,json,csv,math
          p=pathlib.Path('mqr4101-p1')
          x=json.loads((p/'p1_source_risk_receipt.json').read_text())
          assert len(x['records'])==11
          z=x['sensitivity'];assert [y['paired_binary_disagreements'] for y in z]==[88,76,76,66,42]
          assert all(y['complete_qt_pairs']==402 and y['unpaired']==85 for y in z)
          assert (z[2]['pooled_hypothetical_external_reference_mistake_budget']['0']['lower_count'],
                  z[2]['pooled_hypothetical_external_reference_mistake_budget']['0']['upper_count'])==(76,161)
          assert (z[2]['pooled_hypothetical_external_reference_mistake_budget']['10']['lower_count'],
                  z[2]['pooled_hypothetical_external_reference_mistake_budget']['10']['upper_count'])==(66,171)
          assert z[2]['pooled_hypothetical_external_reference_mistake_budget']['402']['lower_rate']==0.0
          assert z[2]['pooled_hypothetical_external_reference_mistake_budget']['402']['upper_rate']==1.0
          with (p/'p1_per_record_binary_crossings.csv').open() as f:assert len(list(csv.DictReader(f)))==55
          print('MQR4101_P1_SOURCE_BOUNDED_CONTRACT_AND_NO_TRUTH_CERTIFICATE_PASS')
          PY
      - name: Independent Rust exhaustive theorem and source receipt parser
        shell: bash
        run: |
          set -euo pipefail
          cargo test --offline --manifest-path experiments/mqr-4.101/Cargo.toml
          cargo run --offline --manifest-path experiments/mqr-4.101/Cargo.toml \
            --bin receipt_court -- mqr4101-p1/p1_per_record_binary_crossings.csv 2>&1 | tee mqr4101-p1/rust.log
          grep -F 'MQR4101_P1_RUST_INDEPENDENT_CSV_COUNT_AND_SHARPNESS_PASS; EXTERNAL_REFERENCE_ERROR_CERTIFICATE_HOLD' mqr4101-p1/rust.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MQR4101-P1-Selectively-Observed-Fallible-Reference-Risk-Receipt
          path: |
            mqr4101-p1/p1_source_risk_receipt.json
            mqr4101-p1/p1_per_record_binary_crossings.csv
            mqr4101-p1/selftest.log
            mqr4101-p1/source-run.log
            mqr4101-p1/rust.log
          retention-days: 90
          if-no-files-found: warn
