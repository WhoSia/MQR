name: MQR 4.33 Support Profile Collision

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.33/collision/**'
      - 'experiments/mqr-4.33/rust/src/bin/collision.rs'
      - 'experiments/mqr-4.33/rust/Cargo.toml'
      - '.github/workflows/mqr-4.33-collision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Format gate
        run: cargo fmt --manifest-path experiments/mqr-4.33/rust/Cargo.toml -- --check
      - name: Clippy gate
        run: cargo clippy --manifest-path experiments/mqr-4.33/rust/Cargo.toml --bin mqr433-collision -- -D warnings
      - name: Build certificate
        run: cargo build --manifest-path experiments/mqr-4.33/rust/Cargo.toml --release --bin mqr433-collision
      - name: Execute collision certificate
        shell: bash
        run: |
          set -euo pipefail
          BIN=./experiments/mqr-4.33/rust/target/release/mqr433-collision
          OUT=/tmp/mqr433-collision.out
          "$BIN" experiments/mqr-4.33/collision/support-profile-collision.tsv | tee "$OUT"
          grep -F 'PROFILE_COLLISION_COUNT=1' "$OUT"
          grep -F 'SUPPORT_PROFILE_IDENTIFIABILITY=FAIL' "$OUT"
          grep -F 'OUTCOME_FACTORIZATION_THROUGH_FROZEN_PROFILE=FAIL' "$OUT"
          grep -F 'FROZEN_SUPPORT_QUOTIENT_SUFFICIENCY=FAIL' "$OUT"
          grep -F 'TKN-001' "$OUT"
          grep -F 'TOML-D1' "$OUT"
