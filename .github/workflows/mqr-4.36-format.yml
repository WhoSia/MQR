name: MQR 4.36 One-Shot Rustfmt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mqr-4.36-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Format only the frozen adjudicator implementation
        run: cargo fmt --manifest-path experiments/mqr-4.36/rust/Cargo.toml
      - name: Commit formatting-only repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- experiments/mqr-4.36/rust/src/main.rs; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/mqr-4.36/rust/src/main.rs
          git commit -m 'MQR-4.36: apply pre-reveal rustfmt-only repair'
          git push
