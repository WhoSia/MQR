name: "MQR 4.103 — Sequential Verification Finite Court"
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.103/**'
      - '.github/workflows/mqr-4.103-p1-sequential.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pure Rust unit contracts
        run: cargo test --offline --manifest-path experiments/mqr-4.103/Cargo.toml
      - name: Exhaustive P1 and P2 finite witnesses
        run: |
          set -euo pipefail
          cargo run --offline --manifest-path experiments/mqr-4.103/Cargo.toml | tee p2-run.log
          grep -F 'MQR4103_P1_FINITE_ADAPTIVE_OBSERVATIONAL_EQUIVALENCE_PASS;EXTERNAL_TRUTH_HOLD' p2-run.log
          grep -F 'MQR4103_P2_FINITE_DESIGN_AND_FALLIBLE_LABEL_COURT_PASS;EXTERNAL_TRUTH_HOLD' p2-run.log
      - uses: actions/upload-artifact@v4
        with:
          name: MQR4103-P1-P2-Exact-Finite-Selection-Court
          path: p2-run.log
      - name: Freeze P1/P2 exact code, courts, and README for Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p2-custody
          cp experiments/mqr-4.103/Cargo.toml p2-custody/
          cp experiments/mqr-4.103/src/main.rs p2-custody/
          cp experiments/mqr-4.103/src/p2.rs p2-custody/
          cp docs/MQR-4.103-ADAPTIVE-VERIFICATION-AND-SEQUENTIAL-IDENTIFIABILITY-ENTRY.md p2-custody/
          cp docs/MQR-4.103-P2-SEQUENTIAL-DESIGN-SUPPORT-AND-FALLIBLE-REFERENCE-COURT.md p2-custody/
          cp .github/workflows/mqr-4.103-p1-sequential.yml p2-custody/
          cp README.md p2-custody/
          git rev-parse HEAD > p2-custody/commit.txt
          sha256sum p2-custody/* > p2-custody/SHA256SUMS.txt
          (cd p2-custody && zip -q ../MQR4103-P2-Code-Court-README-Source-Snapshot.zip ./*)
      - uses: actions/upload-artifact@v4
        with:
          name: MQR4103-P2-Drive-Custody-Snapshot
          path: MQR4103-P2-Code-Court-README-Source-Snapshot.zip
          retention-days: 90
