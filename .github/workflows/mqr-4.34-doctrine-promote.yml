name: MQR 4.34 Doctrine Promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mqr-4.34-doctrine-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote MQR-4.34 doctrine without rewriting prior doctrine
        shell: bash
        env:
          SECTION_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('doctrine/CURRENT.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Status: live through **MQR-4.33**.','Status: live through **MQR-4.34**.',1)
          section=base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
          heading='#### MQR-4.34 relational support geometry result'
          if heading not in s:
              marker='## Current compression'
              if marker in s:
                  s=s.replace(marker,section+marker,1)
              else:
                  s=s.rstrip()+'\n\n'+section
          p.write_text(s,encoding='utf-8')
          PY
          grep -F 'Status: live through **MQR-4.34**.' doctrine/CURRENT.md
          grep -F 'STRONGEST_EARNED_RESULT = RELATIONAL_SUPPORT_AUTHORITY_IS_DOMAIN_MAP_INDEXED' doctrine/CURRENT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doctrine/CURRENT.md
          git commit -m 'MQR-4.34: promote relational support authority doctrine'
          git push origin HEAD:main
