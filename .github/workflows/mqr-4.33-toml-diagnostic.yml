name: MQR 4.33 TOML Postfail Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.33/external/toml-diagnostic/**'
      - '.github/workflows/mqr-4.33-toml-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - regime: A
            version: '0.8.23'
          - regime: B
            version: '0.9.12+spec-1.1.0'
          - regime: C
            version: '1.0.7+spec-1.1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Materialize exact dependency
        shell: bash
        run: |
          set -euo pipefail
          sed 's/__TOML_VERSION__/${{ matrix.version }}/g' \
            experiments/mqr-4.33/external/toml-diagnostic/Cargo.template.toml \
            > experiments/mqr-4.33/external/toml-diagnostic/Cargo.toml
      - name: Format gate
        run: cargo fmt --manifest-path experiments/mqr-4.33/external/toml-diagnostic/Cargo.toml -- --check
      - name: Generate lockfile
        run: cargo generate-lockfile --manifest-path experiments/mqr-4.33/external/toml-diagnostic/Cargo.toml
      - name: Locked build
        run: cargo build --locked --manifest-path experiments/mqr-4.33/external/toml-diagnostic/Cargo.toml
      - name: Execute diagnostic bridge and heldout
        shell: bash
        run: |
          set -euo pipefail
          BIN=experiments/mqr-4.33/external/toml-diagnostic/target/debug/mqr433-toml-diagnostic
          "$BIN" bridge > "bridge-${{ matrix.regime }}.tsv"
          "$BIN" heldout > "heldout-${{ matrix.regime }}.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: toml-diagnostic-${{ matrix.regime }}
          path: |
            bridge-${{ matrix.regime }}.tsv
            heldout-${{ matrix.regime }}.tsv
          retention-days: 30

  adjudicate:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: toml-diagnostic-*
          path: results
          merge-multiple: true
      - name: Diagnostic adjudication
        shell: bash
        run: |
          set -euo pipefail
          RECOVERY=FAIL
          BOUNDARY=NO
          if cmp -s results/bridge-A.tsv results/bridge-B.tsv && cmp -s results/bridge-B.tsv results/bridge-C.tsv; then RECOVERY=PASS; fi
          if ! cmp -s results/heldout-A.tsv results/heldout-C.tsv; then BOUNDARY=YES; fi
          echo "COMPONENT_ADAPTER_RECOVERY=$RECOVERY"
          echo "DIAGNOSTIC_SUPPORT_BOUNDARY_WITNESS=$BOUNDARY"
          echo 'PROMOTION_CREDIT=ZERO'
      - uses: actions/upload-artifact@v4
        with:
          name: toml-diagnostic-adjudication
          path: results/
          retention-days: 30
