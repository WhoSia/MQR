name: MQR-4.67 Scientific-Authority Approximation Court

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.67/**'
      - 'language/real/src/approx_v30.rs'
      - 'language/real/prolog/approx_v30.pl'
      - 'language/real/lean/MQR/Approximation.lean'
      - 'language/real/examples/mqr-4.67-*.real'
      - 'language/real/Cargo.toml'
      - '.github/workflows/mqr-4.67-scientific-authority-approximation.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  haskell-canonical-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GHC
        run: |
          set -euo pipefail
          if ! command -v ghc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ghc
          fi
          ghc --version
      - name: Run canonical Haskell court
        run: |
          set -euo pipefail
          mkdir -p experiments/mqr-4.67/results
          ghc -O2 experiments/mqr-4.67/ApproxCourt.hs -o /tmp/mqr467-hs
          /tmp/mqr467-hs | tee /tmp/mqr467-hs.log
          grep -F 'MQR467_HASKELL_COURT=PASS' /tmp/mqr467-hs.log
      - uses: actions/upload-artifact@v4
        with:
          name: mqr-4.67-haskell-results
          path: experiments/mqr-4.67/results/
      - name: Publish Haskell receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.67/Haskell-Court" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  cpp-independent-concordance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GHC
        run: |
          set -euo pipefail
          if ! command -v ghc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ghc
          fi
      - name: Run Haskell canonical
        run: |
          set -euo pipefail
          mkdir -p experiments/mqr-4.67/results
          ghc -O2 experiments/mqr-4.67/ApproxCourt.hs -o /tmp/mqr467-hs
          /tmp/mqr467-hs >/tmp/hs.log
      - name: Run independent C++
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 experiments/mqr-4.67/independent_census.cpp -o /tmp/mqr467-cpp
          /tmp/mqr467-cpp | tee /tmp/cpp.log
          grep -F 'MQR467_CPP_COURT=PASS' /tmp/cpp.log
      - name: Compare exact summaries and profiles
        run: |
          set -euo pipefail
          diff -u experiments/mqr-4.67/results/haskell_summary.tsv experiments/mqr-4.67/results/cpp_summary.tsv
          diff -u experiments/mqr-4.67/results/haskell_profiles.tsv experiments/mqr-4.67/results/cpp_profiles.tsv
          echo MQR467_HASKELL_CPP_CONCORDANCE=PASS
      - name: Publish concordance receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.67/Haskell-Cpp-Concordance" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  realapprox-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
      - name: Build Rust candidate
        run: |
          set -euo pipefail
          cargo build --manifest-path language/real/Cargo.toml --bin real-v30-approx
      - name: Rust-Prolog fixture concordance
        run: |
          set -euo pipefail
          BIN=language/real/target/debug/real-v30-approx
          for packet in \
            language/real/examples/mqr-4.67-simulated-local.real \
            language/real/examples/mqr-4.67-reexpand.real
          do
            "$BIN" "$packet" > /tmp/rust.out
            swipl -q -f language/real/prolog/approx_v30.pl -- "$packet" > /tmp/prolog.out
            diff -u /tmp/rust.out /tmp/prolog.out
          done
          "$BIN" language/real/examples/mqr-4.67-simulated-local.real | tee /tmp/sim.log
          grep -F 'approximation.world_validity=NOT_ESTABLISHED' /tmp/sim.log
          grep -F 'approximation.scalar_authority=OFF' /tmp/sim.log
          grep -F 'approximation.global_loss_score=FORBIDDEN' /tmp/sim.log
          "$BIN" language/real/examples/mqr-4.67-reexpand.real | tee /tmp/reexpand.log
          grep -F 'approximation.decision=REEXPAND_REQUIRED' /tmp/reexpand.log
          echo MQR467_REALAPPROX_CANDIDATE=PASS
      - name: Reject scalar mode
        run: |
          set -euo pipefail
          sed 's/scalar_mode OFF/scalar_mode ON/' \
            language/real/examples/mqr-4.67-simulated-local.real >/tmp/bad.real
          if language/real/target/debug/real-v30-approx /tmp/bad.real >/tmp/bad.out 2>/tmp/bad.err; then
            echo "scalar mode unexpectedly accepted"
            exit 1
          fi
          grep -F 'scalar_mode must be OFF' /tmp/bad.err
      - name: Publish Real-Lang receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.67/REALAPPROX-Candidate" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  lean-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - name: Verify approximation theorem boundary
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/Approximation.lean | tee /tmp/mqr467-lean.log
          if grep -F 'sorryAx' /tmp/mqr467-lean.log; then exit 1; fi
          for theorem in \
            MQR.weakening_preserves_budget \
            MQR.fatal_release_forbids \
            MQR.fatal_reopen_reexpands \
            MQR.fatal_prov_or_ext_reopens
          do
            grep -F "'$theorem' does not depend on any axioms" /tmp/mqr467-lean.log
          done
          echo MQR467_LEAN_APPROXIMATION=PASS
      - name: Publish Lean receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.67/Lean-Boundary" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  deterministic-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GHC
        run: |
          set -euo pipefail
          if ! command -v ghc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ghc
          fi
      - name: Replay court twice
        run: |
          set -euo pipefail
          mkdir -p experiments/mqr-4.67/results
          ghc -O2 experiments/mqr-4.67/ApproxCourt.hs -o /tmp/mqr467-hs
          /tmp/mqr467-hs >/tmp/run1.log
          cp experiments/mqr-4.67/results/haskell_summary.tsv /tmp/s1
          cp experiments/mqr-4.67/results/haskell_profiles.tsv /tmp/p1
          rm -rf experiments/mqr-4.67/results
          mkdir -p experiments/mqr-4.67/results
          /tmp/mqr467-hs >/tmp/run2.log
          diff -u /tmp/s1 experiments/mqr-4.67/results/haskell_summary.tsv
          diff -u /tmp/p1 experiments/mqr-4.67/results/haskell_profiles.tsv
          diff -u /tmp/run1.log /tmp/run2.log
          echo MQR467_DETERMINISTIC_REPLAY=PASS
      - name: Publish replay receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.67/Deterministic-Replay" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  structural-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify anti-self-confirmation and frozen semantics
        run: |
          set -euo pipefail
          grep -F 'SIMULATED ≠ OBSERVED' experiments/mqr-4.67/PRESEAL.md
          grep -F 'No target verdict is predeclared.' experiments/mqr-4.67/APPROX-GRAMMAR-FREEZE.md
          grep -F '3^5 = 243' experiments/mqr-4.67/APPROX-GRAMMAR-FREEZE.md
          grep -F 'REALAPPROX 0.30-CANDIDATE' experiments/mqr-4.67/APPROX-GRAMMAR-FREEZE.md
          grep -F 'Utility as infrastructure does not imply novelty as scientific theory.' experiments/mqr-4.67/LITERATURE.md
          grep -F 'approximation.global_loss_score=FORBIDDEN' language/real/src/approx_v30.rs
          echo MQR467_STRUCTURAL_GUARDS=PASS
      - name: Publish guard receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.67/Structural-Guards" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
