name: MQR-4.40 Substitution Lean Boundary
on:
  push:
    branches: [main]
    paths:
      - 'language/real/lean/MQR/Substitution.lean'
      - 'language/real/lean/MQR.lean'
      - '.github/workflows/mqr-4.40-proof-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - name: Axiom ancestry
        shell: bash
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/Substitution.lean | tee /tmp/s.log
          if grep -F 'sorryAx' /tmp/s.log; then exit 1; fi
          for theorem in \
            MQR.definitionalEndpointCarriesNoIndependentBooleanDegree \
            MQR.internalCoherenceDoesNotCreateExternalWorldAnchor \
            MQR.agreementOnCheckedBasisDoesNotEntailGlobalAgreement \
            MQR.pathAgreementDoesNotEntailIndependentWorldContact \
            MQR.endpointAgreementNeedNotBeCongruentUnderExtension \
            MQR.checkedFaceDoesNotEntailHigherCoherence \
            MQR.compositionCannotRefreshRootFreshness \
            MQR.cyclicJustificationDoesNotEntailExteriority \
            MQR.directConflictEstablishesDisagreementNotDirectInfallibility \
            MQR.exactInternalDeterminacyStillRequiresAnExternalPremise
          do
            grep -F "'$theorem' does not depend on any axioms" /tmp/s.log
          done
          echo MQR440_SUBSTITUTION_AXIOM_ANCESTRY=EMPTY
