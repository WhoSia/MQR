name: "MQR 4.102 — Adjudication Allocation and Source-Limited Decision Risk"
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.102/**'
      - '.github/workflows/mqr-4.102-adjudication-value.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-selected-beat-value:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify existing audited P8-derived source exactly
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'd441a516cb0cfba50d6eb1d71662a1a3ff9c9e57546800e8127c59303a3ed842' \
            'experiments/mqr-4.101/p8_publisher_verified_487beat_receipt.csv' | sha256sum -c -
      - name: Original 487-case strata and sharp finite-review-allocation contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mqr4102
          python3 experiments/mqr-4.102/adjudication_value.py \
            --csv experiments/mqr-4.101/p8_publisher_verified_487beat_receipt.csv \
            --output /tmp/mqr4102/finite_value.json | tee /tmp/mqr4102/python.log
          grep -F 'MQR4102_FINITE_SELECTION_VALUE_SOURCE_AUDIT=PASS;INDEPENDENT_TRUTH=HOLD' /tmp/mqr4102/python.log
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/mqr4102/finite_value.json'))
          assert (r["paired_target_size"],r["observed_pair_disagreement"],r["unpaired_second_reader"]) == (402,76,85)
          assert r["truth_relabels_acquired"] == 0
          assert abs(r["hypothetical_perfect_external_review_of_ten_disagreements"]["decision_difference_interval_total_width"]-132/402)<1e-12
          assert abs(r["equal_record_optimal_ten_full_width_reduction"]-2/33)<1e-12
          print("MQR4102_SELECTION_DESIGN_HYPOTHETICAL_ONLY=PASS")
          PY
      - name: Independent Rust receipt parser and complete small-world sharpness tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --offline --manifest-path experiments/mqr-4.102/Cargo.toml --bin adjudication_court
          cargo run --offline --manifest-path experiments/mqr-4.102/Cargo.toml \
            --bin adjudication_court -- \
            experiments/mqr-4.101/p8_publisher_verified_487beat_receipt.csv | tee /tmp/mqr4102/rust.log
          grep -F 'MQR4102_RUST_DISCORDANCE_402_76_AND_SHARP_BOUNDS=PASS;TRUE_REFERENCE_VALIDATION=HOLD' /tmp/mqr4102/rust.log
      - name: Preserve exact computational receipt without source mutation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MQR4102-Selection-Value-Exact-Source-Limited-Receipts
          path: |
            /tmp/mqr4102/finite_value.json
            /tmp/mqr4102/python.log
            /tmp/mqr4102/rust.log
          if-no-files-found: warn
          retention-days: 90
