name: MQR-4.89 Scientific Receipt Regression
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.89/**'
      - '.github/workflows/mqr-4.89-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned experiment dependencies
        run: python -m pip install -r experiments/mqr-4.89/empirical_requirements.txt
      - name: Run executed synthetic ML study twice and confirm exact reproducibility
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python experiments/mqr-4.89/empirical_leakage_reproduction.py --seeds 12 | tee run-one.log
          grep -Fx 'MQR489_EXECUTED_SYNTHETIC_TRIALS=48' run-one.log
          grep -Fx 'MQR489_ORIGINAL_DATA_REPLICATION=NOT_PERFORMED' run-one.log
          cp mqr489_experiment_results.json first-run.json
          python experiments/mqr-4.89/empirical_leakage_reproduction.py --seeds 12 | tee run-two.log
          cmp first-run.json mqr489_experiment_results.json
          echo 'MQR489_DETERMINISTIC_RERUN=PASS'
      - name: Preserve ML experiment outputs as CI artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MQR489-Synthetic-Experiment-Outputs
          path: |
            mqr489_experiment_results.json
            run-one.log
            run-two.log
          retention-days: 30
      - name: Compile both receipt interpreters
        run: python -m compileall -q experiments/mqr-4.89/
      - name: Run frozen synthetic policy fixtures
        run: |
          set -euo pipefail
          python experiments/mqr-4.89/real_lang_scientific_receipts.py | tee synthetic.log
          grep -Fx 'MQR489_SYNTHETIC_PASS=10' synthetic.log
          grep -Fx 'MQR489_EMPIRICAL_REPLICATION=NOT_PERFORMED' synthetic.log
      - name: Run source-reported case consistency audit
        run: |
          set -euo pipefail
          python experiments/mqr-4.89/source_reported_civil_war_cases.py | tee empirical-contact.log
          grep -Fx 'MQR489_CASES_PASS=4' empirical-contact.log
          grep -Fx 'MQR489_INDEPENDENT_REPLICATION=NOT_PERFORMED' empirical-contact.log
      - name: Run adversarial receipt-promotion attack cases
        run: |
          set -euo pipefail
          python experiments/mqr-4.89/adversarial_receipt_court.py | tee adversarial.log
          grep -Fx 'MQR489_ADVERSARIAL_PASS=12' adversarial.log
          grep -Fx 'MQR489_EXTERNAL_VERIFICATION=NOT_PERFORMED' adversarial.log
      - name: Check deprecated replay API fails closed
        run: |
          set -euo pipefail
          python experiments/mqr-4.89/replay_receipt_gates.py | tee replay.log
          grep -Fx 'MQR489_LEGACY_FAIL_CLOSED_PASS=7' replay.log
          grep -Fx 'MQR489_REPLAY_PERFORMED=NO' replay.log
      - name: Verify byte-bound replay receipts
        run: |
          set -euo pipefail
          python experiments/mqr-4.89/replay_receipt_gates_v2.py | tee byte-bound.log
          grep -Fx 'MQR489_BYTE_BOUND_TESTS=10/10 PASS' byte-bound.log
          grep -Fx 'MQR489_REAL_DATA_REPLAY=NOT_PERFORMED' byte-bound.log
      - name: Audit legacy-to-byte-bound migration
        run: |
          set -euo pipefail
          python experiments/mqr-4.89/migration_boundary_court.py | tee migration.log
          grep -Fx 'MQR489_MIGRATION_BOUNDARY_PASS=5' migration.log
          grep -Fx 'MQR489_INDEPENDENT_REPLICATION=NOT_PERFORMED' migration.log
      - name: Audit byte-bound replay manifest consistency
        run: |
          set -euo pipefail
          python experiments/mqr-4.89/replay_manifest_court.py | tee manifest.log
          grep -Fx 'MQR489_MANIFEST_CONSISTENCY_PASS=6' manifest.log
          grep -Fx 'MQR489_EXECUTION_AUTHENTICITY=UNVERIFIED' manifest.log
      - name: Check original Real Lang warrant bridge
        run: |
          set -euo pipefail
          python experiments/mqr-4.89/real_lang_warrant_bridge.py | tee bridge.log
          grep -Fx 'MQR489_BRIDGE_CHECKS=12 PASS' bridge.log
          grep -Fx 'MQR489_SCIENTIFIC_AUTHORITY=NOT_DETERMINED' bridge.log
