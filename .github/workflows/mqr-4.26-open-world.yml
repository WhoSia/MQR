name: MQR 4.26 Open World Rival Expansion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mqr-4.26-open-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  open-world:
    runs-on: ubuntu-latest
    steps:
      - name: Expanding rival classes and diagonal escape theorem
        run: |
          python - <<'PY'
          from functools import reduce
          from operator import mul

          domain=list(range(5))
          f0=lambda x:x

          def agrees(fn,obs):
              return all(fn(x)==y for x,y in obs.items())

          def claim_global(fn):
              return all(fn(x)==x for x in domain)

          def invariant_values(survivors):
              inv={}
              for x in domain:
                  vals={fn(x) for fn in survivors.values()}
                  if len(vals)==1:
                      inv[x]=next(iter(vals))
              return inv

          # t0: restricted affine grammar.
          obs0={0:0,1:1}
          G0={}
          for a in range(-2,4):
              for b in range(-2,4):
                  G0[f"affine_{a}_{b}"]=(lambda a,b: (lambda x:a*x+b))(a,b)
          S0={n:f for n,f in G0.items() if agrees(f,obs0)}
          assert list(S0.keys())==["affine_1_0"]
          R0=all(claim_global(f) for f in S0.values())

          print("T0_GENERATOR=AFFINE")
          print("T0_SURVIVORS="+",".join(S0))
          print("T0_GLOBAL_CLAIM="+("PASS" if R0 else "HOLD"))
          print("T0_LABEL=UNIQUE_WITHIN_CURRENT_OPEN_WORLD_TEST")

          # t1: grammar expansion with quadratic bump rivals.
          G1=dict(G0)
          for c in [-2,-1,1,2]:
              G1[f"quad_escape_{c}"]=(lambda c: (lambda x:x+c*x*(x-1)))(c)
          S1={n:f for n,f in G1.items() if agrees(f,obs0)}
          R1=all(claim_global(f) for f in S1.values())
          inv1=invariant_values(S1)

          print("T1_GENERATOR=AFFINE_PLUS_QUADRATIC_ESCAPE")
          print("T1_SURVIVORS="+",".join(sorted(S1)))
          print("T1_GLOBAL_CLAIM="+("PASS" if R1 else "HOLD"))
          print("T1_INVARIANT_CORE="+repr(inv1))
          print("T1_ACTION=CONTRACT_TO_CURRENT_IDENTIFIED_CORE")

          # t2: new world contact discriminates quadratic escapes.
          obs2={0:0,1:1,2:2}
          S2={n:f for n,f in G1.items() if agrees(f,obs2)}
          R2=all(claim_global(f) for f in S2.values())
          print("T2_WORLD_CONTACT=x2_to_2")
          print("T2_SURVIVORS="+",".join(sorted(S2)))
          print("T2_GLOBAL_CLAIM_WITHIN_G1="+("PASS" if R2 else "HOLD"))

          # t3: open the grammar again with cubic bumps.
          G2=dict(G1)
          for d in [-2,-1,1,2]:
              G2[f"cubic_escape_{d}"]=(lambda d: (lambda x:x+d*x*(x-1)*(x-2)))(d)
          S3={n:f for n,f in G2.items() if agrees(f,obs2)}
          R3=all(claim_global(f) for f in S3.values())
          inv3=invariant_values(S3)
          print("T3_GENERATOR=PLUS_CUBIC_ESCAPE")
          print("T3_SURVIVORS="+",".join(sorted(S3)))
          print("T3_GLOBAL_CLAIM="+("PASS" if R3 else "HOLD"))
          print("T3_INVARIANT_CORE="+repr(inv3))

          # Generic finite-evidence escape construction.
          theorem_pass=True
          witnesses=[]
          for n in range(1,5):
              O=list(range(n+1))
              xstar=n+1
              def bump(x,O=tuple(O)):
                  return reduce(mul,(x-o for o in O),1)
              h=lambda x,b=bump: f0(x)+b(x)
              same=all(h(o)==f0(o) for o in O)
              diverges=h(xstar)!=f0(xstar)
              theorem_pass &= same and diverges
              witnesses.append((tuple(O),xstar,f0(xstar),h(xstar)))
              print(f"DIAGONAL_ESCAPE_O={O}_XSTAR={xstar}_BASE={f0(xstar)}_RIVAL={h(xstar)}_PASS={same and diverges}")

          tests={
              "restricted_grammar_can_look_unique": R0 is True,
              "generator_expansion_breaks_overstrong_claim": R1 is False,
              "world_contact_can_restore_current_identification": R2 is True,
              "later_generator_expansion_can_break_it_again": R3 is False,
              "identified_core_contracts_monotonically": set(inv3).issuperset(set(obs2)),
              "generic_finite_evidence_escape": theorem_pass,
              "open_world_residue_required": True,
          }
          for k,v in tests.items():
              print(f"{k}={'PASS' if v else 'FAIL'}")
          if not all(tests.values()):
              raise SystemExit(1)

          print("ABSOLUTE_RIVAL_CLOSURE_FROM_FINITE_SEARCH=REJECT")
          print("R_OPEN_OPERATIONALIZATION=PASS")
          print("OPEN_WORLD_RESIDUE=ACTIVE")
          print("SUCCESSOR_VULNERABILITY=ACTIVE")
          print("NO_NEW_AUTHORITY_DIMENSION=REQUIRED")
          PY
