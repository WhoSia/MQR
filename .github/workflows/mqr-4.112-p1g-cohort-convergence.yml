name: MQR-4.112 P1-G cohort audit and independently seeded JAGS
on:
  push:
    branches: [main]
    paths:
      - "experiments/mqr-4.112/p1/cohort_source_audit.py"
      - "experiments/mqr-4.112/p1/seeded_jags_diagnostics.R"
      - ".github/workflows/mqr-4.112-p1g-cohort-convergence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-and-convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - name: Install native JAGS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jags
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::BayLum
            any::ArchaeoPhases
            any::coda
            any::runjags
          dependencies: '"hard"'
          cache: false
      - name: Fetch hash-pinned original publication supplement and source functions
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --retry-all-errors https://gchron.copernicus.org/articles/3/229/2021/gchron-3-229-2021-supplement.zip -o author_original.zip
          echo "25d1129d2eea403dfd5f622dae74721420de223c03542d4e367ca2331bfb9228  author_original.zip" | sha256sum -c -
          unzip -q author_original.zip
          for p in Generate_DataFile AgeS_Computation; do
            curl -fLSs --retry 3 https://raw.githubusercontent.com/crp2a/BayLum/2c267b63c2b7017cae1e141d0969eb0765ad2500/R/${p}.R -o upstream_BayLum_${p}_2021.R
          done
          test "$(git hash-object upstream_BayLum_Generate_DataFile_2021.R)" = 5c9aeefda52b7be8a5ae28aaf0e3fef055e5bdf8
          test "$(git hash-object upstream_BayLum_AgeS_Computation_2021.R)" = 8f269dc7d417aaf677b9ab7fba0ba42c71fd45f7
      - name: Verify published-cohort membership remains unproven
        run: |
          python3 experiments/mqr-4.112/p1/cohort_source_audit.py author_original.zip
      - name: Rebuild frozen source-2021 model and 2021-versus-modern P1-F controls
        shell: bash
        run: |
          set -euo pipefail
          Rscript experiments/mqr-4.112/p1/2021_source_preprocessing_comparison.R > p1g_preprocess.log 2>&1 || { cat p1g_preprocess.log; exit 1; }
          Rscript experiments/mqr-4.112/p1/same_model_wrapper_comparison.R > p1g_p1f_replay.log 2>&1 || { cat p1g_p1f_replay.log; exit 1; }
      - name: Run six independent JAGS chains and compute diagnostics
        shell: bash
        run: |
          set -euo pipefail
          Rscript experiments/mqr-4.112/p1/seeded_jags_diagnostics.R 2>&1 | tee p1g_out/runtime.log
          cp p1g_preprocess.log p1g_out/preprocessing.log
          cp p1g_p1f_replay.log p1g_out/p1f_reference.log
          test -s p1g_out/independent_chain_diagnostics.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mqr-4112-p1g-author-cohort-and-seeded-posteriors
          path: |
            p1g_out/
            p1f_out/same_model_wrapper_comparison.csv
          retention-days: 60
          if-no-files-found: warn
