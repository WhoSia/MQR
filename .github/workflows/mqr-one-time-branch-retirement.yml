name: MQR One-Time Branch Retirement — Archive-Guarded
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mqr-one-time-branch-retirement.yml']
permissions:
  contents: write
jobs:
  retire-only-verified-refs:
    if: github.ref == 'refs/heads/main' && github.actor == 'WhoSia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Require explicit independent Drive archive receipt and pinned branch heads
        shell: bash
        env:
          ARCHIVE_DRIVE_ID: '1BmwQ-HhEzzeVjx3HK-MfIDbLdU3DVRVX'
          ARCHIVE_ACTIONS_RUN: '37723008838'
          ARCHIVE_DIGEST: 'sha256:4799f5525878aa168d028eadf18857d7cd85b4b00a7081b763eddee3039dce9a'
        run: |
          set -euo pipefail
          # These immutable identifiers were previously validated outside Actions:
          # two git bundles, per-bundle checksums and standalone clone/fsck.
          test -n "${ARCHIVE_DRIVE_ID}"
          test "${ARCHIVE_ACTIONS_RUN}" = '37723008838'
          test "${ARCHIVE_DIGEST}" = 'sha256:4799f5525878aa168d028eadf18857d7cd85b4b00a7081b763eddee3039dce9a'
          declare -A expected
          expected['archive-attribution-20261002']='4a3c9cf59b6756d3e241f26193df71a677243d4c'
          expected['mqr-4.90-empirical-source-reanalysis']='4cdf33cf1a647c3fe11c2d5f8825dbb4d02d2589'
          for branch in archive-attribution-20261002 mqr-4.90-empirical-source-reanalysis; do
            remote="$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')"
            test "${remote}" = "${expected[$branch]}"
          done
          # Force-with-lease rejects races: does not force-reset or change main.
          for branch in archive-attribution-20261002 mqr-4.90-empirical-source-reanalysis; do
            git push --force-with-lease="refs/heads/${branch}:${expected[$branch]}" origin ":refs/heads/${branch}"
            echo "MQR490_VERIFIED_RETIREMENT=${branch} ${expected[$branch]}"
          done
          remaining="$(git ls-remote --heads origin | awk '{print $2}')"
          test "${remaining}" = 'refs/heads/main'
          echo 'MQR490_ONLY_MAIN_BRANCH=PASS'
