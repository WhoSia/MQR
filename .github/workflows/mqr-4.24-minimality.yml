name: MQR 4.24 Authority Minimality
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mqr-4.24-minimality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lattice:
    runs-on: ubuntu-latest
    steps:
      - name: Exhaustive Boolean ablation
        run: |
          python - <<'PY'
          import itertools

          def promote(C,E,P,K=False,I=False,V=False,X=False, contradiction=False):
              if contradiction:
                  return False
              return bool(C and E and P)

          rows=[]
          for C,E,P in itertools.product([False,True], repeat=3):
              y=promote(C,E,P)
              rows.append((C,E,P,y))
              print(f"C={int(C)} E={int(E)} P={int(P)} -> {'PROMOTE' if y else 'HOLD'}")

          tests={}
          tests["M1_sufficiency"] = promote(True,True,True) is True
          tests["M2_C_necessary"] = promote(False,True,True) is False
          tests["M2_E_necessary"] = promote(True,False,True) is False
          tests["M2_P_necessary"] = promote(True,True,False) is False

          proper_subsets=[r for r in rows if not (r[0] and r[1] and r[2])]
          tests["M3_no_proper_subset_suffices"] = all(not r[3] for r in proper_subsets)

          auxs=["K","I","V","X"]
          for aux in auxs:
              kwargs={a:False for a in auxs}
              kwargs[aux]=True
              tests[f"M4_{aux}_zero_delta_when_CEP_pass"] = (
                  promote(True,True,True,**kwargs) == promote(True,True,True)
              )
              tests[f"M6_{aux}_cannot_rescue_C"] = not promote(False,True,True,**kwargs)
              tests[f"M6_{aux}_cannot_rescue_E"] = not promote(True,False,True,**kwargs)
              tests[f"M6_{aux}_cannot_rescue_P"] = not promote(True,True,False,**kwargs)

          tests["M5_monotonicity_without_contradiction"] = (
              promote(True,True,True,False,False,False,False,False) and
              promote(True,True,True,True,True,True,True,False)
          )
          tests["M5_contradiction_can_defeat"] = (
              promote(True,True,True,True,True,True,True,True) is False
          )

          for k,v in tests.items():
              print(f"{k}={'PASS' if v else 'FAIL'}")
          if not all(tests.values()):
              raise SystemExit(1)

          print("BASIS_CARDINALITY=3")
          print("UNIQUE_PROMOTING_CEP_STATE=111")
          print("AUXILIARY_SCIENTIFIC_AUTHORITY_DELTA=0")
          print("MINIMAL_REALIST_AUTHORITY_BASIS={C,E,P}")
          print("AUTHORITY_MINIMALITY_THEOREM=PASS")
          PY
