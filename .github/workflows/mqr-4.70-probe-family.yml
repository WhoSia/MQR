name: MQR-4.70 Probe-Family Constitution Court

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.70/**'
      - 'language/real/lean/MQR/ProbeFamily.lean'
      - '.github/workflows/mqr-4.70-probe-family.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  canonical-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical finite court
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.70/family_partition_court.py | tee /tmp/mqr470-python.log
          grep -F 'MQR470_COURT=PASS' /tmp/mqr470-python.log
          grep -F 'MQR470_CURRENT_ALIGNMENT_CHOICE=R' /tmp/mqr470-python.log
          grep -F 'MQR470_WITHIN_CLASS_CHOICE=C' /tmp/mqr470-python.log
          grep -F 'MQR470_GOOD_TRANSPORT=PASS' /tmp/mqr470-python.log
          grep -F 'MQR470_LOSSY_TRANSPORT=BREAK' /tmp/mqr470-python.log
      - uses: actions/upload-artifact@v4
        with:
          name: mqr-4.70-canonical-results
          path: experiments/mqr-4.70/results/

  independent-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical reference
        run: python3 experiments/mqr-4.70/family_partition_court.py
      - name: Run independent C++
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 experiments/mqr-4.70/independent_family_partition.cpp -o /tmp/mqr470-cpp
          /tmp/mqr470-cpp | tee /tmp/mqr470-cpp.log
          grep -F 'MQR470_CPP_COURT=PASS' /tmp/mqr470-cpp.log
          grep -F 'MQR470_CPP_INCLUSION_FAILURES=0' /tmp/mqr470-cpp.log
          grep -F 'MQR470_CPP_CURRENT_ALIGNMENT_CHOICE=R' /tmp/mqr470-cpp.log
          grep -F 'MQR470_CPP_WITHIN_CLASS_CHOICE=C' /tmp/mqr470-cpp.log
          grep -F 'MQR470_CPP_GOOD_TRANSPORT=PASS' /tmp/mqr470-cpp.log
          grep -F 'MQR470_CPP_LOSSY_TRANSPORT=BREAK' /tmp/mqr470-cpp.log
      - name: Cross-check key census values
        run: |
          set -euo pipefail
          py_ab=$(awk -F '\t' '$1=="F_AB_CLASS_COUNT"{print $2}' experiments/mqr-4.70/results/court_summary.tsv)
          py_abc=$(awk -F '\t' '$1=="F_ABC_CLASS_COUNT"{print $2}' experiments/mqr-4.70/results/court_summary.tsv)
          py_min=$(awk -F '\t' '$1=="MINIMAL_FAMILY_COUNT_FOR_F_ABC"{print $2}' experiments/mqr-4.70/results/court_summary.tsv)
          grep -F "MQR470_CPP_CLASSES_F_AB=$py_ab" /tmp/mqr470-cpp.log
          grep -F "MQR470_CPP_CLASSES_F_ABC=$py_abc" /tmp/mqr470-cpp.log
          grep -F "MQR470_CPP_MINIMAL_FAMILY_COUNT=$py_min" /tmp/mqr470-cpp.log
          echo MQR470_PYTHON_CPP_KEY_CONCORDANCE=PASS

  lean-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - name: Verify finite family theorems
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/ProbeFamily.lean | tee /tmp/mqr470-lean.log
          if grep -F 'sorryAx' /tmp/mqr470-lean.log; then exit 1; fi
          for theorem in             MQR.larger_family_equivalence_implies_smaller             MQR.eqUnder_refl             MQR.eqUnder_symm             MQR.eqUnder_trans             MQR.added_distinguishing_test_refines             MQR.added_equal_test_preserves_equivalence
          do
            grep -F "'$theorem' does not depend on any axioms" /tmp/mqr470-lean.log
          done
          echo MQR470_LEAN=PASS

  structural-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen constitutional boundaries
        run: |
          set -euo pipefail
          grep -F 'U subseteq V' experiments/mqr-4.70/PRESEAL.md
          grep -F 'F9 Open-world overclaim' experiments/mqr-4.70/PRESEAL.md
          grep -F 'F12 Naturalistic absence' experiments/mqr-4.70/PRESEAL.md
          grep -F 'hitting-set' experiments/mqr-4.70/PRESEAL.md
          grep -F 'MQR-4.62' experiments/mqr-4.70/PRESEAL.md
          grep -F 'EXTENSIONAL_STATE_INSUFFICIENT_ON_FROZEN_COURT' experiments/mqr-4.70/CUSTODY-PREFLIGHT.md
          grep -F $'H000\t0\t0\t0\t0' experiments/mqr-4.70/RESPONSE-MATRIX-FREEZE.tsv
          grep -F $'F_AB\tA,B\tcurrent_coarse' experiments/mqr-4.70/PROBE-FAMILIES-FREEZE.tsv
          echo MQR470_STRUCTURAL_GUARDS=PASS


  hypergraph-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical separator-hypergraph census
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.70/separating_hypergraph.py | tee /tmp/mqr470-hypergraph.log
          grep -F 'MQR470_HYPERGRAPH=PASS' /tmp/mqr470-hypergraph.log
          grep -F 'MQR470_GF2_RANK=3' /tmp/mqr470-hypergraph.log
          grep -F 'MQR470_RANK3_BASE_COUNT=24' /tmp/mqr470-hypergraph.log
          grep -F 'MQR470_FULL_SEPARATING_BASE_COUNT=24' /tmp/mqr470-hypergraph.log
          grep -F 'MQR470_DUPLICATE_QUOTIENT_BASE_COUNT=16' /tmp/mqr470-hypergraph.log
          grep -F 'MQR470_LOOP_TESTS=CONST' /tmp/mqr470-hypergraph.log
          grep -F 'MQR470_PARALLEL_CLASSES=A,R' /tmp/mqr470-hypergraph.log
      - name: Independent C++ census
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 experiments/mqr-4.70/independent_hypergraph.cpp -o /tmp/mqr470-hg-cpp
          /tmp/mqr470-hg-cpp | tee /tmp/mqr470-hg-cpp.log
          grep -F 'MQR470_CPP_HYPERGRAPH=PASS' /tmp/mqr470-hg-cpp.log
          grep -F 'MQR470_CPP_GF2_RANK=3' /tmp/mqr470-hg-cpp.log
          grep -F 'MQR470_CPP_RANK3_BASE_COUNT=24' /tmp/mqr470-hg-cpp.log
          grep -F 'MQR470_CPP_DUPLICATE_QUOTIENT_BASE_COUNT=16' /tmp/mqr470-hg-cpp.log
          grep -F 'MQR470_CPP_PAIR_SEPARATOR_OBLIGATIONS=28' /tmp/mqr470-hg-cpp.log
          grep -F 'MQR470_CPP_LOOP_CONST=YES' /tmp/mqr470-hg-cpp.log
          grep -F 'MQR470_CPP_PARALLEL_A_R=YES' /tmp/mqr470-hg-cpp.log
      - uses: actions/upload-artifact@v4
        with:
          name: mqr-4.70-hypergraph-results
          path: |
            experiments/mqr-4.70/results/hypergraph_summary.tsv
            experiments/mqr-4.70/results/basis_census.tsv
            experiments/mqr-4.70/results/separator_hypergraph.tsv
            experiments/mqr-4.70/results/linear_representation.tsv


  closure-certificate-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical closure certificate court
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.70/closure_certificate_court.py | tee /tmp/mqr470-closure.log
          grep -F 'MQR470_CLOSURE_COURT=PASS' /tmp/mqr470-closure.log
          grep -F 'MQR470_F_AB_EXTERIOR_SPLITTERS=C,K,P' /tmp/mqr470-closure.log
          grep -F 'MQR470_F_ABC_C4=TRUE' /tmp/mqr470-closure.log
          grep -F 'MQR470_MINIMAL_C4_FAMILY_COUNT=24' /tmp/mqr470-closure.log
          grep -F 'MQR470_MINIMAL_C4_FAMILY_SIZE=3' /tmp/mqr470-closure.log
          grep -F 'MQR470_C1_C3_COLLAPSE=YES' /tmp/mqr470-closure.log
          grep -F 'MQR470_C2_C4_COLLAPSE=YES' /tmp/mqr470-closure.log
      - name: Independent C++ closure court
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 experiments/mqr-4.70/independent_closure_certificate.cpp -o /tmp/mqr470-closure-cpp
          /tmp/mqr470-closure-cpp | tee /tmp/mqr470-closure-cpp.log
          grep -F 'MQR470_CPP_CLOSURE_COURT=PASS' /tmp/mqr470-closure-cpp.log
          grep -F 'MQR470_CPP_F_AB_C4=FALSE' /tmp/mqr470-closure-cpp.log
          grep -F 'MQR470_CPP_F_ABC_C4=TRUE' /tmp/mqr470-closure-cpp.log
          grep -F 'MQR470_CPP_F_AB_EXTERIOR_SPLITTERS=C,K,P' /tmp/mqr470-closure-cpp.log
          grep -F 'MQR470_CPP_MINIMAL_C4_FAMILY_COUNT=24' /tmp/mqr470-closure-cpp.log
          grep -F 'MQR470_CPP_MINIMAL_C4_FAMILY_SIZE=3' /tmp/mqr470-closure-cpp.log
      - uses: actions/upload-artifact@v4
        with:
          name: mqr-4.70-closure-certificates
          path: |
            experiments/mqr-4.70/results/closure_certificates.tsv
            experiments/mqr-4.70/results/closure_minimal_families.tsv


  stochastic-closure-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical stochastic closure court
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.70/stochastic_closure_court.py | tee /tmp/mqr470-stochastic.log
          grep -F 'MQR470_STOCHASTIC_CLOSURE=PASS' /tmp/mqr470-stochastic.log
          grep -F 'MQR470_F_KERNEL=-0.30,1.30' /tmp/mqr470-stochastic.log
          grep -F 'MQR470_G_KERNEL=0.30,0.70' /tmp/mqr470-stochastic.log
          grep -F 'MQR470_C3_C4_SEPARATION=YES' /tmp/mqr470-stochastic.log
      - name: Independent C++ stochastic closure court
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 experiments/mqr-4.70/independent_stochastic_closure.cpp -o /tmp/mqr470-stochastic-cpp
          /tmp/mqr470-stochastic-cpp | tee /tmp/mqr470-stochastic-cpp.log
          grep -F 'MQR470_CPP_STOCHASTIC_CLOSURE=PASS' /tmp/mqr470-stochastic-cpp.log
          grep -F 'MQR470_CPP_C3_C4_SEPARATION=YES' /tmp/mqr470-stochastic-cpp.log
      - uses: actions/upload-artifact@v4
        with:
          name: mqr-4.70-stochastic-closure
          path: experiments/mqr-4.70/results/stochastic_closure.tsv
