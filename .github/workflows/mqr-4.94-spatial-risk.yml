name: MQR 4.94 — Original Geographic Contracts and Target Risk Bounds
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.94/spatial_risk_identification.py'
      - '.github/workflows/mqr-4.94-spatial-risk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-original-geo-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pinned Source Numerics
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 cvxopt==1.3.2 scikit-learn==1.5.1
      - name: Execute Frozen Site-Disjoint Geographic Contract and Bound Test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/mqr-4.92:experiments/mqr-4.93:experiments/mqr-4.94 python experiments/mqr-4.94/spatial_risk_identification.py 2>&1 | tee mqr494-spatial-risk.log
          grep -Fx MQR494_SPATIAL_ID_BOUNDS=PASS mqr494-spatial-risk.log
      - name: Retain Failure and Success Logs and Original-Data Diagnostic Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MQR494-Original-Geo-Spatial-Risk-Identification
          path: |
            mqr494-spatial-risk.log
            mqr494-spatial-dependence-and-sharp-risk.json
          retention-days: 30
