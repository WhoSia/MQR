name: MQR 4.32 Tokenizers Direct Replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen mediated seal and canonical receipt
        shell: bash
        run: |
          set -euo pipefail
          SEAL=experiments/mqr-4.32/seals/tkn-001-mediated.md
          test -f "$SEAL"
          grep -F 'TKN-001-COMPOSITION-CANDIDATE=YES' "$SEAL"
          grep -F 'MEDIATED-A-C-PREDICTION=TRANSPORT_PASS' "$SEAL"
          grep -F $'observed_direct_A_TO_C\tTRANSPORT_PASS' receipts/mqr-4.32/tokenizers-direct.tsv

  version:
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['0.21.4', '0.23.2']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Materialize exact dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          sed 's/__TOKENIZERS_VERSION__/${{ matrix.version }}/g' \
            experiments/mqr-4.32/external/tokenizers/Cargo.template.toml \
            > experiments/mqr-4.32/external/tokenizers/Cargo.toml
      - name: Format gate
        run: cargo fmt --manifest-path experiments/mqr-4.32/external/tokenizers/Cargo.toml -- --check
      - name: Generate exact lockfile
        run: cargo generate-lockfile --manifest-path experiments/mqr-4.32/external/tokenizers/Cargo.toml
      - name: Locked build
        run: cargo build --locked --manifest-path experiments/mqr-4.32/external/tokenizers/Cargo.toml
      - name: Replay held-out direct fixtures
        shell: bash
        run: |
          set -euo pipefail
          BIN=experiments/mqr-4.32/external/tokenizers/target/debug/mqr432-tokenizers-probe
          "$BIN" heldout > "heldout-${{ matrix.version }}.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: tokenizers-direct-replay-${{ matrix.version }}
          path: heldout-${{ matrix.version }}.tsv
          retention-days: 30

  adjudicate:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tokenizers-direct-replay-*
          path: results
          merge-multiple: true
      - name: Replay direct adjudication against frozen receipt
        shell: bash
        run: |
          set -euo pipefail
          DIRECT=TRANSPORT_FAIL
          PATH_CLASS=NONCOMMUTES_OTHER
          COMPOSITION=NONTRANSITIVITY_WITNESS
          if cmp -s results/heldout-0.21.4.tsv results/heldout-0.23.2.tsv; then
            DIRECT=TRANSPORT_PASS
            PATH_CLASS=COMMUTES_AT_CLAIM_QUOTIENT
            COMPOSITION=COMPOSITION_PASS
          fi
          grep -F $'observed_direct_A_TO_C\t'"$DIRECT" receipts/mqr-4.32/tokenizers-direct.tsv
          grep -F $'path_class\t'"$PATH_CLASS" receipts/mqr-4.32/tokenizers-direct.tsv
          grep -F $'composition_state\t'"$COMPOSITION" receipts/mqr-4.32/tokenizers-direct.tsv
          echo "DIRECT_REPLAY_STATE=$DIRECT"
          echo "DIRECT_REPLAY_PATH=$PATH_CLASS"
          echo "DIRECT_REPLAY_COMPOSITION=$COMPOSITION"
          echo 'CANONICAL_RECEIPT_MUTATION=DISABLED'
