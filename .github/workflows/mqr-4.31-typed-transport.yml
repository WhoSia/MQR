name: MQR 4.31 Typed Transport

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.31/**'
      - '.github/workflows/mqr-4.31-typed-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust canonical transport evaluator
        run: cargo build --manifest-path experiments/mqr-4.31/rust/Cargo.toml --release
      - name: Execute fresh typed-transport confirmation
        run: ./experiments/mqr-4.31/rust/target/release/mqr431 experiments/mqr-4.31/fresh-adjudication.tsv
