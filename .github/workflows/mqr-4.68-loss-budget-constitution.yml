name: MQR-4.68 Scientific-Authority Loss-Budget Constitution Court

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.68/**'
      - 'language/real/src/loss_contract_v30.rs'
      - 'language/real/prolog/loss_contract_v30.pl'
      - 'language/real/lean/MQR/LossContract.lean'
      - 'language/real/examples/mqr-4.68-*.real'
      - 'language/real/Cargo.toml'
      - '.github/workflows/mqr-4.68-loss-budget-constitution.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  canonical-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical Python court
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.68/loss_budget_court.py experiments/mqr-4.68/COURT-FREEZE.tsv | tee /tmp/mqr468-python.log
          grep -F 'MQR468_PYTHON_COURT=PASS' /tmp/mqr468-python.log
          grep -F $'EXPECTATION_MISMATCHES\t0' experiments/mqr-4.68/results/python_summary.tsv
          grep -F $'UTILITY_RECOVERY_CONTROLS\t1' experiments/mqr-4.68/results/python_summary.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: mqr-4.68-canonical-results
          path: experiments/mqr-4.68/results/
      - name: Publish canonical receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.68/Canonical-Court" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  independent-concordance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical Python
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.68/loss_budget_court.py experiments/mqr-4.68/COURT-FREEZE.tsv
      - name: Run independent C++
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 experiments/mqr-4.68/independent_loss_budget.cpp -o /tmp/mqr468-cpp
          /tmp/mqr468-cpp experiments/mqr-4.68/COURT-FREEZE.tsv | tee /tmp/mqr468-cpp.log
          grep -F 'MQR468_CPP_COURT=PASS' /tmp/mqr468-cpp.log
      - name: Exact concordance
        run: |
          set -euo pipefail
          diff -u experiments/mqr-4.68/results/python_results.tsv experiments/mqr-4.68/results/cpp_results.tsv
          diff -u experiments/mqr-4.68/results/python_summary.tsv experiments/mqr-4.68/results/cpp_summary.tsv
          echo MQR468_PYTHON_CPP_CONCORDANCE=PASS
      - name: Publish concordance receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.68/Python-Cpp-Concordance" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  real-loss-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
      - name: Build Rust loss-contract candidate
        run: |
          set -euo pipefail
          cargo build --manifest-path language/real/Cargo.toml --bin real-v30-loss-contract
      - name: Rust-Prolog packet concordance
        run: |
          set -euo pipefail
          BIN=language/real/target/debug/real-v30-loss-contract
          for packet in \
            language/real/examples/mqr-4.68-local-soft.real \
            language/real/examples/mqr-4.68-reopen.real \
            language/real/examples/mqr-4.68-cross-domain.real \
            language/real/examples/mqr-4.68-posthoc-rescue.real
          do
            "$BIN" "$packet" > /tmp/rust.out
            swipl -q -f language/real/prolog/loss_contract_v30.pl -- "$packet" > /tmp/prolog.out
            diff -u /tmp/rust.out /tmp/prolog.out
          done
          "$BIN" language/real/examples/mqr-4.68-local-soft.real | tee /tmp/local.log
          grep -F 'loss_contract.decision=ACCEPT_WITH_AUDIT' /tmp/local.log
          grep -F 'loss_contract.world_validity=NOT_ESTABLISHED' /tmp/local.log
          grep -F 'loss_contract.global_loss_score=FORBIDDEN' /tmp/local.log
          "$BIN" language/real/examples/mqr-4.68-reopen.real | grep -F 'loss_contract.decision=REEXPAND_REQUIRED'
          "$BIN" language/real/examples/mqr-4.68-cross-domain.real | grep -F 'loss_contract.decision=HOLD_TRANSPORT'
          "$BIN" language/real/examples/mqr-4.68-posthoc-rescue.real | grep -F 'loss_contract.decision=REVISION_FORBIDDEN'
          echo MQR468_REAL_LOSS_CONTRACT=PASS
      - name: Reject hidden scalar authority
        run: |
          set -euo pipefail
          sed 's/scalar_mode OFF/scalar_mode ON/' language/real/examples/mqr-4.68-local-soft.real >/tmp/bad.real
          if language/real/target/debug/real-v30-loss-contract /tmp/bad.real >/tmp/bad.out 2>/tmp/bad.err; then
            echo "hidden scalar mode unexpectedly accepted"
            exit 1
          fi
          grep -F 'scalar_mode must be OFF' /tmp/bad.err
      - name: Publish Real-Lang receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.68/Real-Loss-Contract" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  lean-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - name: Verify loss-contract theorem boundary
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/LossContract.lean | tee /tmp/mqr468-lean.log
          if grep -F 'sorryAx' /tmp/mqr468-lean.log; then exit 1; fi
          for theorem in \
            MQR.open_warrant_blocks \
            MQR.transport_hold_blocks \
            MQR.reopening_trigger_blocks \
            MQR.unauthorized_revision_blocks \
            MQR.admissible_implies_componentwise
          do
            grep -F "'$theorem' does not depend on any axioms" /tmp/mqr468-lean.log
          done
          echo MQR468_LEAN_LOSS_CONTRACT=PASS
      - name: Publish Lean receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.68/Lean-Boundary" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  structural-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen anti-self-confirmation boundaries
        run: |
          set -euo pipefail
          grep -F 'representational reducibility' experiments/mqr-4.68/PRESEAL.md
          grep -F 'authority reducibility' experiments/mqr-4.68/PRESEAL.md
          grep -F 'F10 — Post-result rescue' experiments/mqr-4.68/PRESEAL.md
          grep -F 'UTILITY_RECOVERY_CONTROL' experiments/mqr-4.68/COURT-FREEZE.tsv
          grep -F 'ENDOGENOUS TOLERANCE REVISION != MQR NOVELTY' experiments/mqr-4.68/LITERATURE.md
          grep -F 'loss_contract.global_loss_score=FORBIDDEN' language/real/src/loss_contract_v30.rs
          grep -F 'loss_contract.cross_domain_severity_equality=NOT_ASSUMED' language/real/src/loss_contract_v30.rs
          echo MQR468_STRUCTURAL_GUARDS=PASS
      - name: Publish guard receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.68/Structural-Guards" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
