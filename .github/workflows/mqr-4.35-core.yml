name: MQR 4.35 Relational Receipt Collision Court

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.35/**'
      - '.github/workflows/mqr-4.35-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forcing-court:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preseal integrity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MU(x) = MU(y)' experiments/mqr-4.35/PRESEAL.md
          grep -F 'NU0 = MU' experiments/mqr-4.35/PRESEAL.md
          grep -F 'NU1 = MU + MAP_ALGEBRA' experiments/mqr-4.35/PRESEAL.md
          grep -F 'NU2 = NU1 + INTERVENTION_ALIGNMENT' experiments/mqr-4.35/PRESEAL.md
          grep -F 'NU3 = NU2 + SENSITIVITY_SCOPE' experiments/mqr-4.35/PRESEAL.md
          grep -F 'Universal sufficiency is not promotable in this stage.' experiments/mqr-4.35/PRESEAL.md
          echo 'PRESEAL_INTEGRITY=PASS'

      - name: Syntax and deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile experiments/mqr-4.35/forcing_court.py
          python experiments/mqr-4.35/forcing_court.py | tee /tmp/run1.out
          python experiments/mqr-4.35/forcing_court.py | tee /tmp/run2.out
          diff -u /tmp/run1.out /tmp/run2.out
          echo 'DETERMINISTIC_REPLAY=PASS'

      - name: Exact collision vector
        shell: bash
        run: |
          set -euo pipefail
          python experiments/mqr-4.35/forcing_court.py | tee /tmp/court.out
          grep -F 'NU0_COLLISIONS=3' /tmp/court.out
          grep -F 'NU1_COLLISIONS=2' /tmp/court.out
          grep -F 'NU2_COLLISIONS=1' /tmp/court.out
          grep -F 'NU3_COLLISIONS=0' /tmp/court.out
          grep -F 'FORCING_CONSTITUTION=PASS' /tmp/court.out
          grep -F 'MU_UNIVERSAL_SUFFICIENCY=FAIL' /tmp/court.out
          grep -F 'COARSEST_FORCING_SEPARATING_REFINEMENT=NU3' /tmp/court.out

      - name: Anti-tautology gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('experiments/mqr-4.35/forcing_court.py')
          src=p.read_text()
          tree=ast.parse(src)
          fn=next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name=='empirical_reach')
          segment=ast.get_source_segment(src, fn)
          forbidden=['map_algebra','intervention_alignment','sensitivity_scope','case_id','mu']
          bad=[x for x in forbidden if x in segment]
          if bad:
              raise SystemExit('empirical reach leaked mechanism labels: '+','.join(bad))
          print('EMPIRICAL_REACH_INDEPENDENT_OF_MU_NU_LABELS=PASS')
          PY

      - name: Claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'OBSERVED_SEPARATION_UNDER_FROZEN_PROBE_ALGEBRA' experiments/mqr-4.35/PRESEAL.md
          if grep -Fq 'NU3 = UNIVERSALLY_SUFFICIENT' experiments/mqr-4.35/PRESEAL.md; then
            echo 'illegal universal promotion' >&2
            exit 1
          fi
          echo 'OPEN_WORLD_RESIDUE=CONSTITUTIVE'

      - name: Court summary
        run: |
          echo 'MQR435_SAME_MU_COLLISION_FORCING=EXECUTED'
          echo 'MQR435_MU_UNIVERSAL_SUFFICIENCY=DEFEAT_IF_EXACT_VECTOR_PASSES'
          echo 'MQR435_REFINEMENT_LADDER=PREDECLARED'
          echo 'MQR435_EXTERNAL_IDENTIFICATION=NOT_YET_TESTED'
