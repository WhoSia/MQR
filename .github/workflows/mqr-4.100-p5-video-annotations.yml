name: "MQR 4.100 — Video-Labeled Independent Reference Source Audit"
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.100/p5_clemson_audit.py'
      - '.github/workflows/mqr-4.100-p5-video-annotations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-annotations:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download provider-hosted event/sensor source with normal TLS verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mqr4100-p5
          # The publisher currently omits required certificate intermediates.
          # Obtain the *public* CA intermediates from the CA's verified HTTPS
          # repository, verify that chain against GitHub's existing OS roots,
          # and pass ONLY this verified chain as an additional curl CA bundle.
          # Do not use --insecure and do not introduce a novel trusted root.
          curl --fail --location --show-error --silent --max-time 25 \
            'https://repository.emsign.com/certs/EEEMIncommonOVG2C.crt' \
            --output mqr4100-p5/incommon-ovg2c.der
          curl --fail --location --show-error --silent --max-time 25 \
            'https://repository.emsign.com/certs/EMIncommonOVG2C.p7c' \
            --output mqr4100-p5/incommon-chain.p7c
          openssl x509 -inform DER -in mqr4100-p5/incommon-ovg2c.der \
            -out mqr4100-p5/incommon-ovg2c.pem
          openssl pkcs7 -inform DER -in mqr4100-p5/incommon-chain.p7c -print_certs \
            -out mqr4100-p5/incommon-chain.pem
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt \
            -untrusted mqr4100-p5/incommon-chain.pem mqr4100-p5/incommon-ovg2c.pem
          cat /etc/ssl/certs/ca-certificates.crt \
            mqr4100-p5/incommon-ovg2c.pem mqr4100-p5/incommon-chain.pem \
            > mqr4100-p5/verified-publisher-chain.pem
          curl --fail --location --show-error --silent --retry 2 --max-time 120 \
            --cacert mqr4100-p5/verified-publisher-chain.pem \
            'https://cecas.clemson.edu/tracking/Pedometer/Data.zip' \
            --output mqr4100-p5/Clemson-Pedometer-Published-Data.zip
          echo 'ce37832d5e234f6f014193a3a2af2f3162ab90905f303d473849512d690885da  mqr4100-p5/Clemson-Pedometer-Published-Data.zip' | sha256sum -c -
      - name: Match 30 participants, 3 gait regimes, 90 annotated paired files
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.100/p5_clemson_audit.py \
            mqr4100-p5/Clemson-Pedometer-Published-Data.zip \
            mqr4100-p5/annotation-source-audit.json 2>&1 | tee mqr4100-p5/source-replay.log
          grep -F 'MQR4100_CLEMSON_SOURCE_INDEXED_VIDEO_ANNOTATION_AUDIT_PASS;EVENT_VALIDITY_AND_REANNOTATION_HOLD' mqr4100-p5/source-replay.log
      - name: Archive source bytes and nonedited original-audit receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MQR4100-Clemson-Video-Annotation-And-Three-IMU-Source
          path: |
            mqr4100-p5/Clemson-Pedometer-Published-Data.zip
            mqr4100-p5/annotation-source-audit.json
            mqr4100-p5/source-replay.log
          if-no-files-found: warn
          retention-days: 90
