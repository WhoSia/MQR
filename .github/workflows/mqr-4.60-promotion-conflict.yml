name: MQR-4.60 Promotion Reason Conflict

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.60/**'
      - 'language/real/src/promote_v27.rs'
      - 'language/real/prolog/promote_v27.pl'
      - 'language/real/examples/mqr-4.60-*.real'
      - 'language/real/lean/MQR/PromotionConflict.lean'
      - 'language/real/lean/MQR.lean'
      - 'language/real/Cargo.toml'
      - 'language/real/V27-PROMOTION-CONFLICT.md'
      - '.github/workflows/mqr-4.60-promotion-conflict.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen 16-case court
        run: python experiments/mqr-4.60/reason_conflict_court.py
      - name: Publish Court receipt
        if: ${{ always() }}
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context="MQR-4.60/Court" -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  real-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Prolog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swi-prolog-nox
      - name: Rust build
        run: cargo build --manifest-path language/real/Cargo.toml --release --bin real-v27-promote
      - name: Rust-Prolog concordance
        shell: bash
        run: |
          set -euo pipefail
          V=./language/real/target/release/real-v27-promote
          P=language/real/prolog/promote_v27.pl
          for f in language/real/examples/mqr-4.60-incomparable.real language/real/examples/mqr-4.60-veto.real; do
            "$V" "$f" > /tmp/rust.out
            swipl -q -s "$P" -g "run('$f'),halt" -t "halt(1)" > /tmp/prolog.out
            diff -u /tmp/rust.out /tmp/prolog.out
          done
          grep -F 'promotion.decision=HOLD' /tmp/rust.out
          echo MQR460_RUST_PROLOG_CONCORDANCE=PASS
      - name: Publish Real-Language receipt
        if: ${{ always() }}
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context="MQR-4.60/Real-Language" -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  lean-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lean package
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - name: Check conflict theorem ancestry
        shell: bash
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/PromotionConflict.lean | tee /tmp/mqr460.log
          if grep -F 'sorryAx' /tmp/mqr460.log; then exit 1; fi
          test "$(grep -c 'does not depend on any axioms' /tmp/mqr460.log)" -ge 5
          echo MQR460_AXIOM_ANCESTRY=EMPTY
      - name: Publish Lean receipt
        if: ${{ always() }}
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context="MQR-4.60/Lean" -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  lean-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate Lean build
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - name: Compile aggregate MQR
        run: cd language/real/lean && lake env lean MQR.lean
      - name: Publish integration receipt
        if: ${{ always() }}
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          state=success; if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context="MQR-4.60/Lean-Integration" -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
