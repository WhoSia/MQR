name: Real-Language One-Shot Rustfmt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-language-format-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Canonical rustfmt only
        run: cargo fmt --manifest-path language/real/Cargo.toml
      - name: Commit format-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add language/real/src
          if git diff --cached --quiet; then
            echo 'No formatting diff.'
          else
            git commit -m 'Real-Language v0.4: apply canonical rustfmt only [skip ci]'
            git push
          fi
