name: MQR-4.76 Challenge Authority Upgrade

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.76/**'
      - 'language/real/V33-CHALLENGE-AUTHORITY-UPGRADE-CANDIDATE.md'
      - 'language/real/src/upgrade_v33.rs'
      - 'language/real/prolog/upgrade_v33.pl'
      - 'language/real/examples/mqr-4.76-*.realupgrade'
      - 'language/real/tests/invalid/mqr-4.76-*.realupgrade'
      - 'language/real/lean/MQR/ChallengeAuthorityUpgrade.lean'
      - 'language/real/lean/MQR.lean'
      - 'language/real/Cargo.toml'
      - '.github/workflows/mqr-4.76-challenge-authority-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustc --edition=2024 -O experiments/mqr-4.76/upgrade_court.rs -o /tmp/mqr476-court
          /tmp/mqr476-court experiments/mqr-4.76/COURT-FREEZE.tsv | tee /tmp/mqr476.log
          grep -F 'MQR476_CASES=16' /tmp/mqr476.log
          grep -F 'MQR476_PASS=16' /tmp/mqr476.log
          grep -F 'MQR476_ORIGIN_NONLAUNDERING=PASS' /tmp/mqr476.log
          grep -F 'MQR476_CHALLENGE_COURT=PASS' /tmp/mqr476.log

  independent-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq swi-prolog-nox
      - run: |
          swipl -q -f experiments/mqr-4.76/independent_upgrade_court.pl -- experiments/mqr-4.76/COURT-FREEZE.tsv | tee /tmp/mqr476-prolog.log
          grep -F 'MQR476_CASES=17' /tmp/mqr476-prolog.log
          grep -F 'MQR476_PASS=17' /tmp/mqr476-prolog.log
          grep -F 'MQR476_PROLOG_CHALLENGE_COURT=PASS' /tmp/mqr476-prolog.log

  real-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq swi-prolog-nox
      - run: cargo build --manifest-path language/real/Cargo.toml --release --bin real-v33-upgrade
      - run: |
          set -euo pipefail
          R=./language/real/target/release/real-v33-upgrade
          P=language/real/prolog/upgrade_v33.pl
          for f in language/real/examples/mqr-4.76-*.realupgrade; do
            "$R" "$f" > /tmp/rust.out
            swipl -q -f "$P" -- "$f" > /tmp/prolog.out
            diff -u /tmp/rust.out /tmp/prolog.out
          done
          for f in language/real/tests/invalid/mqr-4.76-*.realupgrade; do
            if "$R" "$f" >/tmp/rust-invalid.out 2>&1; then echo "Rust accepted invalid $f"; exit 1; fi
            if swipl -q -f "$P" -- "$f" >/tmp/prolog-invalid.out 2>&1; then echo "Prolog accepted invalid $f"; exit 1; fi
          done
          echo MQR476_REALUPGRADE_CONCORDANCE=PASS
          echo MQR476_REALUPGRADE_NEGATIVE_FIXTURES=PASS

  lean-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - run: |
          cd language/real/lean
          lake env lean MQR/ChallengeAuthorityUpgrade.lean | tee /tmp/mqr476-lean.log
          if grep -F 'sorryAx' /tmp/mqr476-lean.log; then exit 1; fi
          test "$(grep -c 'does not depend on any axioms' /tmp/mqr476-lean.log)" -ge 6
          lake env lean MQR.lean
          echo MQR476_LEAN=PASS

  structural-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          grep -F 'LATER_INDEPENDENCE_UPGRADE != ORIGINAL_INDEPENDENCE' experiments/mqr-4.76/PRESEAL.md
          grep -F 'EXTERNAL_LOCATION != EXTERNAL_AUTHORITY' experiments/mqr-4.76/PRESEAL.md
          grep -F 'REALUPGRADE 0.33-CANDIDATE' language/real/V33-CHALLENGE-AUTHORITY-UPGRADE-CANDIDATE.md
          test "$(git log -n 100 --format='%an%n%cn' | grep -Fc 'github-actions[bot]' || true)" -eq 0
          test "$(grep -R -E 'contents:[[:space:]]*write' .github/workflows | wc -l)" -eq 0
          if grep -R -E '(^|[[:space:]])git[[:space:]]+(commit|push|tag)([[:space:]]|$)' .github/workflows/*.yml; then
            echo 'forbidden repository writeback command found in workflow'
            exit 1
          fi
          echo MQR476_STRUCTURAL_GUARDS=PASS
