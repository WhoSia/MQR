name: MQR Branch Archive — Read-Only Bundle and Restore Test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mqr-branch-archive.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin source branch SHA and write independently restorable Git bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p branch-archive
          cat > branch-archive/BRANCHES.tsv <<'EOF'
          branch	pinned_sha	role
          archive-attribution-20261002	4a3c9cf59b6756d3e241f26193df71a677243d4c	diverged_human_history
          mqr-4.90-empirical-source-reanalysis	4cdf33cf1a647c3fe11c2d5f8825dbb4d02d2589	merged_ancestor
          EOF
          echo 'MQR — repository WhoSia/MQR; archive created from pinned Git refs; not a source-of-truth promotion.' > branch-archive/README.txt
          for branch in archive-attribution-20261002 mqr-4.90-empirical-source-reanalysis; do
            git fetch --no-tags origin "+refs/heads/${branch}:refs/heads/${branch}"
            actual="$(git rev-parse "refs/heads/${branch}")"
            expected="$(awk -F '\t' -v name="${branch}" '$1 == name {print $2}' branch-archive/BRANCHES.tsv)"
            test "${actual}" = "${expected}"
            git bundle create "branch-archive/${branch}.bundle" "refs/heads/${branch}"
            git bundle verify "branch-archive/${branch}.bundle"
            mkdir -p "branch-archive/check-${branch}"
            git clone --quiet --bare "branch-archive/${branch}.bundle" "branch-archive/check-${branch}/restored.git"
            recovered="$(git --git-dir="branch-archive/check-${branch}/restored.git" rev-parse "refs/heads/${branch}")"
            test "${recovered}" = "${expected}"
            git --git-dir="branch-archive/check-${branch}/restored.git" fsck --full --no-reflogs --strict
            rm -rf "branch-archive/check-${branch}"
            echo "MQR490_RESTORED_BRANCH=${branch} ${expected}"
          done
          (cd branch-archive && sha256sum *.bundle > SHA256SUMS)
          (cd branch-archive && sha256sum -c SHA256SUMS)
          echo 'MQR490_BRANCH_ARCHIVE_RESTORE=PASS'
      - name: Upload restorable archive with read-only permissions
        uses: actions/upload-artifact@v4
        with:
          name: MQR-20261008-Branch-History-Bundles
          path: branch-archive/
          retention-days: 30
