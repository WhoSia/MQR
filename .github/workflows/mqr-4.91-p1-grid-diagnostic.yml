name: MQR-4.91 P1 — Pinned Maxent Source Grid and Mask Diagnosis
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.91/p1_grid_mask_diagnostic.py'
      - '.github/workflows/mqr-4.91-p1-grid-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instrument source-mask and grid overlap
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/mqr-4.90 python experiments/mqr-4.91/p1_grid_mask_diagnostic.py 2>&1 | tee p491-grid-diagnostic.log
          grep -Fx MQR491_GRID_DIAGNOSTIC_WRITTEN=YES p491-grid-diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MQR491-P1-Source-Grid-Diagnostic
          path: |
            p491-grid-diagnostic.log
            p491-grid-diagnostic/geometry-mask.json
          retention-days: 30
