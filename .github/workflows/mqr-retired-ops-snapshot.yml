name: MQR One-Time Retired Operations Snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mqr-retired-ops-snapshot.yml']
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record and byte-verify exact retired operational sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p retired-ops/.github/workflows
          for f in mqr-branch-archive.yml mqr-one-time-branch-retirement.yml mqr-retired-ops-snapshot.yml; do
            cp ".github/workflows/$f" "retired-ops/.github/workflows/$f"
          done
          cat > retired-ops/README.md <<'EOF'
          # MQR retired one-time operational workflows — 2026-10-08
          Repo: WhoSia/MQR
          Branch history Drive backup ID: 1BmwQ-HhEzzeVjx3HK-MfIDbLdU3DVRVX
          Branch archive GitHub Actions: 37723008838 (PASS)
          Archive and restore Git bundles: two pinned branches, sha256 verified.
          Branch retirement GitHub Actions: 37723287220 (PASS)
          Exact source files are preserved here to permit audit, not for re-execution.
          No GitHub Actions bot authorship or source commits permitted.
          EOF
          (cd retired-ops && sha256sum .github/workflows/*.yml > SHA256SUMS)
          mkdir -p /tmp/retired-ops-restore
          tar -czf retired-ops-source.tar.gz -C retired-ops .
          tar -xzf retired-ops-source.tar.gz -C /tmp/retired-ops-restore
          (cd /tmp/retired-ops-restore && sha256sum -c SHA256SUMS)
          echo 'MQR490_RETIRED_OPERATIONS_ARCHIVE=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: MQR490-Retired-One-Time-Operations-Verified
          path: retired-ops-source.tar.gz
          retention-days: 30
