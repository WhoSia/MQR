name: MQR 4.34 Relational Support Core

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.34/rust/**'
      - 'experiments/mqr-4.34/reference/**'
      - 'experiments/mqr-4.34/forcing-worlds*.tsv'
      - 'experiments/mqr-4.34/relation-intervention.tsv'
      - 'experiments/mqr-4.34/calibration/**'
      - '.github/workflows/mqr-4.34-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --manifest-path experiments/mqr-4.34/rust/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path experiments/mqr-4.34/rust/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path experiments/mqr-4.34/rust/Cargo.toml

      - name: Rust release build
        run: cargo build --manifest-path experiments/mqr-4.34/rust/Cargo.toml --release

      - name: C++ reference build
        run: g++ -std=c++20 -O2 -Wall -Wextra -Werror experiments/mqr-4.34/reference/mqr434.cpp -o /tmp/mqr434-cpp

      - name: Forcing-world exact classification
        shell: bash
        run: |
          set -euo pipefail
          RUST=./experiments/mqr-4.34/rust/target/release/mqr434
          "$RUST" experiments/mqr-4.34/forcing-worlds.tsv | tee /tmp/rust.out
          /tmp/mqr434-cpp experiments/mqr-4.34/forcing-worlds.tsv | tee /tmp/cpp.out
          diff -u /tmp/rust.out /tmp/cpp.out
          grep -F 'RELATION=F0' /tmp/rust.out | grep -F 'relation=R0_SAME_GENERATOR_HOLDOUT' | grep -F 'authority=A0_HOLDOUT_SUPPORT_ADMISSIBLE'
          grep -F 'RELATION=F1' /tmp/rust.out | grep -F 'relation=R1_STRICT_DOMAIN_EXTENSION' | grep -F 'authority=A1_EXTENSION_REQUIRES_FRESH_CONTACT'
          grep -F 'RELATION=F2' /tmp/rust.out | grep -F 'relation=R2_SUCCESSOR_REFINEMENT' | grep -F 'authority=A2_REFINEMENT_SUPPORT_IS_QUOTIENT_INDEXED'
          grep -F 'RELATION=F3' /tmp/rust.out | grep -F 'relation=R3_CONSTITUTIVE_COMPONENT_SHIFT' | grep -F 'authority=A3_CONSTITUTIVE_BREAK_NO_CANDIDATE'
          grep -F 'RELATION=F4' /tmp/rust.out | grep -F 'relation=R4_OVERLAP_NONNESTED' | grep -F 'authority=A4_OVERLAP_HOLD'
          grep -F 'RELATION=F5' /tmp/rust.out | grep -F 'relation=R5_UNRESOLVED' | grep -F 'authority=A5_RELATION_UNRESOLVED_HOLD'
          grep -F 'RELATION_EXPECTATION_MISMATCHES=0' /tmp/rust.out
          echo 'RUST_CPP_RELATION_CONCORDANCE=PASS'

      - name: Decoy invariance attack
        shell: bash
        run: |
          set -euo pipefail
          RUST=./experiments/mqr-4.34/rust/target/release/mqr434
          "$RUST" experiments/mqr-4.34/forcing-worlds.tsv > /tmp/base.out
          "$RUST" experiments/mqr-4.34/forcing-worlds-decoy.tsv > /tmp/decoy.out
          diff -u /tmp/base.out /tmp/decoy.out
          echo 'DECOY_RELATION_CHANGES=0'

      - name: Relation-changing intervention sensitivity
        shell: bash
        run: |
          set -euo pipefail
          RUST=./experiments/mqr-4.34/rust/target/release/mqr434
          "$RUST" experiments/mqr-4.34/relation-intervention.tsv | tee /tmp/intervention.out
          grep -F 'relation=R1_STRICT_DOMAIN_EXTENSION' /tmp/intervention.out
          grep -F 'authority=A1_EXTENSION_REQUIRES_FRESH_CONTACT' /tmp/intervention.out
          if grep -Fq 'A0_HOLDOUT_SUPPORT_ADMISSIBLE' /tmp/intervention.out; then
            echo 'intervention failed to move authority state' >&2
            exit 1
          fi
          echo 'RELATION_CHANGING_INTERVENTION=PASS'

      - name: Zero-credit inherited collision separation
        shell: bash
        run: |
          set -euo pipefail
          RUST=./experiments/mqr-4.34/rust/target/release/mqr434
          "$RUST" experiments/mqr-4.34/calibration/inherited-collision.tsv | tee /tmp/inherited-rust.out
          /tmp/mqr434-cpp experiments/mqr-4.34/calibration/inherited-collision.tsv | tee /tmp/inherited-cpp.out
          diff -u /tmp/inherited-rust.out /tmp/inherited-cpp.out
          grep -F 'RELATION=TKN-001-CAL' /tmp/inherited-rust.out | grep -F 'relation=R0_SAME_GENERATOR_HOLDOUT' | grep -F 'authority=A0_HOLDOUT_SUPPORT_ADMISSIBLE'
          grep -F 'RELATION=TOML-D1-CAL' /tmp/inherited-rust.out | grep -F 'relation=R1_STRICT_DOMAIN_EXTENSION' | grep -F 'authority=A1_EXTENSION_REQUIRES_FRESH_CONTACT'
          echo 'DIAGNOSTIC_INHERITED_SEPARATION=PASS'
          echo 'FRESH_PROMOTION_CREDIT=ZERO'

      - name: Core summary
        run: |
          echo 'MQR434_FORCING_WORLDS=PASS'
          echo 'MQR434_RUST_CPP_CONCORDANCE=PASS'
          echo 'MQR434_DECOY_INVARIANCE=PASS'
          echo 'MQR434_RELATION_INTERVENTION_SENSITIVITY=PASS'
          echo 'MQR434_EXTERNAL_PROMOTION=STRUCTURALLY_HOLD'
