name: MQR-4.57 Real-Language Regression

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.57/**'
      - 'language/real/src/strategy_v24.rs'
      - 'language/real/prolog/strategy_v24.pl'
      - 'language/real/examples/mqr-4.57-*.real'
      - 'language/real/tests/v24-invalid-*.real'
      - 'language/real/V24-STRATEGIC-ECOLOGY.md'
      - '.github/workflows/mqr-4.57-real-language.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  regression-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swi-prolog-nox

      - name: Build cumulative Real-Language bins
        run: cargo build --manifest-path language/real/Cargo.toml --release --bins

      - name: Regress v0.23 WCEPR
        shell: bash
        run: |
          set -euo pipefail
          V23=./language/real/target/release/real-v23-value
          "$V23" language/real/examples/mqr-4.56-local-admissible.real > /tmp/v23
          grep -F 'value.local_guidance=YES' /tmp/v23
          grep -F 'value.wcepr=EARNED_LOCAL_CANDIDATE' /tmp/v23
          grep -F 'value.world_optimal_policy=NOT_EARNED' /tmp/v23
          echo MQR456_WCEPR_REGRESSION_SURVIVES_V24=PASS

      - name: Integrate v0.24 ecology receipt
        shell: bash
        run: |
          set -euo pipefail
          V24=./language/real/target/release/real-v24-ecology
          P24=language/real/prolog/strategy_v24.pl
          "$V24" language/real/examples/mqr-4.57-local-admissible.real > /tmp/v24.rust
          swipl -q -s "$P24" -g "run('language/real/examples/mqr-4.57-local-admissible.real'),halt" -t "halt(1)" > /tmp/v24.prolog
          grep '^strategy\.' /tmp/v24.rust > /tmp/v24.rust.core
          grep '^strategy\.' /tmp/v24.prolog > /tmp/v24.prolog.core
          diff -u /tmp/v24.rust.core /tmp/v24.prolog.core
          grep -F 'strategy.local_strategic_robustness=YES' /tmp/v24.rust
          grep -F 'strategy.wcepr_incentive_robust_by_default=REJECT' /tmp/v24.rust
          grep -F 'strategy.equilibrium_implies_epistemic_adequacy=REJECT' /tmp/v24.rust
          grep -F 'strategy.universal_scientific_mechanism=NOT_EARNED' /tmp/v24.rust
          grep -F 'strategy.wcser=EARNED_LOCAL_CANDIDATE' /tmp/v24.rust

          python experiments/mqr-4.57/strategic_ecology_court.py > /tmp/mqr457
          grep -F 'mqr457.wcser=CANDIDATE' /tmp/mqr457
          grep -F 'mqr457.wcepr_incentive_robust_by_default=REJECT' /tmp/mqr457
          echo MQR457_REAL_LANGUAGE_REGRESSION_INTEGRATION=PASS

      - name: Publish receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.57/Real-Language" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
