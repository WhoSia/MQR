name: MQR-4.59 Real-Language Regression

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.59/**'
      - 'language/real/src/promote_v26.rs'
      - 'language/real/prolog/promote_v26.pl'
      - 'language/real/examples/mqr-4.59-*.real'
      - 'language/real/V26-PROMOTION.md'
      - '.github/workflows/mqr-4.59-real-language.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  regression-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Prolog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swi-prolog-nox
      - name: Build cumulative bins
        run: cargo build --manifest-path language/real/Cargo.toml --release --bins
      - name: Regress v0.25
        shell: bash
        run: |
          set -euo pipefail
          V25=./language/real/target/release/real-v25-reflex
          "$V25" language/real/examples/mqr-4.58-local-admissible.real > /tmp/v25
          grep -F 'reflex.local_reflexive_robustness=YES' /tmp/v25
          grep -F 'reflex.rcsr=EARNED_LOCAL_CANDIDATE' /tmp/v25
          echo MQR458_REGRESSION_SURVIVES_V26=PASS
      - name: Integrate v0.26
        shell: bash
        run: |
          set -euo pipefail
          V26=./language/real/target/release/real-v26-promote
          P26=language/real/prolog/promote_v26.pl
          for f in language/real/examples/mqr-4.59-*.real; do
            "$V26" "$f" > /tmp/r
            swipl -q -s "$P26" -g "run('$f'),halt" -t "halt(1)" > /tmp/p
            diff -u /tmp/r /tmp/p
          done
          "$V26" language/real/examples/mqr-4.59-material.real | grep -F 'promote.decision=PROMOTE'
          "$V26" language/real/examples/mqr-4.59-formal.real | grep -F 'promote.decision=COMPRESS'
          "$V26" language/real/examples/mqr-4.59-archive.real | grep -F 'promote.decision=ARCHIVE'
          "$V26" language/real/examples/mqr-4.59-option.real | grep -F 'promote.decision=PROMOTE'
          "$V26" language/real/examples/mqr-4.59-audit-hold.real | grep -F 'promote.decision=HOLD'
          echo MQR459_REAL_LANGUAGE_INTEGRATION=PASS
      - name: Publish receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -f state="$state" -f context="MQR-4.59/Real-Language"             -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}"             -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
