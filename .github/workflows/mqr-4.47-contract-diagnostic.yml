name: MQR-4.47 v0.14 Contract Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mqr-4.47-contract-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Prolog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swi-prolog-nox

      - name: Parse clean fixture only
        shell: bash
        run: |
          swipl -q -s language/real/prolog/challenge_v14.pl -g "
            reset_db,
            read_file_to_string('language/real/examples/mqr-4.47-clean-narrowing.real',S,[]),
            split_string(S,'\n','\r',Ls),
            maplist(parse_line,Ls),
            writeln(PARSE_OK),
            halt" -t "halt(1)"

      - name: Required facts clean fixture
        shell: bash
        run: |
          swipl -q -s language/real/prolog/challenge_v14.pl -g "
            reset_db,
            read_file_to_string('language/real/examples/mqr-4.47-clean-narrowing.real',S,[]),
            split_string(S,'\n','\r',Ls),
            maplist(parse_line,Ls),
            seen_header,seen_end,packet_id(_),claim_scope(_),candidate_relations(_),selector(_,_),
            selection_timing(_),selection_rule(_,_,_),route(_),probe(_,_,_,_,_),
            writeln(REQUIRED_OK),
            halt" -t "halt(1)"

      - name: Coverage probe references
        shell: bash
        run: |
          swipl -q -s language/real/prolog/challenge_v14.pl -g "
            reset_db,read_file_to_string('language/real/examples/mqr-4.47-clean-narrowing.real',S,[]),
            split_string(S,'\n','\r',Ls),maplist(parse_line,Ls),
            \+(covers(P,_),\+probe(P,_,_,_,_)),writeln(COVER_PROBE_OK),halt" -t "halt(1)"

      - name: Coverage route references
        if: always()
        shell: bash
        run: |
          swipl -q -s language/real/prolog/challenge_v14.pl -g "
            reset_db,read_file_to_string('language/real/examples/mqr-4.47-clean-narrowing.real',S,[]),
            split_string(S,'\n','\r',Ls),maplist(parse_line,Ls),
            \+(covers(_,R),\+route(R)),writeln(COVER_ROUTE_OK),halt" -t "halt(1)"

      - name: Score references
        if: always()
        shell: bash
        run: |
          swipl -q -s language/real/prolog/challenge_v14.pl -g "
            reset_db,read_file_to_string('language/real/examples/mqr-4.47-clean-narrowing.real',S,[]),
            split_string(S,'\n','\r',Ls),maplist(parse_line,Ls),
            \+(probe(P,_,_,_,_),\+score_source(P,_)),writeln(SCORE_OK),halt" -t "halt(1)"

      - name: Relevance references
        if: always()
        shell: bash
        run: |
          swipl -q -s language/real/prolog/challenge_v14.pl -g "
            reset_db,read_file_to_string('language/real/examples/mqr-4.47-clean-narrowing.real',S,[]),
            split_string(S,'\n','\r',Ls),maplist(parse_line,Ls),
            \+(probe(P,_,_,_,_),\+relevance_source(P,_)),writeln(RELEVANCE_OK),halt" -t "halt(1)"

      - name: load_packet clean fixture
        run: |
          swipl -q -s language/real/prolog/challenge_v14.pl -g "
            load_packet('language/real/examples/mqr-4.47-clean-narrowing.real'),
            writeln(LOAD_PACKET_OK),
            halt" -t "halt(1)"

      - name: Computation clean fixture
        if: always()
        run: |
          swipl -q -s language/real/prolog/challenge_v14.pl -g "
            load_packet('language/real/examples/mqr-4.47-clean-narrowing.real'),
            candidate_relations(B),after_set(A),
            format('BEFORE=~w AFTER=~w~n',[B,A]),
            halt" -t "halt(1)"

      - name: Full run clean fixture
        if: always()
        run: |
          swipl -q -s language/real/prolog/challenge_v14.pl -g "
            run('language/real/examples/mqr-4.47-clean-narrowing.real'),
            halt" -t "halt(1)"
