name: MQR 4.23 Missing Key Counterfactual
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mqr-4.23-missing-key.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  necessity:
    runs-on: ubuntu-latest
    steps:
      - name: Execute frozen authority counterfactual
        run: |
          python - <<'PY'
          def promote(C,E,P,K):
              return bool(C and E and P)

          worlds = {
            "K_plus":  dict(C=True,E=True,P=True,K=True),
            "K_minus": dict(C=True,E=True,P=True,K=False),
            "C_fail_K_plus": dict(C=False,E=True,P=True,K=True),
            "E_fail_K_plus": dict(C=True,E=False,P=True,K=True),
            "P_fail_K_plus": dict(C=True,E=True,P=False,K=True),
            "C_fail_K_minus": dict(C=False,E=True,P=True,K=False),
            "E_fail_K_minus": dict(C=True,E=False,P=True,K=False),
            "P_fail_K_minus": dict(C=True,E=True,P=False,K=False),
          }

          results={k:promote(**v) for k,v in worlds.items()}
          for k,v in results.items():
              print(f"{k}={'PROMOTE' if v else 'HOLD'}")

          tests = {
            "missing_key_counterfactual_invariant":
              results["K_plus"] == results["K_minus"] == True,
            "author_key_cannot_rescue_constitution":
              results["C_fail_K_plus"] is False,
            "author_key_cannot_rescue_execution":
              results["E_fail_K_plus"] is False,
            "author_key_cannot_rescue_provenance":
              results["P_fail_K_plus"] is False,
            "missing_key_does_not_create_false_promotion":
              not results["C_fail_K_minus"] and not results["E_fail_K_minus"] and not results["P_fail_K_minus"],
          }

          for k,v in tests.items():
              print(f"{k}={'PASS' if v else 'FAIL'}")
          if not all(tests.values()):
              raise SystemExit(1)

          print("SCIENTIFIC_AUTHORITY_DELTA_K_PLUS_MINUS_K_MINUS=0")
          print("ATTRIBUTION_CONTINUITY_DELTA=1")
          print("MISSING_KEY_COUNTERFACTUAL=PASS")
          PY
