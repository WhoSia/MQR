name: MQR-4.56 Lean Regression Integration

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.56/FINAL-SEAL.md'
      - 'language/real/lean/MQR/ExpansionPolicy.lean'
      - 'language/real/V23-EXPANSION-POLICY.md'
      - '.github/workflows/mqr-4.56-lean-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  lean-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cumulative Lean package
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false

      - name: Regress v0.22 and compile v0.23 boundary
        shell: bash
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/ConsequenceFamily.lean | tee /tmp/v22.log
          lake env lean MQR/ExpansionPolicy.lean | tee /tmp/v23.log
          if grep -F 'sorryAx' /tmp/v22.log; then exit 1; fi
          if grep -F 'sorryAx' /tmp/v23.log; then exit 1; fi
          grep -F "'MQR.openFamilyCanEarnLocalAdequacyWithoutCompleteness' does not depend on any axioms" /tmp/v22.log
          grep -F "'MQR.localGuidanceDoesNotImplyUniversalScientificUtility' does not depend on any axioms" /tmp/v23.log
          grep -F "'MQR.localGuidanceDoesNotImplyWorldOptimalExpansionPolicy' does not depend on any axioms" /tmp/v23.log
          echo MQR456_LEAN_REGRESSION_INTEGRATION=PASS

      - name: Publish externally readable workflow receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.56/Lean-Integration" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
