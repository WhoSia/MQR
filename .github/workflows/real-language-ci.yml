name: Real-Language CI

on:
  push:
    branches: [main]
    paths:
      - 'language/real/**'
      - '.github/workflows/real-language-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build canonical Rust compilers
        run: cargo build --manifest-path language/real/Cargo.toml --release --bins

      - name: Real-Packet v0.2/v0.3 Rust Python concordance
        shell: bash
        run: |
          set -euo pipefail
          for f in language/real/examples/*.real; do
            if grep -q '^REALPACKET 0.4
            ./language/real/target/release/real "$f" > /tmp/rust.out
            python language/real/reference.py "$f" > /tmp/python.out
            diff -u /tmp/python.out /tmp/rust.out
            ./language/real/target/release/real --diagnostic-scalar "$f" > /tmp/rust.scalar
            python language/real/reference.py --diagnostic-scalar "$f" > /tmp/python.scalar
            diff -u /tmp/python.scalar /tmp/rust.scalar
          done
          echo REAL_LANGUAGE_PACKET_CONCORDANCE=PASS

      - name: Real-Packet v0.3 typed-transport guards
        shell: bash
        run: |
          set -euo pipefail
          EX=language/real/examples/mqr-4.31-hwpx-transport.real
          ./language/real/target/release/real "$EX" > /tmp/v03.out
          grep -F 'lineage.kind=ENGINEERING_DEVELOPMENT' /tmp/v03.out
          grep -F 'legacy.profile.T=DEPRECATED' /tmp/v03.out
          grep -F 'transport.mode=TYPED_RELATION_MAP' /tmp/v03.out
          grep -F 'transport.claim_state=PARTIAL_WITH_HOLDS' /tmp/v03.out
          ./language/real/target/release/real --diagnostic-scalar "$EX" > /tmp/v03.scalar
          grep -F 'display.scalar.status=UNAVAILABLE_V0_3_TYPED_TRANSPORT' /tmp/v03.scalar
          if ./language/real/target/release/real language/real/tests/v03-invalid-legacy-t.real; then
            echo 'Rust unexpectedly accepted legacy T in v0.3' >&2
            exit 1
          fi
          if python language/real/reference.py language/real/tests/v03-invalid-legacy-t.real; then
            echo 'Python unexpectedly accepted legacy T in v0.3' >&2
            exit 1
          fi
          echo REAL_LANGUAGE_V03_TYPED_TRANSPORT_GUARDS=PASS

      - name: Calibration scorer persistent smoke
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          head="lane\tid\tw_success\tw_total\tw_repeat_decoy\tn_lineages\tn_replicate_decoy\ti_invariant\ti_total\ti_rival_count_decoy\tt_success\tt_total\tt_train_decoy\td_covered\td_total\td_challenge_decoy"
          row="exact\tsmoke\t2\t4\t99\t2\t88\t2\t4\t77\t2\t4\t66\t2\t4\t55"
          Path("/tmp/cal.tsv").write_text(head+"\n"+row+"\n",encoding="utf-8")
          PY
          ./language/real/target/release/real-calibrate /tmp/cal.tsv > /tmp/rust.cal
          python language/real/calibration_reference.py /tmp/cal.tsv > /tmp/python.cal
          diff -u /tmp/python.cal /tmp/rust.cal
          grep -F $'smoke\t0.500000\t0.500000\t0.500000\t0.500000\t0.500000' /tmp/rust.cal
          echo REAL_LANGUAGE_CALIBRATION_SCORER_SMOKE=PASS

      - name: Real-Packet v0.4 formal-empirical boundary guards
        shell: bash
        run: |
          set -euo pipefail
          V04=./language/real/target/release/real-v04
          POS=language/real/examples/mqr-4.36-proof-boundary.real
          NEG=language/real/tests/v04-invalid-axiom-laundering.real
          "$V04" "$POS" > /tmp/v04.out
          grep -F 'proof.world_laundering_guard=PASS' /tmp/v04.out
          grep -F 'formal_validity_is_not_empirical_truth=true' /tmp/v04.out
          grep -F 'empirical_entitlement_ceiling=HOLD' /tmp/v04.out
          grep -F 'authorized=HOLD' /tmp/v04.out
          grep -F 'internal_residue=ZERO_INTERNAL' /tmp/v04.out
          grep -F 'open_world_residue=true' /tmp/v04.out
          if "$V04" "$NEG"; then
            echo 'v0.4 unexpectedly allowed empirical HOLD to be promoted by formal CHECKED proof' >&2
            exit 1
          fi
          echo REAL_LANGUAGE_V04_AXIOM_LAUNDERING_GUARD=PASS
          echo REAL_LANGUAGE_V04_INTERNAL_VS_OPEN_WORLD_RESIDUE=PASS
 "$f" || grep -q '^REALTRANSFER 0.5
            ./language/real/target/release/real "$f" > /tmp/rust.out
            python language/real/reference.py "$f" > /tmp/python.out
            diff -u /tmp/python.out /tmp/rust.out
            ./language/real/target/release/real --diagnostic-scalar "$f" > /tmp/rust.scalar
            python language/real/reference.py --diagnostic-scalar "$f" > /tmp/python.scalar
            diff -u /tmp/python.scalar /tmp/rust.scalar
          done
          echo REAL_LANGUAGE_PACKET_CONCORDANCE=PASS

      - name: Real-Packet v0.3 typed-transport guards
        shell: bash
        run: |
          set -euo pipefail
          EX=language/real/examples/mqr-4.31-hwpx-transport.real
          ./language/real/target/release/real "$EX" > /tmp/v03.out
          grep -F 'lineage.kind=ENGINEERING_DEVELOPMENT' /tmp/v03.out
          grep -F 'legacy.profile.T=DEPRECATED' /tmp/v03.out
          grep -F 'transport.mode=TYPED_RELATION_MAP' /tmp/v03.out
          grep -F 'transport.claim_state=PARTIAL_WITH_HOLDS' /tmp/v03.out
          ./language/real/target/release/real --diagnostic-scalar "$EX" > /tmp/v03.scalar
          grep -F 'display.scalar.status=UNAVAILABLE_V0_3_TYPED_TRANSPORT' /tmp/v03.scalar
          if ./language/real/target/release/real language/real/tests/v03-invalid-legacy-t.real; then
            echo 'Rust unexpectedly accepted legacy T in v0.3' >&2
            exit 1
          fi
          if python language/real/reference.py language/real/tests/v03-invalid-legacy-t.real; then
            echo 'Python unexpectedly accepted legacy T in v0.3' >&2
            exit 1
          fi
          echo REAL_LANGUAGE_V03_TYPED_TRANSPORT_GUARDS=PASS

      - name: Calibration scorer persistent smoke
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          head="lane\tid\tw_success\tw_total\tw_repeat_decoy\tn_lineages\tn_replicate_decoy\ti_invariant\ti_total\ti_rival_count_decoy\tt_success\tt_total\tt_train_decoy\td_covered\td_total\td_challenge_decoy"
          row="exact\tsmoke\t2\t4\t99\t2\t88\t2\t4\t77\t2\t4\t66\t2\t4\t55"
          Path("/tmp/cal.tsv").write_text(head+"\n"+row+"\n",encoding="utf-8")
          PY
          ./language/real/target/release/real-calibrate /tmp/cal.tsv > /tmp/rust.cal
          python language/real/calibration_reference.py /tmp/cal.tsv > /tmp/python.cal
          diff -u /tmp/python.cal /tmp/rust.cal
          grep -F $'smoke\t0.500000\t0.500000\t0.500000\t0.500000\t0.500000' /tmp/rust.cal
          echo REAL_LANGUAGE_CALIBRATION_SCORER_SMOKE=PASS

      - name: Real-Packet v0.4 formal-empirical boundary guards
        shell: bash
        run: |
          set -euo pipefail
          V04=./language/real/target/release/real-v04
          POS=language/real/examples/mqr-4.36-proof-boundary.real
          NEG=language/real/tests/v04-invalid-axiom-laundering.real
          "$V04" "$POS" > /tmp/v04.out
          grep -F 'proof.world_laundering_guard=PASS' /tmp/v04.out
          grep -F 'formal_validity_is_not_empirical_truth=true' /tmp/v04.out
          grep -F 'empirical_entitlement_ceiling=HOLD' /tmp/v04.out
          grep -F 'authorized=HOLD' /tmp/v04.out
          grep -F 'internal_residue=ZERO_INTERNAL' /tmp/v04.out
          grep -F 'open_world_residue=true' /tmp/v04.out
          if "$V04" "$NEG"; then
            echo 'v0.4 unexpectedly allowed empirical HOLD to be promoted by formal CHECKED proof' >&2
            exit 1
          fi
          echo REAL_LANGUAGE_V04_AXIOM_LAUNDERING_GUARD=PASS
          echo REAL_LANGUAGE_V04_INTERNAL_VS_OPEN_WORLD_RESIDUE=PASS
 "$f"; then
              continue
            fi
            ./language/real/target/release/real "$f" > /tmp/rust.out
            python language/real/reference.py "$f" > /tmp/python.out
            diff -u /tmp/python.out /tmp/rust.out
            ./language/real/target/release/real --diagnostic-scalar "$f" > /tmp/rust.scalar
            python language/real/reference.py --diagnostic-scalar "$f" > /tmp/python.scalar
            diff -u /tmp/python.scalar /tmp/rust.scalar
          done
          echo REAL_LANGUAGE_PACKET_CONCORDANCE=PASS

      - name: Real-Packet v0.3 typed-transport guards
        shell: bash
        run: |
          set -euo pipefail
          EX=language/real/examples/mqr-4.31-hwpx-transport.real
          ./language/real/target/release/real "$EX" > /tmp/v03.out
          grep -F 'lineage.kind=ENGINEERING_DEVELOPMENT' /tmp/v03.out
          grep -F 'legacy.profile.T=DEPRECATED' /tmp/v03.out
          grep -F 'transport.mode=TYPED_RELATION_MAP' /tmp/v03.out
          grep -F 'transport.claim_state=PARTIAL_WITH_HOLDS' /tmp/v03.out
          ./language/real/target/release/real --diagnostic-scalar "$EX" > /tmp/v03.scalar
          grep -F 'display.scalar.status=UNAVAILABLE_V0_3_TYPED_TRANSPORT' /tmp/v03.scalar
          if ./language/real/target/release/real language/real/tests/v03-invalid-legacy-t.real; then
            echo 'Rust unexpectedly accepted legacy T in v0.3' >&2
            exit 1
          fi
          if python language/real/reference.py language/real/tests/v03-invalid-legacy-t.real; then
            echo 'Python unexpectedly accepted legacy T in v0.3' >&2
            exit 1
          fi
          echo REAL_LANGUAGE_V03_TYPED_TRANSPORT_GUARDS=PASS

      - name: Calibration scorer persistent smoke
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          head="lane\tid\tw_success\tw_total\tw_repeat_decoy\tn_lineages\tn_replicate_decoy\ti_invariant\ti_total\ti_rival_count_decoy\tt_success\tt_total\tt_train_decoy\td_covered\td_total\td_challenge_decoy"
          row="exact\tsmoke\t2\t4\t99\t2\t88\t2\t4\t77\t2\t4\t66\t2\t4\t55"
          Path("/tmp/cal.tsv").write_text(head+"\n"+row+"\n",encoding="utf-8")
          PY
          ./language/real/target/release/real-calibrate /tmp/cal.tsv > /tmp/rust.cal
          python language/real/calibration_reference.py /tmp/cal.tsv > /tmp/python.cal
          diff -u /tmp/python.cal /tmp/rust.cal
          grep -F $'smoke\t0.500000\t0.500000\t0.500000\t0.500000\t0.500000' /tmp/rust.cal
          echo REAL_LANGUAGE_CALIBRATION_SCORER_SMOKE=PASS

      - name: Real-Packet v0.4 formal-empirical boundary guards
        shell: bash
        run: |
          set -euo pipefail
          V04=./language/real/target/release/real-v04
          POS=language/real/examples/mqr-4.36-proof-boundary.real
          NEG=language/real/tests/v04-invalid-axiom-laundering.real
          "$V04" "$POS" > /tmp/v04.out
          grep -F 'proof.world_laundering_guard=PASS' /tmp/v04.out
          grep -F 'formal_validity_is_not_empirical_truth=true' /tmp/v04.out
          grep -F 'empirical_entitlement_ceiling=HOLD' /tmp/v04.out
          grep -F 'authorized=HOLD' /tmp/v04.out
          grep -F 'internal_residue=ZERO_INTERNAL' /tmp/v04.out
          grep -F 'open_world_residue=true' /tmp/v04.out
          if "$V04" "$NEG"; then
            echo 'v0.4 unexpectedly allowed empirical HOLD to be promoted by formal CHECKED proof' >&2
            exit 1
          fi
          echo REAL_LANGUAGE_V04_AXIOM_LAUNDERING_GUARD=PASS
          echo REAL_LANGUAGE_V04_INTERNAL_VS_OPEN_WORLD_RESIDUE=PASS


      - name: Real-Language v0.5 transfer-contract guards and Haskell independent evaluator
        shell: bash
        run: |
          set -euo pipefail
          V05=./language/real/target/release/real-v05-transfer
          POS=language/real/examples/mqr-4.38-transfer-positive.real
          NONFORMAL=language/real/examples/mqr-4.38-nonformal-world-authority.real

          "$V05" "$POS" > /tmp/v05.rust
          grep '^coordinate\.' /tmp/v05.rust > /tmp/v05.rust.coords
          grep -F 'coordinate.semantic=PASS' /tmp/v05.rust
          grep -F 'coordinate.scope=PASS' /tmp/v05.rust
          grep -F 'coordinate.ancestry=PASS' /tmp/v05.rust
          grep -F 'coordinate.defeat=PASS' /tmp/v05.rust
          grep -F 'coordinate.noncircular=PASS' /tmp/v05.rust
          grep -F 'coordinate.formal_custody=PASS' /tmp/v05.rust
          grep -F 'coordinate.transfer=PASS' /tmp/v05.rust
          grep -F 'cross_language_agreement_is_not_world_correspondence=true' /tmp/v05.rust

          "$V05" "$NONFORMAL" > /tmp/v05.nonformal
          grep -F 'world_authority=PASS' /tmp/v05.nonformal
          grep -F 'coordinate.formal_custody=NOT_APPLICABLE' /tmp/v05.nonformal
          grep -F 'coordinate.transfer=NOT_APPLICABLE' /tmp/v05.nonformal

          sudo apt-get update -qq
          sudo apt-get install -y -qq ghc
          runghc language/real/haskell/TransferV05.hs "$POS" > /tmp/v05.haskell
          grep '^coordinate\.' /tmp/v05.haskell > /tmp/v05.haskell.coords
          diff -u /tmp/v05.rust.coords /tmp/v05.haskell.coords
          grep -F 'implementation_diversity_is_not_semantic_independence=true' /tmp/v05.haskell

          runghc language/real/haskell/TransferV05.hs "$NONFORMAL" > /tmp/v05.haskell.nonformal
          grep -F 'coordinate.transfer=NOT_APPLICABLE' /tmp/v05.haskell.nonformal

          runghc language/real/haskell/TransferV05.hs --minimality > /tmp/v05.minimality
          grep -F 'MINIMUM_BLOCKING_COORDINATES=6' /tmp/v05.minimality
          grep -F 'MINIMALITY_SCOPE=FROZEN_ATTACK_FAMILY_ONLY' /tmp/v05.minimality

          for f in             language/real/tests/v05-invalid-self-certified-bridge.real             language/real/tests/v05-invalid-scope-promotion.real             language/real/tests/v05-invalid-ancestry-loss.real             language/real/tests/v05-invalid-defeat-mirage.real             language/real/tests/v05-invalid-world-authority-laundering.real
          do
            if "$V05" "$f"; then
              echo "Rust unexpectedly accepted invalid v0.5 transfer fixture: $f" >&2
              exit 1
            fi
            if runghc language/real/haskell/TransferV05.hs "$f"; then
              echo "Haskell unexpectedly accepted invalid v0.5 transfer fixture: $f" >&2
              exit 1
            fi
          done

          echo REAL_LANGUAGE_V05_TRANSFER_GUARDS=PASS
          echo REAL_LANGUAGE_V05_RUST_HASKELL_CONCORDANCE=PASS
          echo REAL_LANGUAGE_V05_FORMALIZATION_OPTIONALITY=PASS
          echo IMPLEMENTATION_DIVERSITY_NOT_SEMANTIC_INDEPENDENCE=TRUE
