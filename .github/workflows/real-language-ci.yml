name: Real-Language CI

on:
  push:
    branches: [main]
    paths:
      - 'language/real/**'
      - '.github/workflows/real-language-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build canonical Rust compilers
        run: cargo build --manifest-path language/real/Cargo.toml --release --bins

      - name: Real-Packet v0.2/v0.3 Rust Python concordance
        shell: bash
        run: |
          set -euo pipefail
          for f in language/real/examples/*.real; do
            if grep -q '^REALPACKET 0.4$' "$f" || grep -q '^REALTRANSFER 0.5$' "$f" || grep -q '^REALCOMPOSE 0.6$' "$f"; then
              continue
            fi
            ./language/real/target/release/real "$f" > /tmp/rust.out
            python language/real/reference.py "$f" > /tmp/python.out
            diff -u /tmp/python.out /tmp/rust.out
          done
          echo REAL_LANGUAGE_PACKET_CONCORDANCE=PASS

      - name: Real-Packet v0.3 typed-transport guards
        shell: bash
        run: |
          set -euo pipefail
          EX=language/real/examples/mqr-4.31-hwpx-transport.real
          ./language/real/target/release/real "$EX" > /tmp/v03.out
          grep -F 'transport.mode=TYPED_RELATION_MAP' /tmp/v03.out
          if ./language/real/target/release/real language/real/tests/v03-invalid-legacy-t.real; then exit 1; fi
          if python language/real/reference.py language/real/tests/v03-invalid-legacy-t.real; then exit 1; fi
          echo REAL_LANGUAGE_V03_TYPED_TRANSPORT_GUARDS=PASS

      - name: Calibration scorer persistent smoke
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          head="lane\tid\tw_success\tw_total\tw_repeat_decoy\tn_lineages\tn_replicate_decoy\ti_invariant\ti_total\ti_rival_count_decoy\tt_success\tt_total\tt_train_decoy\td_covered\td_total\td_challenge_decoy"
          row="exact\tsmoke\t2\t4\t99\t2\t88\t2\t4\t77\t2\t4\t66\t2\t4\t55"
          Path("/tmp/cal.tsv").write_text(head+"\n"+row+"\n",encoding="utf-8")
          PY
          ./language/real/target/release/real-calibrate /tmp/cal.tsv > /tmp/rust.cal
          python language/real/calibration_reference.py /tmp/cal.tsv > /tmp/python.cal
          diff -u /tmp/python.cal /tmp/rust.cal
          echo REAL_LANGUAGE_CALIBRATION_SCORER_SMOKE=PASS

      - name: Real-Packet v0.4 formal-empirical boundary guards
        shell: bash
        run: |
          set -euo pipefail
          V04=./language/real/target/release/real-v04
          "$V04" language/real/examples/mqr-4.36-proof-boundary.real > /tmp/v04.out
          grep -F 'proof.world_laundering_guard=PASS' /tmp/v04.out
          grep -F 'internal_residue=ZERO_INTERNAL' /tmp/v04.out
          if "$V04" language/real/tests/v04-invalid-axiom-laundering.real; then exit 1; fi
          echo REAL_LANGUAGE_V04_AXIOM_LAUNDERING_GUARD=PASS

      - name: Real-Language v0.5 transfer guards
        shell: bash
        run: |
          set -euo pipefail
          V05=./language/real/target/release/real-v05-transfer
          POS=language/real/examples/mqr-4.38-transfer-positive.real
          HOLDCASE=language/real/examples/mqr-4.38-transfer-hold.real
          NONFORMAL=language/real/examples/mqr-4.38-nonformal-world-authority.real

          "$V05" "$POS" > /tmp/v05.rust
          grep '^coordinate\.' /tmp/v05.rust > /tmp/v05.rust.coords
          grep -F 'coordinate.transfer=PASS' /tmp/v05.rust

          "$V05" "$HOLDCASE" > /tmp/v05.hold
          grep -F 'coordinate.transfer=HOLD' /tmp/v05.hold

          "$V05" "$NONFORMAL" > /tmp/v05.nonformal
          grep -F 'coordinate.transfer=NOT_APPLICABLE' /tmp/v05.nonformal

          sudo apt-get update -qq
          sudo apt-get install -y -qq ghc

          runghc language/real/haskell/TransferV05.hs "$POS" > /tmp/v05.haskell
          grep '^coordinate\.' /tmp/v05.haskell > /tmp/v05.haskell.coords
          diff -u /tmp/v05.rust.coords /tmp/v05.haskell.coords

          for f in \
            language/real/tests/v05-invalid-self-certified-bridge.real \
            language/real/tests/v05-invalid-scope-promotion.real \
            language/real/tests/v05-invalid-ancestry-loss.real \
            language/real/tests/v05-invalid-defeat-mirage.real \
            language/real/tests/v05-invalid-world-authority-laundering.real
          do
            if "$V05" "$f"; then exit 1; fi
            if runghc language/real/haskell/TransferV05.hs "$f"; then exit 1; fi
          done
          echo REAL_LANGUAGE_V05_TRANSFER_GUARDS=PASS
          echo REAL_LANGUAGE_V05_RUST_HASKELL_CONCORDANCE=PASS

      - name: Real-Language v0.6 composition guards
        shell: bash
        run: |
          set -euo pipefail
          V06=./language/real/target/release/real-v06-compose
          POS=language/real/examples/mqr-4.39-compose-positive.real
          HOLDCASE=language/real/examples/mqr-4.39-compose-direct-hold.real

          "$V06" "$POS" > /tmp/v06.rust
          grep '^coordinate\.' /tmp/v06.rust > /tmp/v06.rust.coords
          grep -F 'coordinate.local=PASS' /tmp/v06.rust
          grep -F 'coordinate.semantic=PASS' /tmp/v06.rust
          grep -F 'coordinate.scope=PASS' /tmp/v06.rust
          grep -F 'coordinate.ancestry=PASS' /tmp/v06.rust
          grep -F 'coordinate.defeat=PASS' /tmp/v06.rust
          grep -F 'coordinate.assumption=PASS' /tmp/v06.rust
          grep -F 'coordinate.global_nonamplification=PASS' /tmp/v06.rust
          grep -F 'coordinate.direct=PASS' /tmp/v06.rust
          grep -F 'coordinate.composition=PASS' /tmp/v06.rust

          "$V06" "$HOLDCASE" > /tmp/v06.hold
          grep -F 'coordinate.local=PASS' /tmp/v06.hold
          grep -F 'coordinate.direct=HOLD' /tmp/v06.hold
          grep -F 'coordinate.composition=HOLD' /tmp/v06.hold

          runghc language/real/haskell/ComposeV06.hs "$POS" > /tmp/v06.haskell
          grep '^coordinate\.' /tmp/v06.haskell > /tmp/v06.haskell.coords
          diff -u /tmp/v06.rust.coords /tmp/v06.haskell.coords

          runghc language/real/haskell/ComposeV06.hs "$HOLDCASE" > /tmp/v06.haskell.hold
          grep -F 'coordinate.composition=HOLD' /tmp/v06.haskell.hold

          for f in \
            language/real/tests/v06-invalid-semantic-composition.real \
            language/real/tests/v06-invalid-scope-union.real \
            language/real/tests/v06-invalid-ancestry-reset.real \
            language/real/tests/v06-invalid-defeat-disconnect.real \
            language/real/tests/v06-invalid-assumption-conflict.real \
            language/real/tests/v06-invalid-baseline-reset.real \
            language/real/tests/v06-invalid-adjacent-pass-direct-fail.real
          do
            if "$V06" "$f"; then
              echo "Rust unexpectedly accepted invalid v0.6 fixture: $f" >&2
              exit 1
            fi
            if runghc language/real/haskell/ComposeV06.hs "$f"; then
              echo "Haskell unexpectedly accepted invalid v0.6 fixture: $f" >&2
              exit 1
            fi
          done

          echo REAL_LANGUAGE_V06_COMPOSITION_GUARDS=PASS
          echo REAL_LANGUAGE_V06_RUST_HASKELL_CONCORDANCE=PASS
          echo MQR439_LOCAL_PASS_NOT_COMPOSITE_PASS=PASS
          echo MQR439_PATHWISE_NONAMPLIFICATION=PASS
          echo MQR439_ADJACENT_PASS_NOT_DIRECT_PASS=PASS
          echo ALGEBRAIC_COMPOSABILITY_IS_NOT_EPISTEMIC_COMPOSABILITY=TRUE
