name: MQR 4.34 REGEX Fresh Relation

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.34/external/regex/**'
      - 'experiments/mqr-4.34/fresh-relations.tsv'
      - '.github/workflows/mqr-4.34-regex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - regime: A
            version: '1.10.6'
          - regime: B
            version: '1.11.3'
          - regime: C
            version: '1.12.4'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Materialize exact dependency
        shell: bash
        run: |
          set -euo pipefail
          sed 's/__REGEX_VERSION__/${{ matrix.version }}/g' experiments/mqr-4.34/external/regex/Cargo.template.toml > experiments/mqr-4.34/external/regex/Cargo.toml
      - name: Format gate
        run: cargo fmt --manifest-path experiments/mqr-4.34/external/regex/Cargo.toml -- --check
      - name: Generate lockfile
        run: cargo generate-lockfile --manifest-path experiments/mqr-4.34/external/regex/Cargo.toml
      - name: Locked build
        run: cargo build --locked --manifest-path experiments/mqr-4.34/external/regex/Cargo.toml
      - name: Execute bridge only
        shell: bash
        run: |
          set -euo pipefail
          BIN=experiments/mqr-4.34/external/regex/target/debug/mqr434-regex-probe
          "$BIN" bridge > "regex-bridge-${{ matrix.regime }}.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: regex-bridge-${{ matrix.regime }}
          path: regex-bridge-${{ matrix.regime }}.tsv
          retention-days: 30

  bridge_adjudicate:
    needs: bridge
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.adj.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: regex-bridge-*
          path: results
          merge-multiple: true
      - id: adj
        name: Seal adjacent result before direct execution
        shell: bash
        run: |
          set -euo pipefail
          AB=TRANSPORT_FAIL
          BC=TRANSPORT_FAIL
          if cmp -s results/regex-bridge-A.tsv results/regex-bridge-B.tsv; then AB=TRANSPORT_PASS; fi
          if cmp -s results/regex-bridge-B.tsv results/regex-bridge-C.tsv; then BC=TRANSPORT_PASS; fi
          CANDIDATE=no
          if [[ "$AB" == TRANSPORT_PASS && "$BC" == TRANSPORT_PASS ]]; then CANDIDATE=yes; fi
          grep -F $'REGEX-001\tENGINEERING_DEVELOPMENT\tBRIDGE_SUBSET_DIRECT' experiments/mqr-4.34/fresh-relations.tsv
          echo "A_TO_B=$AB"
          echo "B_TO_C=$BC"
          echo 'RELATION=R1_STRICT_DOMAIN_EXTENSION'
          echo 'AUTHORITY=A1_EXTENSION_REQUIRES_FRESH_CONTACT'
          echo 'MEDIATED_DIRECT_PREDICTION=NOT_LICENSED'
          echo 'DIRECT_BURDEN=FRESH_CONTACT_REQUIRED'
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          {
            echo "A_TO_B=$AB"
            echo "B_TO_C=$BC"
            echo 'RELATION=R1_STRICT_DOMAIN_EXTENSION'
            echo 'AUTHORITY=A1_EXTENSION_REQUIRES_FRESH_CONTACT'
            echo 'MEDIATED_DIRECT_PREDICTION=NOT_LICENSED'
            echo "CANDIDATE=$CANDIDATE"
          } > regex-bridge-seal.txt
      - uses: actions/upload-artifact@v4
        with:
          name: regex-bridge-seal
          path: regex-bridge-seal.txt
          retention-days: 30

  direct:
    needs: bridge_adjudicate
    if: needs.bridge_adjudicate.outputs.candidate == 'yes'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - regime: A
            version: '1.10.6'
          - regime: C
            version: '1.12.4'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: Materialize exact dependency
        shell: bash
        run: |
          sed 's/__REGEX_VERSION__/${{ matrix.version }}/g' experiments/mqr-4.34/external/regex/Cargo.template.toml > experiments/mqr-4.34/external/regex/Cargo.toml
      - name: Locked build
        shell: bash
        run: |
          cargo generate-lockfile --manifest-path experiments/mqr-4.34/external/regex/Cargo.toml
          cargo build --locked --manifest-path experiments/mqr-4.34/external/regex/Cargo.toml
      - name: Execute fresh direct extension
        shell: bash
        run: |
          BIN=experiments/mqr-4.34/external/regex/target/debug/mqr434-regex-probe
          "$BIN" direct > "regex-direct-${{ matrix.regime }}.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: regex-direct-${{ matrix.regime }}
          path: regex-direct-${{ matrix.regime }}.tsv
          retention-days: 30

  direct_adjudicate:
    needs: direct
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: regex-direct-*
          path: results
          merge-multiple: true
      - name: Adjudicate direct extension
        shell: bash
        run: |
          set -euo pipefail
          DIRECT=TRANSPORT_FAIL
          if cmp -s results/regex-direct-A.tsv results/regex-direct-C.tsv; then DIRECT=TRANSPORT_PASS; fi
          echo "DIRECT_A_TO_C=$DIRECT"
          echo 'RELATION_RETYPE=FORBIDDEN'
          echo 'AUTHORITY_REMAINS=A1_EXTENSION_REQUIRES_FRESH_CONTACT'
          echo 'REGEX_001_FRESH_RELATION_STRESS=PASS'
