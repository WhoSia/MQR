name: MQR 5.5 Formal Candidate Verification
# Read-only proof/test verification. No generated repository commits.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mqr-55-formal-candidates.yml'
      - 'language/real/lean/MQR/FeedbackIdentification.lean'
      - 'language/real/lean/MQR/FeedbackDynamics.lean'
      - 'language/real/lean/MQR/PartialObservation.lean'
      - 'language/real/lean/MQR/IrreversibleInquiry.lean'
      - 'language/real/lean/MQR/MeasurementReactivity.lean'
      - 'language/real/lean/MQR/ScientificStateQuotient.lean'
      - 'language/real/lean/lean-toolchain'
      - 'language/real/prolog/feedback_identification_v55.pl'
      - 'language/real/prolog/feedback_dynamics_v55.pl'
      - 'language/real/prolog/partial_observation_v55.pl'
      - 'language/real/prolog/irreversible_inquiry_v55.pl'
      - 'language/real/prolog/measurement_reactivity_v55.pl'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: false
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - name: Check exact candidate modules
        working-directory: language/real/lean
        run: |
          set -euo pipefail
          git rev-parse HEAD
          lean --version
          lake build MQR.ScientificStateQuotient
          for module in FeedbackIdentification FeedbackDynamics PartialObservation IrreversibleInquiry MeasurementReactivity; do
            lake env lean "MQR/${module}.lean" | tee "/tmp/${module}.log"
            if grep -E 'sorryAx|declaration uses .sorry.' "/tmp/${module}.log"; then exit 1; fi
          done
  prolog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      - name: Run candidate suites
        run: |
          set -euo pipefail
          git rev-parse HEAD
          swipl --version
          for module in feedback_identification_v55 feedback_dynamics_v55 partial_observation_v55 irreversible_inquiry_v55 measurement_reactivity_v55; do
            source="language/real/prolog/${module}.pl"
            log="/tmp/${module}.log"
            expected=$(grep -c '^test(' "$source")
            swipl -q -s "$source" -g run_tests -t halt 2>&1 | tee "$log"
            if grep -E 'ERROR:|Syntax error' "$log"; then exit 1; fi
            actual=$(grep -cE '% \[[0-9]+/[0-9]+\]' "$log" || true)
            test "$actual" -eq "$expected"
            echo "VERIFIED_TEST_COUNT $module $actual/$expected"
          done
