name: MQR 4.93 — Frozen Original-Species Geosite Spatial Risk
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.93/serov_geosite_original_risk.py'
      - '.github/workflows/mqr-4.93-geosite-risk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-geosite-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Publisher-Compatible Risk Function Dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.12.0 cvxopt==1.3.2 scikit-learn==1.5.1
      - name: Execute Presealed Pinned Geographic Site-Disjoint Risk
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/mqr-4.92:experiments/mqr-4.93 python experiments/mqr-4.93/serov_geosite_original_risk.py 2>&1 | tee mqr493-geosite-risk.log
          grep -Fx MQR493_GEOSITE_RISK=PASS mqr493-geosite-risk.log
      - name: Preserve Diagnostic Artifacts Even On Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MQR493-Pinned-Original-Species-Geosite-Risk
          path: |
            mqr493-geosite-risk.log
            mqr493-geographic-original-risk.json
          retention-days: 30
