name: MQR 4.22 Rotation Recovery Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mqr-4.22-rotation-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state-machine:
    runs-on: ubuntu-latest
    steps:
      - name: Execute frozen rotation and anti-recentralization tests
        run: |
          python - <<'PY'
          def rotate(old_key_auth, recovery_auth):
              return bool(old_key_auth or recovery_auth)

          def promotion(constitution, execution, provenance_time, author_key):
              # Author continuity is additive evidence, never a super-key.
              return bool(constitution and execution and provenance_time)

          tests = {
              "rotation_with_old_key": rotate(True, False) is True,
              "rotation_with_recovery": rotate(False, True) is True,
              "rotation_without_authority_blocked": rotate(False, False) is False,
              "author_key_cannot_override_constitution_fail": promotion(False, True, True, True) is False,
              "author_key_cannot_override_execution_fail": promotion(True, False, True, True) is False,
              "author_key_cannot_override_provenance_fail": promotion(True, True, False, True) is False,
              "promotion_without_author_key_still_scientifically_valid": promotion(True, True, True, False) is True,
          }

          state="ACTIVE_K1"
          state="COMPROMISED_K1"
          k1_future_authorization=False
          state="REVOKED_K1"
          recovery_auth=True
          if not rotate(False,recovery_auth):
              raise SystemExit("recovery transition blocked unexpectedly")
          state="ACTIVE_K2"

          tests["compromised_k1_future_authorization_blocked"] = (k1_future_authorization is False)
          tests["recovery_reaches_active_k2"] = (state=="ACTIVE_K2")

          for k,v in tests.items():
              print(f"{k}={'PASS' if v else 'FAIL'}")
          if not all(tests.values()):
              raise SystemExit(1)
          print("ROTATION_RECOVERY_GATE=PASS")
          print("AUTHOR_KEY_SUPERKEY_ATTACK=BLOCKED")
          PY
