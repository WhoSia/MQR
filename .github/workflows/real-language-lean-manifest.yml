name: Real-Language v0.4 One-Shot Lake Manifest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-language-lean-manifest.yml'

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Materialize Lake manifest only
        shell: bash
        run: |
          set -euo pipefail
          cd language/real/lean
          "$HOME/.elan/bin/lake" update
          test -f lake-manifest.json

      - name: Commit generated manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add language/real/lean/lake-manifest.json
          if git diff --cached --quiet; then
            echo 'Lake manifest already current.'
          else
            git commit -m 'Real-Language v0.4: materialize pinned Lake manifest'
            git push
          fi
