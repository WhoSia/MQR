name: Real-Language v0.4 Lake Manifest Verification
# Repository governance: Actions are read-only. Generated bytes must be promoted by a human-authored commit.

on:
  push:
    branches: [main]
    paths:
      - 'language/real/lean/**'
      - '.github/workflows/real-language-lean-manifest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'language/real/lean/**'
      - '.github/workflows/real-language-lean-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify pinned Lake manifest is reproducible
        shell: bash
        run: |
          set -euo pipefail
          cp language/real/lean/lake-manifest.json /tmp/lake-manifest.before.json
          cd language/real/lean
          "$HOME/.elan/bin/lake" update
          cmp -s lake-manifest.json /tmp/lake-manifest.before.json || {
            echo 'lake-manifest.json is stale. Regenerate locally and commit it with a human author.'
            diff -u /tmp/lake-manifest.before.json lake-manifest.json || true
            exit 1
          }
