name: MQR-4.54 Invariance-Constitution Authority Court

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.54/**'
      - 'language/real/src/invariance_v21.rs'
      - 'language/real/prolog/invariance_v21.pl'
      - 'language/real/examples/mqr-4.54-*.real'
      - 'language/real/tests/v21-invalid-*.real'
      - 'language/real/V21-INVARIANCE-CONSTITUTION.md'
      - 'language/real/Cargo.toml'
      - '.github/workflows/mqr-4.54-invariance-constitution-court.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  invariance-constitution-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install independent relational evaluator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swi-prolog-nox

      - name: Build canonical v0.21 evaluator
        run: cargo build --manifest-path language/real/Cargo.toml --release --bin real-v21-invariance

      - name: Execute Rust-Prolog v0.21 concordance
        shell: bash
        run: |
          set -euo pipefail
          V=./language/real/target/release/real-v21-invariance
          P=language/real/prolog/invariance_v21.pl

          for f in language/real/examples/mqr-4.54-*.real; do
            "$V" "$f" > /tmp/rust
            swipl -q -s "$P" -g "run('$f'),halt" -t "halt(1)" > /tmp/prolog
            grep '^invariance\.' /tmp/rust > /tmp/rust.core
            grep '^invariance\.' /tmp/prolog > /tmp/prolog.core
            diff -u /tmp/rust.core /tmp/prolog.core
          done

          "$V" language/real/examples/mqr-4.54-local-groupoid.real > /tmp/local
          grep -F 'invariance.grammar=GROUPOID' /tmp/local
          grep -F 'invariance.scope=SUBSYSTEM' /tmp/local
          grep -F 'invariance.embedding_status=LOCAL_ONLY' /tmp/local
          grep -F 'invariance.constitution_admissible=YES' /tmp/local
          grep -F 'invariance.global_transport=NO' /tmp/local
          grep -F 'invariance.wcicr=EARNED_LOCAL_CANDIDATE' /tmp/local

          "$V" language/real/examples/mqr-4.54-over-quotient.real > /tmp/over
          grep -F 'invariance.intervention_preservation=FAIL' /tmp/over
          grep -F 'invariance.constitution_admissible=NO' /tmp/over
          grep -F 'invariance.diagnosis=OVER_QUOTIENT' /tmp/over

          "$V" language/real/examples/mqr-4.54-posthoc-capture.real > /tmp/capture
          grep -F 'invariance.preseal_provenance=POSTHOC' /tmp/capture
          grep -F 'invariance.constitution_admissible=NO' /tmp/capture
          grep -F 'invariance.diagnosis=CONSTITUTION_CAPTURE' /tmp/capture

          "$V" language/real/examples/mqr-4.54-global-receipt.real > /tmp/global
          grep -F 'invariance.constitution_admissible=YES' /tmp/global
          grep -F 'invariance.global_transport=YES_WITHIN_DECLARED_SCOPE' /tmp/global
          grep -F 'invariance.unique_global_constitution=NOT_EARNED' /tmp/global

          "$V" language/real/examples/mqr-4.54-partial-family.real > /tmp/partial
          grep -F 'invariance.grammar=PARTIAL_FAMILY' /tmp/partial
          grep -F 'invariance.composition_status=PARTIAL_VERIFIED' /tmp/partial
          grep -F 'invariance.grammar_closure_adequate=YES' /tmp/partial
          grep -F 'invariance.constitution_admissible=YES' /tmp/partial

          for x in language/real/tests/v21-invalid-*.real; do
            if "$V" "$x"; then exit 1; fi
            if swipl -q -s "$P" -g "run('$x'),halt" -t "halt(1)"; then exit 1; fi
          done

          echo REAL_LANGUAGE_V21_RUST_PROLOG_CONCORDANCE=PASS
          echo MQR454_TYPED_TRANSFORMATION_GRAMMAR=PASS
          echo MQR454_GLOBAL_RECEIPT_NE_UNIQUE_GLOBAL_CONSTITUTION=PASS

      - name: Execute frozen invariance-constitution countermodel court
        shell: bash
        run: |
          set -euo pipefail
          python experiments/mqr-4.54/constitution_court.py | tee /tmp/mqr454.log

          grep -F 'mqr454.subsystem_inert_relationally_active=PASS' /tmp/mqr454.log
          grep -F 'mqr454.generator_certification_not_closure=PASS' /tmp/mqr454.log
          grep -F 'mqr454.over_quotient_intervention_split=PASS' /tmp/mqr454.log
          grep -F 'mqr454.under_quotient_redundancy=PASS' /tmp/mqr454.log
          grep -F 'mqr454.target_capture_detected=PASS' /tmp/mqr454.log
          grep -F 'mqr454.morphism_exclusion_capture_detected=PASS' /tmp/mqr454.log
          grep -F 'mqr454.rival_constitutions_fresh_split=PASS' /tmp/mqr454.log
          grep -F 'mqr454.meta_invariance_not_terminal=PASS' /tmp/mqr454.log
          grep -F 'mqr454.legitimate_local_quotient=ADMIT' /tmp/mqr454.log
          grep -F 'mqr454.partial_transformation_grammar=ADMIT' /tmp/mqr454.log
          grep -F 'mqr454.reopenable_refinement=ADMIT' /tmp/mqr454.log
          grep -F 'mqr454.self_authorizing_invariance=REJECT' /tmp/mqr454.log
          grep -F 'mqr454.unique_global_invariance_constitution=NOT_EARNED' /tmp/mqr454.log
          grep -F 'mqr454.wcicr=CANDIDATE' /tmp/mqr454.log
          grep -F 'mqr454.actual_symmetry_equals_current_certification=NO' /tmp/mqr454.log
          grep -F 'mqr454.transformation_grammar_default=TYPE_REQUIRED' /tmp/mqr454.log

      - name: Upload constitution court report
        uses: actions/upload-artifact@v4
        with:
          name: mqr-4.54-invariance-constitution-report-${{ github.sha }}
          path: experiments/mqr-4.54/results/constitution_report.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish externally readable workflow receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          context="MQR-4.54/Court"
          description="run ${GITHUB_RUN_ID}: ${{ job.status }}"
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="$context" -f description="$description" -f target_url="$target"
