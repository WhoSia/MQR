name: MQR-4.58 Lean Regression

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.58/FINAL-SEAL.md'
      - 'language/real/lean/MQR/StrategicEcology.lean'
      - 'language/real/lean/MQR/ReflexiveEcology.lean'
      - 'language/real/V25-REFLEXIVE-ECOLOGY.md'
      - '.github/workflows/mqr-4.58-lean.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  lean-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cumulative Lean package
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false

      - name: Regress v0.24 and compile v0.25
        shell: bash
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/StrategicEcology.lean | tee /tmp/v24.log
          lake env lean MQR/ReflexiveEcology.lean | tee /tmp/v25.log

          if grep -F 'sorryAx' /tmp/v24.log; then exit 1; fi
          if grep -F 'sorryAx' /tmp/v25.log; then exit 1; fi

          grep -F "'MQR.strategicEquilibriumNeedNotImplyEpistemicAdequacy' does not depend on any axioms" /tmp/v24.log
          grep -F "'MQR.stageClosureDoesNotImplySuccessorImmunity' does not depend on any axioms" /tmp/v25.log
          grep -F "'MQR.drakeCanHaveHighScaffoldValueWithoutNumericAuthorityPromotion' does not depend on any axioms" /tmp/v25.log
          grep -F "'MQR.finalReflectiveFixedPointRemainsUnearned' does not depend on any axioms" /tmp/v25.log

          echo MQR458_LEAN_REGRESSION_INTEGRATION=PASS

      - name: Publish receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="MQR-4.58/Lean-Integration" \
            -f description="run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
