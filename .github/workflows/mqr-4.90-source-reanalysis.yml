name: MQR-4.90 Source-Reported AUC Reanalysis
on:
  push:
    branches: [main, mqr-4.90-empirical-source-reanalysis]
    paths:
      - 'experiments/mqr-4.90/**'
      - '.github/workflows/mqr-4.90-source-reanalysis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-reanalysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check table provenance and fail-closed admission gates
        run: |
          set -euo pipefail
          python -m compileall -q experiments/mqr-4.90/
          python experiments/mqr-4.90/audit_reported_oracle_auc.py --self-test
          python experiments/mqr-4.90/audit_reported_oracle_auc.py | tee mqr490-verdict.txt
          grep -Fx 'MQR490_ORACLE_ROWS=36' mqr490-verdict.txt
          grep -Fx 'MQR490_SOURCE_CELLS=144' mqr490-verdict.txt
          grep -Fx 'MQR490_PRIMARY_EFFECTS_ADMITTED=0' mqr490-verdict.txt
          grep -Fx 'MQR490_POOLED_ESTIMATE=HOLD' mqr490-verdict.txt
          python experiments/mqr-4.90/audit_reported_oracle_auc.py --json > mqr490-reanalysis.json
      - name: Verify target-outcome oracle selection counterexample
        run: |
          set -euo pipefail
          python experiments/mqr-4.90/target_oracle_selection_counterexample.py | tee target-selection.log
          grep -Fx 'MQR490_TARGET_CONDITIONED_NULL_AUC=0.875' target-selection.log
          grep -Fx 'MQR490_UNFILTERED_NULL_AUC=0.5' target-selection.log
          grep -Fx 'MQR490_POSTSELECTION_GAP=0.375' target-selection.log
          grep -Fx 'MQR490_ORIGINAL_SEROV_REPLICATION=NOT_PERFORMED' target-selection.log
          grep -Fx 'MQR490_NULL_AUC_EXACT_TEST=PASS' target-selection.log
      - name: Audit corrected Matsui geographically linked scores without pooling
        run: |
          set -euo pipefail
          python experiments/mqr-4.90/audit_matsui_external_auc.py | tee matsui-audit.log
          grep -Fx 'MQR490_MATSUI_MATCHED_SCORE_ROWS=10' matsui-audit.log
          grep -Fx 'MQR490_MATSUI_SOURCE_FAMILIES=3' matsui-audit.log
          grep -Fx 'MQR490_MATSUI_OXALIS_REVERSAL=PASS' matsui-audit.log
          grep -Fx 'MQR490_MATSUI_DESIGN_MISMATCH=CONFIRMED' matsui-audit.log
          grep -Fx 'MQR490_MATSUI_META_POOLING=HOLD' matsui-audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: MQR490-Source-Reported-AUC-Receipt
          path: |
            mqr490-verdict.txt
            mqr490-reanalysis.json
            target-selection.log
            matsui-audit.log
          retention-days: 30
