name: "MQR 4.100 P2 — Approximate Projection and Pairing"
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.100/**'
      - '.github/workflows/mqr-4.100-p2-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Eight finite-TV and pairing checks
        shell: bash
        run: |
          set -euo pipefail
          cargo test --offline --manifest-path experiments/mqr-4.100/Cargo.toml --bin p2_court -- --nocapture 2>&1 | tee mqr4100-p2-rust.log
          grep -F 'test result: ok. 8 passed' mqr4100-p2-rust.log
          cargo run --offline --manifest-path experiments/mqr-4.100/Cargo.toml --bin p2_court 2>&1 | tee -a mqr4100-p2-rust.log
          grep -F 'P2_SCOPE=constructed_finite_laws; pairing/source_transport/field_truth=HOLD' mqr4100-p2-rust.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MQR4100-P2-Rust-Finite-TV
          path: mqr4100-p2-rust.log
          retention-days: 30
  coordinate-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/mqr-4.100/lean
          build: true
          test: false
          use-mathlib-cache: false
      - name: Verify discrete projection inequalities
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' experiments/mqr-4.100/lean/Mqr4100Approx.lean
          cd experiments/mqr-4.100/lean
          lake env lean Mqr4100Approx.lean 2>&1 | tee ../../../mqr4100-p2-lean.log
          echo MQR4100_P2_LEAN_DISCRETE_BOUNDS_PASS | tee -a ../../../mqr4100-p2-lean.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MQR4100-P2-Lean-Coordinate
          path: |
            experiments/mqr-4.100/lean/Mqr4100Approx.lean
            mqr4100-p2-lean.log
          retention-days: 30
