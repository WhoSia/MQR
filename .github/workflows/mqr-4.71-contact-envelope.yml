name: MQR-4.71 Scientific-Contact Envelope Constitution Court

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.71/**'
      - 'language/real/lean/MQR/ContactEnvelope.lean'
      - '.github/workflows/mqr-4.71-contact-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  canonical-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical envelope dynamics court
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.71/envelope_court.py | tee /tmp/mqr471.log
          grep -F 'MQR471_ENVELOPE_COURT=PASS' /tmp/mqr471.log
          grep -F 'MQR471_CURRENT_ENVELOPE_INSUFFICIENT=YES' /tmp/mqr471.log
          grep -F 'MQR471_THEORY_ONLY_SELF_SEALS=YES' /tmp/mqr471.log
          grep -F 'MQR471_PLURAL_GENERATOR_ADMITS_RIVAL=YES' /tmp/mqr471.log
          grep -F 'MQR471_ANCESTRY_NULL=YES' /tmp/mqr471.log
          grep -F 'MQR471_COMPACT_STATE_SUFFICIENT=YES' /tmp/mqr471.log
          grep -F 'MQR471_ETHICS_EPISTEMIC_SEPARATION=YES' /tmp/mqr471.log
          grep -F 'MQR471_COST_EPISTEMIC_SEPARATION=YES' /tmp/mqr471.log
          grep -F 'MQR471_TECHNOLOGY_UNLOCK=YES' /tmp/mqr471.log
      - uses: actions/upload-artifact@v4
        with:
          name: mqr-4.71-envelope-results
          path: experiments/mqr-4.71/results/

  independent-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independent C++ envelope dynamics court
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 experiments/mqr-4.71/independent_envelope_court.cpp -o /tmp/mqr471-cpp
          /tmp/mqr471-cpp | tee /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_ENVELOPE_COURT=PASS' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_CURRENT_ENVELOPE_INSUFFICIENT=YES' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_THEORY_ONLY_SELF_SEALS=YES' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_PLURAL_GENERATOR_ADMITS_RIVAL=YES' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_ANCESTRY_NULL=YES' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_COMPACT_STATE_SUFFICIENT=YES' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_TECHNOLOGY_UNLOCK=YES' /tmp/mqr471-cpp.log

  transport-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contact transport court
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.71/transport_court.py | tee /tmp/mqr471-transport.log
          grep -F 'MQR471_TRANSPORT_COURT=PASS' /tmp/mqr471-transport.log
          grep -F 'MQR471_LABEL_ONLY_INSUFFICIENT=YES' /tmp/mqr471-transport.log

  lean-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - name: Verify contact-envelope theorem boundary
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/ContactEnvelope.lean | tee /tmp/mqr471-lean.log
          if grep -F 'sorryAx' /tmp/mqr471-lean.log; then exit 1; fi
          for theorem in             MQR.same_current_envelope_can_have_different_future_contact             MQR.operational_identity_implies_future_identity             MQR.ancestry_label_need_not_change_future
          do
            grep -F "'$theorem' does not depend on any axioms" /tmp/mqr471-lean.log
          done
          echo MQR471_LEAN=PASS

  structural-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen boundaries
        run: |
          set -euo pipefail
          grep -F 'Theory-generator circularity' experiments/mqr-4.71/PRESEAL.md
          grep -F 'Full-history overretention' experiments/mqr-4.71/PRESEAL.md
          grep -F 'Ethics-epistemics conflation' experiments/mqr-4.71/PRESEAL.md
          grep -F 'Technology-finality error' experiments/mqr-4.71/PRESEAL.md
          grep -F 'MQR-4.62 duplication' experiments/mqr-4.71/PRESEAL.md
          grep -F $'S_THEORY\tBASE_A,BASE_B\tTHEORY' experiments/mqr-4.71/STATE-FREEZE.tsv
          grep -F $'G2\tS_PLURAL\tRIVAL_ENTRY\tRIVAL_X' experiments/mqr-4.71/TRIGGER-FREEZE.tsv
          echo MQR471_STRUCTURAL_GUARDS=PASS
