name: MQR-4.71 Scientific-Contact Envelope Constitution Court

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.71/**'
      - 'language/real/lean/MQR/ContactEnvelope.lean'
      - 'language/real/lean/MQR/MetaClosure.lean'
      - 'language/real/lean/MQR/ContactScope.lean'
      - '.github/workflows/mqr-4.71-contact-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  canonical-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical envelope dynamics court
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.71/envelope_court.py | tee /tmp/mqr471.log
          grep -F 'MQR471_ENVELOPE_COURT=PASS' /tmp/mqr471.log
          grep -F 'MQR471_CURRENT_ENVELOPE_INSUFFICIENT=YES' /tmp/mqr471.log
          grep -F 'MQR471_THEORY_ONLY_SELF_SEALS=YES' /tmp/mqr471.log
          grep -F 'MQR471_PLURAL_GENERATOR_ADMITS_RIVAL=YES' /tmp/mqr471.log
          grep -F 'MQR471_ANCESTRY_NULL=YES' /tmp/mqr471.log
          grep -F 'MQR471_COMPACT_STATE_SUFFICIENT=YES' /tmp/mqr471.log
          grep -F 'MQR471_ETHICS_EPISTEMIC_SEPARATION=YES' /tmp/mqr471.log
          grep -F 'MQR471_COST_EPISTEMIC_SEPARATION=YES' /tmp/mqr471.log
          grep -F 'MQR471_TECHNOLOGY_UNLOCK=YES' /tmp/mqr471.log
      - uses: actions/upload-artifact@v4
        with:
          name: mqr-4.71-envelope-results
          path: experiments/mqr-4.71/results/

  independent-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independent C++ envelope dynamics court
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 experiments/mqr-4.71/independent_envelope_court.cpp -o /tmp/mqr471-cpp
          /tmp/mqr471-cpp | tee /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_ENVELOPE_COURT=PASS' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_CURRENT_ENVELOPE_INSUFFICIENT=YES' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_THEORY_ONLY_SELF_SEALS=YES' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_PLURAL_GENERATOR_ADMITS_RIVAL=YES' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_ANCESTRY_NULL=YES' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_COMPACT_STATE_SUFFICIENT=YES' /tmp/mqr471-cpp.log
          grep -F 'MQR471_CPP_TECHNOLOGY_UNLOCK=YES' /tmp/mqr471-cpp.log

  transport-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contact transport court
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.71/transport_court.py | tee /tmp/mqr471-transport.log
          grep -F 'MQR471_TRANSPORT_COURT=PASS' /tmp/mqr471-transport.log
          grep -F 'MQR471_LABEL_ONLY_INSUFFICIENT=YES' /tmp/mqr471-transport.log

  lean-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - name: Verify contact-envelope theorem boundary
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/ContactEnvelope.lean | tee /tmp/mqr471-lean.log
          if grep -F 'sorryAx' /tmp/mqr471-lean.log; then exit 1; fi
          for theorem in             MQR.same_current_envelope_can_have_different_future_contact             MQR.operational_identity_implies_future_identity             MQR.ancestry_label_need_not_change_future
          do
            grep -F "'$theorem' does not depend on any axioms" /tmp/mqr471-lean.log
          done
          echo MQR471_LEAN=PASS
      - name: Verify contact-scope theorem boundary
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/ContactScope.lean | tee /tmp/mqr471-scope-lean.log
          if grep -F 'sorryAx' /tmp/mqr471-scope-lean.log; then exit 1; fi
          for theorem in \
            MQR.scientific_defeater_need_not_be_execution_defeater \
            MQR.permission_unlock_can_change_execution_defeat_without_changing_scientific_defeat \
            MQR.execution_defeater_implies_scientific_defeater
          do
            grep -F "'$theorem' does not depend on any axioms" /tmp/mqr471-scope-lean.log
          done
          echo MQR471_SCOPE_LEAN=PASS

  structural-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen boundaries
        run: |
          set -euo pipefail
          grep -F 'Theory-generator circularity' experiments/mqr-4.71/PRESEAL.md
          grep -F 'Full-history overretention' experiments/mqr-4.71/PRESEAL.md
          grep -F 'Ethics-epistemics conflation' experiments/mqr-4.71/PRESEAL.md
          grep -F 'Technology-finality error' experiments/mqr-4.71/PRESEAL.md
          grep -F 'MQR-4.62 duplication' experiments/mqr-4.71/PRESEAL.md
          grep -F $'S_THEORY\tBASE_A,BASE_B\tTHEORY' experiments/mqr-4.71/STATE-FREEZE.tsv
          grep -F $'G2\tS_PLURAL\tRIVAL_ENTRY\tRIVAL_X' experiments/mqr-4.71/TRIGGER-FREEZE.tsv
          echo MQR471_STRUCTURAL_GUARDS=PASS


  meta-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exhaustive visible-view closure court
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.71/meta_closure_court.py | tee /tmp/mqr471-meta.log
          grep -F 'MQR471_META_CLOSURE=PASS' /tmp/mqr471-meta.log
          grep -F 'MQR471_VISIBLE_VIEWS=1' /tmp/mqr471-meta.log
          grep -F 'MQR471_COMPATIBLE_WORLDS=2' /tmp/mqr471-meta.log
          grep -F 'MQR471_VIEW_ONLY_CERTIFIERS=2' /tmp/mqr471-meta.log
          grep -F 'MQR471_UNIFORMLY_CORRECT_CERTIFIERS=0' /tmp/mqr471-meta.log
          grep -F 'MQR471_GENERATOR_OUTPUT_COMPLETENESS_UNEARNED=YES' /tmp/mqr471-meta.log
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: language/real/lean
          build: true
          test: false
          lint: false
          nanoda: false
          use-github-cache: false
      - name: Verify meta-closure theorem boundary
        run: |
          set -euo pipefail
          cd language/real/lean
          lake env lean MQR/MetaClosure.lean | tee /tmp/mqr471-meta-lean.log
          if grep -F 'sorryAx' /tmp/mqr471-meta-lean.log; then exit 1; fi
          for theorem in \
            MQR.same_visible_view_opposite_true_closure \
            MQR.visible_only_certifier_cannot_be_correct_on_both
          do
            grep -F "'$theorem' does not depend on any axioms" /tmp/mqr471-meta-lean.log
          done
          echo MQR471_META_LEAN=PASS


  generative-quotient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit immutable phase-I proxy aliasing
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.71/phase1_proxy_alias_audit.py | tee /tmp/mqr471-gq1.log
          grep -F 'MQR471_PHASE1_ALIAS_AUDIT=PASS' /tmp/mqr471-gq1.log
          grep -F 'MQR471_PHASE1_MINIMAL_COUNT=2' /tmp/mqr471-gq1.log
          grep -F 'MQR471_PHASE1_ANCESTRY_PROXY=YES' /tmp/mqr471-gq1.log
      - name: Prospective phase-II proxy separation
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.71/proxy_separated_quotient.py | tee /tmp/mqr471-gq2.log
          grep -F 'MQR471_PHASE2_PROXY_SEPARATION=PASS' /tmp/mqr471-gq2.log
          grep -F 'MQR471_PHASE2_RAW_STATES=8' /tmp/mqr471-gq2.log
          grep -F 'MQR471_PHASE2_PREDICTIVE_CLASSES=5' /tmp/mqr471-gq2.log
          grep -F 'MQR471_PHASE2_MINIMAL_FEATURE_COUNT=4' /tmp/mqr471-gq2.log
          grep -F 'MQR471_PHASE2_MINIMAL_FEATURE_SET=generators,tech_state,budget_state,ethics_state' /tmp/mqr471-gq2.log
          grep -F 'MQR471_PHASE2_ANCESTRY_PROXY_BROKEN=YES' /tmp/mqr471-gq2.log
      - name: Independent C++ phase-II quotient
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 experiments/mqr-4.71/independent_proxy_separated_quotient.cpp -o /tmp/mqr471-gq2-cpp
          /tmp/mqr471-gq2-cpp | tee /tmp/mqr471-gq2-cpp.log
          grep -F 'MQR471_CPP_PHASE2_PROXY_SEPARATION=PASS' /tmp/mqr471-gq2-cpp.log
          grep -F 'MQR471_CPP_PHASE2_RAW_STATES=8' /tmp/mqr471-gq2-cpp.log
          grep -F 'MQR471_CPP_PHASE2_PREDICTIVE_CLASSES=5' /tmp/mqr471-gq2-cpp.log
          grep -F 'MQR471_CPP_PHASE2_MINIMAL_FEATURE_COUNT=4' /tmp/mqr471-gq2-cpp.log
          grep -F 'MQR471_CPP_PHASE2_MINIMAL_FEATURE_SET=generators,tech_state,budget_state,ethics_state' /tmp/mqr471-gq2-cpp.log
          grep -F 'MQR471_CPP_PHASE2_ANCESTRY_PROXY_BROKEN=YES' /tmp/mqr471-gq2-cpp.log
      - uses: actions/upload-artifact@v4
        with:
          name: mqr-4.71-generative-quotient
          path: experiments/mqr-4.71/results/proxy_separated_quotient.tsv


  closure-defeasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical dual-scope closure court
        run: |
          set -euo pipefail
          python3 experiments/mqr-4.71/closure_defeasibility_court.py | tee /tmp/mqr471-cd.log
          grep -F 'MQR471_CLOSURE_DEFEASIBILITY=PASS' /tmp/mqr471-cd.log
          grep -F 'MQR471_CASES=16' /tmp/mqr471-cd.log
          grep -F 'MQR471_SCOPE_SEPARATION_CASES=3' /tmp/mqr471-cd.log
          grep -F 'MQR471_EXECUTION_COMPLETE_NE_SCIENTIFIC_COMPLETE=YES' /tmp/mqr471-cd.log
      - name: Independent C++ dual-scope closure court
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 experiments/mqr-4.71/independent_closure_defeasibility.cpp -o /tmp/mqr471-cd-cpp
          /tmp/mqr471-cd-cpp | tee /tmp/mqr471-cd-cpp.log
          grep -F 'MQR471_CPP_CLOSURE_DEFEASIBILITY=PASS' /tmp/mqr471-cd-cpp.log
          grep -F 'MQR471_CPP_CASES=16' /tmp/mqr471-cd-cpp.log
          grep -F 'MQR471_CPP_SCOPE_SEPARATION_CASES=3' /tmp/mqr471-cd-cpp.log
          grep -F 'MQR471_CPP_EXECUTION_COMPLETE_NE_SCIENTIFIC_COMPLETE=YES' /tmp/mqr471-cd-cpp.log
      - uses: actions/upload-artifact@v4
        with:
          name: mqr-4.71-closure-defeasibility
          path: experiments/mqr-4.71/results/closure_defeasibility.tsv
