name: MQR-4.111 finite prior-state probe fixtures
on:
  push:
    branches: [main]
    paths:
      - "experiments/mqr-4.111/src/main.rs"
      - "experiments/mqr-4.111/costas_2012_table2.rs"
      - "experiments/mqr-4.111/guerin_2021_fer_covariance.rs"
      - "experiments/mqr-4.111/source_rival_and_join_gate.rs"
      - "experiments/mqr-4.111/fer_bin_v4_record_gate.rs"
      - ".github/workflows/mqr-4.111-irrev-probe-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Execute bounded exact finite fixtures
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 --test -D warnings \
            experiments/mqr-4.111/src/main.rs -o "$RUNNER_TEMP/mqr-4111-tests"
          "$RUNNER_TEMP/mqr-4111-tests" --nocapture
          rustc --edition=2021 -D warnings \
            experiments/mqr-4.111/src/main.rs -o "$RUNNER_TEMP/mqr-4111-main"
          "$RUNNER_TEMP/mqr-4111-main"
          rustc --edition=2021 --test -D warnings \
            experiments/mqr-4.111/costas_2012_table2.rs -o "$RUNNER_TEMP/mqr-4111-costas-tests"
          "$RUNNER_TEMP/mqr-4111-costas-tests" --nocapture
          rustc --edition=2021 -D warnings \
            experiments/mqr-4.111/costas_2012_table2.rs -o "$RUNNER_TEMP/mqr-4111-costas-main"
          "$RUNNER_TEMP/mqr-4111-costas-main"
          rustc --edition=2021 --test -D warnings \
            experiments/mqr-4.111/guerin_2021_fer_covariance.rs -o "$RUNNER_TEMP/mqr-4111-fer-tests"
          "$RUNNER_TEMP/mqr-4111-fer-tests" --nocapture
          rustc --edition=2021 -D warnings \
            experiments/mqr-4.111/guerin_2021_fer_covariance.rs -o "$RUNNER_TEMP/mqr-4111-fer-main"
          "$RUNNER_TEMP/mqr-4111-fer-main"
          rustc --edition=2021 --test -D warnings \
            experiments/mqr-4.111/source_rival_and_join_gate.rs -o "$RUNNER_TEMP/mqr-4111-p7-tests"
          "$RUNNER_TEMP/mqr-4111-p7-tests" --nocapture
          rustc --edition=2021 -D warnings \
            experiments/mqr-4.111/source_rival_and_join_gate.rs -o "$RUNNER_TEMP/mqr-4111-p7-main"
          "$RUNNER_TEMP/mqr-4111-p7-main"
          rustc --edition=2021 --test -D warnings \
            experiments/mqr-4.111/fer_bin_v4_record_gate.rs -o "$RUNNER_TEMP/mqr-4111-p8-tests"
          "$RUNNER_TEMP/mqr-4111-p8-tests" --nocapture
          rustc --edition=2021 -D warnings \
            experiments/mqr-4.111/fer_bin_v4_record_gate.rs -o "$RUNNER_TEMP/mqr-4111-p8-main"
          "$RUNNER_TEMP/mqr-4111-p8-main"
