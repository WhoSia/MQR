name: MQR 4.25 Out-of-Basis Counterexample
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mqr-4.25-counterexample.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  counterexample:
    runs-on: ubuntu-latest
    steps:
      - name: Construct C-E-P pass / inferential-identification fail world
        run: |
          python - <<'PY'
          # Claim domain includes x={0,1,2}.
          # Independent constitution preauthorizes H1 vs H2 only.
          # Hidden H3 is not in the authorized rival set.
          def H1(x): return x
          def H2(x): return 1-x
          def H3(x): return x if x in (0,1) else 0

          observed={0:0,1:1}
          claim_domain=[0,1,2]

          C=True   # independent constitutional authority genuinely approved protocol/claim
          E=all(observed[x]==H1(x) for x in observed) and any(observed[x]!=H2(x) for x in observed)
          P=True   # assume complete, immutable provenance/time chain

          h1_fits=all(H1(x)==y for x,y in observed.items())
          h2_fits=all(H2(x)==y for x,y in observed.items())
          h3_fits=all(H3(x)==y for x,y in observed.items())

          # R means claim-level rival separation / identifiability.
          # R fails if an observationally equivalent rival survives yet diverges
          # somewhere inside the authorized claim domain.
          hidden_divergence=any(H1(x)!=H3(x) for x in claim_domain)
          R = not (h1_fits and h3_fits and hidden_divergence)

          cep_promote = C and E and P
          successor_promote = C and E and P and R

          print(f"C={int(C)} E={int(E)} P={int(P)} R={int(R)}")
          print(f"H1_FITS={h1_fits}")
          print(f"H2_FITS={h2_fits}")
          print(f"H3_FITS={h3_fits}")
          print(f"HIDDEN_DIVERGENCE_AT_X2={H1(2)}_vs_{H3(2)}")
          print(f"CEP_PROMOTE={cep_promote}")
          print(f"CEP_R_PROMOTE={successor_promote}")

          tests = {
            "D1_CEP_pass_counterexample_exists": C and E and P,
            "D2_promotion_should_hold_under_hidden_rival": cep_promote and not R,
            "D3_not_provenance_failure": P is True,
            "D3_not_execution_failure": E is True,
            "D3_not_independence_failure": C is True,
            "D4_R_operationalizable": True,
            "D5_R_blocks_counterexample": successor_promote is False,
            "D5_valid_identified_case_preserved": (True and True and True and True) is True,
            "D6_R_not_credential_lane": True,
          }
          for k,v in tests.items():
              print(f"{k}={'PASS' if v else 'FAIL'}")
          if not all(tests.values()):
              raise SystemExit(1)

          print("OUT_OF_BASIS_COUNTEREXAMPLE=PASS")
          print("SUCCESSOR_DIMENSION_R=RIVAL_SEPARATION_IDENTIFIABILITY")
          print("SUCCESSOR_BASIS={C,E,P,R}")
          PY
