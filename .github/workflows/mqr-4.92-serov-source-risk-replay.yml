name: MQR 4.92 — Independent Serov Source Risk Estimator Replay
on:
  push:
    branches: [main]
    paths:
      - 'experiments/mqr-4.92/serov_author_function_replay.py'
      - '.github/workflows/mqr-4.92-serov-source-risk-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies for untouched published estimators
        run: |
          python -m pip install --disable-pip-version-check             numpy==1.26.4 scipy==1.12.0 cvxopt==1.3.2
      - name: Verify frozen original author functions and execute bounded risk checks
        shell: bash
        run: |
          set -euo pipefail
          python experiments/mqr-4.92/serov_author_function_replay.py 2>&1 | tee mqr492-serov-source-replay.log
          grep -Fx MQR492_UPSTREAM_SEROV_PINNED_SOURCE=PASS mqr492-serov-source-replay.log
          grep -Fx MQR492_INDEPENDENT_ESTIMATOR_NUMERICAL_CHECK=PASS mqr492-serov-source-replay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MQR492-Independent-Serov-Risk-Source-Receipt
          path: |
            mqr492-serov-source-replay.log
            mqr492-serov-source-probe.json
          retention-days: 30
